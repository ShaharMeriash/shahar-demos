<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realokate — Interactive Demo</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#FAFAF8;--s0:#fff;--s1:#F5F3F0;--s2:#EDE9E4;--s3:#E0DBD4;--bd:#C0BAD0;
  --ink:#1A1823;--t0:#1A1823;--t1:#3D3848;--t2:#7C7591;--t3:#C0BAD0;
  --g:#EF7960;--g2:rgba(232,107,80,.12);--g3:rgba(232,107,80,.06);
  --b:#3DC4B6;--b2:rgba(62,207,178,.12);
  --am:#F6D034;--am2:rgba(245,196,56,.14);
  --re:#EF7960;--re2:rgba(232,107,80,.12);
  --fd:'Fredoka One','Nunito',sans-serif;--fb:'Inter',sans-serif;
  --r:12px;--rl:18px;--shadow:3px 3px 0 #1A1823;--shadow-sm:2px 2px 0 #1A1823;
}
.phone.dark{
  --bg:#121018;--s0:#1C1828;--s1:#241F32;--s2:#2C273C;--s3:#342F48;--bd:#3D3858;
  --t0:#F0EDE8;--t1:#C0BAD0;--t2:#7C7591;--t3:#4A4560;
  --g:#FF8A6E;--g2:rgba(255,138,110,.15);--g3:rgba(255,138,110,.07);
  --b:#4FDFC4;--b2:rgba(79,223,196,.14);
  --am:#F6D034;--am2:rgba(245,196,56,.14);
  --re:#FF8A6E;--re2:rgba(255,138,110,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E9E4DC;font-family:var(--fb);color:#1A1823;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px}
.demo-bar{width:100%;max-width:430px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px}
.demo-bar a{color:#1A1823;text-decoration:none;font-weight:600;background:#fff;border:2px solid #1A1823;border-radius:10px;padding:6px 12px;box-shadow:2px 2px 0 #1A1823}
.demo-bar .tag{background:#F6D034;border:2px solid #1A1823;border-radius:10px;padding:6px 12px;font-weight:600;box-shadow:2px 2px 0 #1A1823}
.phone{width:100%;max-width:430px;height:min(880px,90vh);background:var(--bg);border:2px solid #1A1823;border-radius:26px;box-shadow:6px 6px 0 #1A1823;display:flex;flex-direction:column;overflow:hidden;position:relative;color:var(--t0)}
/* header */
.app-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px;border-bottom:2px solid var(--ink);background:var(--s0);flex-shrink:0;gap:8px}
.app-head .word{height:26px;flex-shrink:0}
.hbtn{width:34px;height:34px;border:2px solid var(--ink);border-radius:10px;background:var(--s1);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);cursor:pointer;font-size:15px;position:relative;flex-shrink:0}
.hbtn:active{transform:translate(2px,2px);box-shadow:none}
.bell-count{position:absolute;top:-6px;right:-6px;background:var(--re);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:9px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;padding:0 3px}
main{flex:1;overflow-y:auto;padding:16px;padding-bottom:12px;position:relative}
main::-webkit-scrollbar{width:0}
h2.pg{font-family:var(--fd);font-size:22px;font-weight:400;margin-bottom:2px;color:var(--t0)}
.sub{font-size:12.5px;color:var(--t2);margin-bottom:14px}
.card{background:var(--s0);border:2px solid var(--ink);border-radius:var(--rl);box-shadow:var(--shadow);padding:14px;margin-bottom:14px;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.card-title{font-family:var(--fd);font-size:14px;margin-bottom:10px;color:var(--t0)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--fb);font-size:12.5px;font-weight:700;border:2px solid var(--ink);border-radius:11px;padding:8px 14px;cursor:pointer;box-shadow:var(--shadow-sm);background:var(--s0);color:var(--t0);-webkit-tap-highlight-color:transparent}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.g{background:var(--g);color:#fff}
.btn.b{background:var(--b);color:#0A0908}
.btn.sm{font-size:11.5px;padding:6px 11px}
.btn.xs{font-size:10.5px;padding:4px 9px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
/* pace card */
.route{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-size:16px;flex-wrap:wrap;color:var(--t0)}
.route .arr{flex:1;min-width:36px;height:2px;background:var(--ink);position:relative}
.route .arr::after{content:"✈️";position:absolute;right:-4px;top:-11px;font-size:14px}
.days{font-size:12px;color:var(--t2);margin:6px 0 10px}
.pacebar{height:14px;border:2px solid var(--ink);border-radius:8px;background:var(--s1);overflow:hidden;display:flex;position:relative}
.pacebar i{display:block;height:100%}
.pacebar .tmark{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--g);border-radius:2px}
.verdict{margin-top:8px;font-size:12.5px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:11.5px;font-weight:600;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:var(--s0);box-shadow:var(--shadow-sm);cursor:pointer;color:var(--t0)}
.chip:active{transform:translate(2px,2px);box-shadow:none}
.chip.warn{background:var(--g2);color:#c04a30}.phone.dark .chip.warn{color:#FF8A6E}
.chip.amber{background:var(--am2)} .chip.ok{background:var(--b2)} .chip.blue{background:rgba(59,130,246,.12)} .chip.grey{background:var(--s1);color:var(--t2)}
/* crew */
.crew{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.crew .mchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 11px 3px 3px;background:var(--s0);box-shadow:var(--shadow-sm);font-size:12px;font-weight:600;cursor:pointer;color:var(--t0)}
.avv{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:#0A0908;flex-shrink:0}
/* do next */
.donext .row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1.5px dashed var(--s2);cursor:pointer}
.donext .row:last-child{border-bottom:0}
.why{font-size:10px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:2px 8px;white-space:nowrap}
.why.od{background:var(--g2);color:#c04a30}.phone.dark .why.od{color:#FF8A6E}
.why.dt{background:var(--am2);color:var(--t0)} .why.un{background:var(--b2);color:var(--t0)}
.donext .t{flex:1;font-size:13px;font-weight:500;color:var(--t0)}
/* timeline */
.tl-month{font-family:var(--fd);font-size:13px;color:var(--t1);margin:14px 0 6px}
.tl-ev{display:flex;gap:10px;align-items:flex-start;padding:6px 0 6px 4px;border-left:3px solid var(--b);margin-left:6px;padding-left:12px;font-size:13px;cursor:pointer}
.tl-ev b{font-weight:600}
.tl-ev .d{color:var(--t2);font-size:11.5px}
.tl-ev.docev{border-left-color:var(--am)}
.gate-ev{border:2px solid var(--ink);border-radius:var(--r);background:var(--am2);padding:9px 13px;margin:10px 0;box-shadow:var(--shadow-sm);font-size:12.5px}
.gate-ev b{font-family:var(--fd);font-weight:400}
.arrive{background:linear-gradient(135deg,#F6D034,#EF7960);border:2px solid var(--ink);border-radius:var(--r);padding:11px 14px;margin:12px 0 4px;box-shadow:var(--shadow-sm);color:#1A1823}
.arrive .a1{font-family:var(--fd);font-size:15px}
.arrive .a2{font-size:10.5px;opacity:.78;margin-top:1px}
/* seg */
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border:2px solid var(--ink);border-radius:10px;background:var(--s0);font-family:var(--fb);font-size:12px;font-weight:700;color:var(--t2);cursor:pointer;box-shadow:1.5px 1.5px 0 var(--ink);-webkit-tap-highlight-color:transparent}
.seg button.on{background:var(--g);color:#0A0908}
.seg button:active{transform:translate(1.5px,1.5px);box-shadow:none}
/* inputs */
.finput,.fselect,.ftextarea{width:100%;border:2px solid var(--ink);border-radius:11px;padding:9px 12px;font-family:var(--fb);font-size:13px;background:var(--s1);outline:none;color:var(--t0)}
.fselect{appearance:auto}
.flabel{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--t2);font-weight:700;margin-bottom:5px}
/* whose filter */
.pfilter{display:flex;align-items:center;gap:7px;margin:0 0 12px;flex-wrap:wrap}
.pfilter-ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0A0908;border:2px solid var(--ink);cursor:pointer;opacity:.35;transition:opacity .12s,transform .1s}
.pfilter-ava.on{opacity:1;transform:scale(1.06)}
/* plan areas */
.agroup{margin-bottom:12px;border:2px solid var(--ink);border-radius:var(--rl);background:var(--s0);box-shadow:var(--shadow);overflow:hidden}
.agroup-head{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer;user-select:none}
.agroup-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.agroup-main{flex:1;min-width:0}
.agroup-title{font-weight:700;font-size:13.5px;color:var(--t0)}
.agroup-bar{height:5px;background:var(--s2);border-radius:4px;margin-top:5px;overflow:hidden}
.agroup-bar span{display:block;height:100%;border-radius:4px}
.agroup-count{font-size:11px;font-weight:700;color:var(--t2);flex-shrink:0}
.agroup-chev{font-size:14px;color:var(--t3);transition:transform .15s}
.agroup-chev.open{transform:rotate(90deg)}
.agroup-tasks{border-top:1.5px solid var(--s2)}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-bottom:1.5px dashed var(--s2)}
.task:last-child{border-bottom:0}
.task.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.tick{width:22px;height:22px;border:2px solid var(--ink);border-radius:7px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--s0);margin-top:1px;color:var(--t0)}
.tick.done{background:var(--b)} .tick.prog{background:var(--am)}
.task .tt{flex:1;min-width:0;cursor:pointer}
.task .tt .n{font-size:13px;font-weight:500;color:var(--t0)}
.task.is-done .tt .n{text-decoration:line-through;color:var(--t2)}
.task .meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center}
.mt{font-size:9.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:1px 7px;background:var(--s1);color:var(--t0)}
.mt.hi{background:var(--g2)} .mt.due{background:var(--am2)} .mt.over{background:var(--g2);color:#c04a30}.phone.dark .mt.over{color:#FF8A6E}
.mt.lock{background:var(--am2);border-style:dashed}
.minibar{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:var(--t2)}
.minibar .mb{width:34px;height:4px;background:var(--s2);border-radius:3px;overflow:hidden}
.minibar .mb span{display:block;height:100%;background:var(--b)}
.savv{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--ink);font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:#0A0908}
/* fab */
.fab{position:absolute;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;background:var(--g);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
/* kate chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{border:2px solid var(--ink);border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.5;background:var(--s0);box-shadow:var(--shadow-sm);white-space:pre-wrap;color:var(--t0)}
.msg.me .bub{background:var(--b2)}
.kav{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--s1);border:1.5px solid var(--ink);display:inline-flex;align-items:flex-end;justify-content:center;flex-shrink:0}
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sug{font-size:11px;font-weight:600;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:var(--am2);cursor:pointer;box-shadow:var(--shadow-sm);color:var(--t0)}
.sug:active{transform:translate(2px,2px);box-shadow:none}
.prop-label{font-size:9.5px;font-weight:700;letter-spacing:1px;color:var(--t2);margin:8px 0 4px}
.action-card{border:2px solid var(--ink);border-radius:var(--r);background:var(--am2);padding:10px 12px;margin-top:6px;box-shadow:var(--shadow-sm)}
.action-card.applied{background:var(--b2)}
.action-card .h{font-size:10px;font-weight:700;letter-spacing:.06em;margin-bottom:3px;color:var(--t1)}
.action-card .n{font-size:12.5px;font-weight:600;color:var(--t0)}
.action-card .m{font-size:10.5px;color:var(--t2);margin-top:2px}
.action-card .btns{display:flex;gap:8px;margin-top:8px}
.abtn{font-size:11.5px;font-weight:700;border:2px solid var(--ink);border-radius:9px;padding:5px 12px;cursor:pointer;box-shadow:var(--shadow-sm);background:var(--s0);color:var(--t0)}
.abtn.yes{background:var(--b);color:#0A0908}
.abtn:active{transform:translate(2px,2px);box-shadow:none}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--t2);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.chat-in{display:flex;gap:8px;padding:10px 12px;border-top:2px solid var(--ink);background:var(--s0)}
.chat-in input{flex:1;border:2px solid var(--ink);border-radius:11px;padding:9px 12px;font-family:var(--fb);font-size:13.5px;background:var(--s1);outline:none;color:var(--t0)}
.chat-in button{border:2px solid var(--ink);border-radius:11px;background:var(--g);color:#fff;font-weight:700;padding:0 16px;cursor:pointer;box-shadow:var(--shadow-sm);font-size:14px}
/* finance */
.budg .big{font-family:var(--fd);font-size:25px;color:var(--t0)}
.budg .lbl{font-size:10.5px;color:var(--t2);font-weight:700;letter-spacing:.5px}
.bbar{height:16px;border:2px solid var(--ink);border-radius:9px;display:flex;background:var(--s1);margin:10px 0 6px;position:relative}
.bbar i{height:100%;display:block}
.bbar i:first-child{border-radius:7px 0 0 7px}
.bbar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--t2);opacity:.75}
.bbar .mark::after{content:attr(data-l);position:absolute;top:-13px;left:-8px;font-size:8.5px;font-weight:700;color:var(--t2)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--t1);flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border:1.5px solid var(--ink);border-radius:3px;margin-right:5px;vertical-align:-1px}
.fin-alert{margin-top:10px;font-size:12px;font-weight:700;border-radius:9px;padding:7px 11px}
.fin-kpi3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.fin-kpi{border:2px solid var(--ink);border-radius:var(--r);background:var(--s0);box-shadow:var(--shadow-sm);padding:10px}
.fin-kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--t2);font-weight:700}
.fin-kpi .v{font-family:var(--fd);font-size:15px;margin-top:3px}
.fin-cur-card{border:2px solid var(--ink);border-radius:var(--r);padding:12px;background:var(--s0);box-shadow:var(--shadow-sm);flex:1;min-width:140px}
.fin-cur-top{display:flex;justify-content:space-between;align-items:baseline}
.fin-cur-code{font-family:var(--fd);font-size:14px;color:var(--t0)}
.fin-cur-est{font-size:12px;font-weight:700;color:var(--t0)}
.fin-cur-bar{height:8px;border:1.5px solid var(--ink);border-radius:5px;display:flex;overflow:hidden;margin:8px 0 6px;background:var(--s1)}
.fin-cur-sub{display:flex;justify-content:space-between;font-size:10px;font-weight:600}
.fin-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--s2);font-size:12.5px}
.fin-row:last-child{border-bottom:0}
.fin-row .ic{width:30px;height:30px;border:2px solid var(--ink);border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--s1);font-size:14px;flex-shrink:0}
.fin-row .n{flex:1;min-width:0;font-weight:500;color:var(--t0)}
.fin-row .n small{display:block;font-size:10.5px;color:var(--t2);font-weight:400}
.fin-row .a{font-weight:700;white-space:nowrap;color:var(--t0)}
.fin-row .a.neg{color:#c04a30}.phone.dark .fin-row .a.neg{color:#FF8A6E}
.fin-row .a.inc{color:#0d9488}.phone.dark .fin-row .a.inc{color:#4FDFC4}
.fin-area{display:flex;align-items:center;gap:10px;padding:8px 0}
.fin-area .split{height:9px;border:1.5px solid var(--ink);border-radius:5px;display:flex;overflow:hidden;background:var(--s1);margin-top:5px}
.dash-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--t2);font-weight:700;margin:16px 2px 8px}
/* docs */
.doc-card{background:var(--s0);border:2px solid var(--ink);border-radius:var(--r);padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow-sm);cursor:pointer}
.doc-card-top{display:flex;align-items:flex-start;gap:8px}
.doc-card-title{font-size:13px;font-weight:600;flex:1;color:var(--t0)}
.doc-acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.doc-act{font-size:9.5px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:2px 8px;background:var(--s1);color:var(--t0)}
.doc-act.ready{background:var(--b2)}
.doc-act.renew{background:var(--am2)} .doc-act.pay{background:var(--g2)} .doc-act.get{background:rgba(37,99,235,.13)} .doc-act.translate{background:rgba(124,58,237,.13)}
.doc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--t2);align-items:center}
.doc-exp.warn{color:#B8860B;font-weight:700}.phone.dark .doc-exp.warn{color:#F6D034}
.doc-cat-head{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.doc-cat-head .ic{font-size:15px}
.doc-cat-head .nm{font-family:var(--fd);font-size:13.5px;color:var(--t1)}
.doc-cat-head .ct{font-size:10.5px;color:var(--t2);font-weight:600}
/* tag chips */
.tagrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.tagsel{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:20px;border:2px solid var(--ink);background:var(--s0);color:var(--t1);cursor:pointer;box-shadow:1.5px 1.5px 0 var(--ink);-webkit-tap-highlight-color:transparent}
.tagsel:active{transform:translate(1.5px,1.5px);box-shadow:none}
.tagsel.on{background:var(--g);color:#0A0908}
.tagsel.on.renew{background:var(--am)} .tagsel.on.pay{background:var(--re);color:#fff} .tagsel.on.get{background:#2563eb;color:#fff} .tagsel.on.translate{background:#7c3aed;color:#fff} .tagsel.on.fix{background:var(--t2);color:#fff}
/* sheets */
.sheet-bg{position:absolute;inset:0;background:rgba(20,16,30,.45);z-index:200}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:201;background:var(--s0);border-top:2px solid var(--ink);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:86%;overflow-y:auto;color:var(--t0)}
.sheet::-webkit-scrollbar{width:0}

/* ══════════ helpers ══════════ */
const memById = id => members.find(m=>m.id===id);
const areaById = id => areas.find(a=>a.id===id);
const memLabel = m => m.kind==="pet" ? "🐾" : (m.name||"?")[0].toUpperCase();
const av = (id,cls) => { const m=memById(id); return m?`<span class="${cls||"savv"}" style="background:${m.color}" title="${esc(m.name)}">${memLabel(m)}</span>`:""; };
const toAUD = (amt,cur) => cur==="ILS" ? amt/fx : amt;
const money = (n,cur) => (CUR_SYM[cur||"AUD"]||"")+Math.round(n).toLocaleString();
const fmtA = n => "A$"+Math.round(n).toLocaleString();
const blockerOf = it => (it.blockedBy||[]).map(id=>items.find(x=>x.id===id)).find(b=>b&&b.status!=="done");
const active = () => items.filter(i=>i.status!=="irrelevant");

function showT(msg,type="ok"){
  const t=$("#toast");
  t.textContent=(type==="err"?"⚠️ ":"")+msg;
  t.style.display="block";
  clearTimeout(showT._t);
  showT._t=setTimeout(()=>t.style.display="none",3200);
}

function notifData(){
  const overdue = active().filter(a=>a.ddate&&a.ddate<d(0)&&a.status!=="done").sort((a,b)=>a.ddate.localeCompare(b.ddate));
  const due7 = active().filter(a=>a.ddate&&a.status!=="done"&&a.ddate>=d(0)&&a.ddate<=d(7)).sort((a,b)=>a.ddate.localeCompare(b.ddate));
  const expDocs = docs.filter(x=>x.exp&&daysTo(x.exp)<180).sort((a,b)=>a.exp.localeCompare(b.exp));
  return {overdue,due7,expDocs,count:overdue.length+due7.length+expDocs.filter(x=>daysTo(x.exp)<30).length||overdue.length+due7.length};
}

/* ══════════ status cycle with dependency + subtask gates ══════════ */
function cycleStatus(id){
  const it = items.find(i=>i.id===id);
  const next = it.status==="tbd"?"prog":it.status==="prog"?"done":"tbd";
  if(next==="done"){
    const blocker = blockerOf(it);
    if(blocker){ shakeTask(id); showT(`🔒 Finish "${blocker.title}" first`,"err"); return; }
    const openSubs=(it.subs||[]).filter(s=>!s.done).length;
    if(openSubs){ shakeTask(id); showT(`☑️ ${openSubs} subtask${openSubs>1?"s":""} still open`,"err"); return; }
    const unlocked = items.find(x=>x.id!==id&&(x.blockedBy||[]).includes(id)&&!(x.blockedBy||[]).some(b=>b!==id&&items.find(y=>y.id===b&&y.status!=="done")));
    if(unlocked) showT(`🔓 Unlocked: ${unlocked.title}`);
    if(it.cost&&!it.income){ it.settled=true; it.settledDate=d(0); }
  }
  it.status=next;
  render();
}
function shakeTask(id){
  const el=document.getElementById("t-"+id);
  if(el){ el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),450); }
}

function briefText(){
  const daysLeft = daysTo(profile.arrivalDate);
  const act = active();
  const donePct = Math.round(act.filter(i=>i.status==="done").length/Math.max(act.length,1)*100);
  const SPAN=190, timePct=Math.max(0,Math.min(100,Math.round((SPAN-daysLeft)/SPAN*100)));
  const overdue = act.filter(a=>a.ddate&&a.ddate<d(0)&&a.status!=="done");
  const soon = act.filter(a=>a.ddate&&a.status!=="done"&&a.ddate>=d(0)&&a.ddate<=d(7)).sort((a,b)=>a.ddate.localeCompare(b.ddate));
  let s=`Good morning, ${profile.person1} ☀️ ${daysLeft} days to ${profile.destCity} and you're ${donePct>=timePct?"ahead of pace — nice work":"a touch behind pace, but very fixable"}.`;
  if(soon.length) s+=` This week's focus: **${soon[0].title.toLowerCase()}**${soon[1]?`, then ${soon[1].title.toLowerCase()}`:""}.`;
  if(overdue.length) s+=` One thing slipped — **${overdue[0].title.toLowerCase()}** — ten focused minutes gets it back on track.`;
  else s+=` Nothing overdue. Keep the streak going 💪`;
  return s;
}

  if(!q) return true;
  return a.title.toLowerCase().includes(q)||(a.subs||[]).some(s=>s.t.toLowerCase().includes(q));
}
function matchWho(a){ return !ui.planWho||(a.memberIds||[]).includes(ui.planWho); }

  const over=t.ddate&&t.ddate<d(0)&&t.status!=="done";

  return `<div class="task ${t.status==="done"?"is-done":""}" id="t-${t.id}">
    <div class="tick ${t.status}" onclick="cycleStatus('${t.id}')">${blocker&&t.status!=="done"?"🔒":t.status==="done"?"✓":t.status==="prog"?"●":""}</div>

function planAreas(){
  return areas.map((a,i)=>{
    const ts=items.filter(t=>t.planId===a.id);
    let shown=ts.filter(matchWho).filter(matchQ);
    if((ui.planWho||ui.planQ)&&!shown.length) return "";
    const dn=ts.filter(t=>t.status==="done").length;
    const pct=ts.length?Math.round(dn/ts.length*100):0;
    const open = ui.planQ ? true : (ui.openAreas[a.id]!==undefined ? ui.openAreas[a.id] : ts.some(t=>t.status!=="done"&&t.ddate&&daysTo(t.ddate)<=7));
    return `<div class="agroup">
      <div class="agroup-head" onclick="ui.openAreas['${a.id}']=${open?"false":"true"};render()">
        <span class="agroup-ic" style="background:${a.color}22">${a.icon}</span>
        <div class="agroup-main"><div class="agroup-title">${esc(a.title)}</div>
          <div class="agroup-bar"><span style="width:${pct}%;background:${a.color}"></span></div></div>
        <span class="agroup-count">${dn}/${ts.length}</span>
        <span class="agroup-chev ${open?"open":""}">›</span>
      </div>
      ${open?`<div class="agroup-tasks">${shown.length?shown.map(t=>taskRow(t)).join(""):`<div style="padding:12px 14px;font-size:12px;color:var(--t2)">No tasks yet.</div>`}</div>`:""}
    </div>`;
  }).join("")+`<div class="sub" style="margin-top:8px">Tap the checkbox to cycle: to-do → in progress → done. Locked tasks wait for their blocker.</div>`;
}
function planAll(){
  const rank=v=>v.status==="done"?2:blockerOf(v)?1:0;
  const list=items.filter(matchWho).filter(matchQ).sort((x,y)=>rank(x)-rank(y)||((x.ddate||"9999").localeCompare(y.ddate||"9999")));
  return `
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button class="btn sm" onclick="exportTasksCSV()">↓ CSV</button>
  </div>
  <div class="agroup"><div class="agroup-tasks" style="border-top:0">${list.map(t=>taskRow(t,true)).join("")||`<div style="padding:14px;font-size:12px;color:var(--t2)">No tasks match.</div>`}</div></div>`;
}

function pageKate(){

    if(m.typing) return `<div class="msg">${kav()}<div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`;
    const body = m.done ? md(m.text) : md(m.shown||"");

        if(a.applied) return `<div class="action-card applied"><div class="n">✅ ${meta[0]==="✅"?"Marked done":"Applied"} — ${esc(name)}</div></div>`;
        if(a.dismissed) return `<div class="action-card" style="opacity:.55"><div class="n">Skipped — ${esc(name)}</div></div>`;

      actions,sugs:["How's our budget?","What's due this week?","Best suburbs for families?"]};

      sugs:["What's due this week?","How's our budget?","School rankings near Fremantle?"]};
  }
  return {text:`Good question! In the full app I answer with your real plan, budget and deadlines in context — and I search the web for current visa timelines, school rankings and cost-of-living data.\n\nIn this demo, try one of these 👇`,
    sugs:["What's due this week?","Best suburbs for families?","How's our budget?","School rankings near Fremantle?","What does shipping cost?","How does Medicare work for us?"]};
}
let streamTimer=null;
function askKate(q){
  if(streamTimer) return;
  chat.push({role:"me",text:q});
  chat.push({role:"ai",typing:true});
  render();
  setTimeout(()=>{
    const r=kateBrain(q);
    const m=chat[chat.length-1];
    m.typing=false; m.text=r.text; m.shown=""; m.done=false;
    m.actions=(r.actions||[]).map(a=>({...a})); m.sugs=r.sugs||[];
    render();
    const t0=Date.now();
    streamTimer=setInterval(()=>{
      const i=Math.ceil((Date.now()-t0)/1000*160)+2;  // ~160 chars/s, robust to timer throttling
      m.shown=m.text.slice(0,i);
      const bub=$("#stream-bub");
      if(bub){ bub.innerHTML=md(m.shown); scrollChat(); }
      if(i>=m.text.length){
        clearInterval(streamTimer); streamTimer=null;
        m.done=true; render();
      }
    },22);
  },750);
}
function scrollChat(){ const m=$("#main"); m.scrollTop=m.scrollHeight; }
function approveKate(mi,ai){
  const a=chat[mi].actions[ai];
  if(a.type==="create_task"){
    items.push({id:"a"+Date.now(),planId:a.planId||areas[0].id,title:a.title,priority:a.prio||"High",status:"tbd",
      ddate:a.ddate||"",memberIds:a.who||["m1"],subs:[],blockedBy:[],notes:"Added by Kate"});
    showT(`✓ Added "${a.title}"`);
  } else if(a.type==="create_doc"){
    docs.push({id:"d"+Date.now(),name:a.name,acts:[...(a.acts||["get"])],cats:[...(a.cats||[])],who:[...(a.who||[])],exp:""});
    showT(`📄 Added "${a.name}" to Documents`);
  } else if(a.type==="complete_task"){
    const it=items.find(x=>x.id===a.id);
    if(!it){ showT("Couldn't find that task","err"); return; }
    const blocker=blockerOf(it);
    if(blocker){ showT(`🔒 Finish "${blocker.title}" first`,"err"); return; }
    (it.subs||[]).forEach(s=>s.done=true);
    it.status="done";
    if(it.cost&&!it.income){ it.settled=true; it.settledDate=d(0); }
    showT(`✅ "${it.title}" done`);
  } else if(a.type==="set_due"){
    const it=items.find(x=>x.id===a.id);
    if(!it){ showT("Couldn't find that task","err"); return; }
    it.ddate=a.ddate;
    showT(`📅 "${it.title}" due ${fmt(a.ddate)}`);
  }
  a.applied=true; render();
}
function dismissKate(mi,ai){ chat[mi].actions[ai].dismissed=true; render(); }

function pageFinance(){
  const act=active();
  const exp=act.filter(a=>a.cost&&!a.income);
  const inc=act.filter(a=>a.cost&&a.income);
  const settled=exp.filter(a=>a.settled);
  const pending=exp.filter(a=>!a.settled);
  const est=exp.reduce((s,a)=>s+toAUD(a.cost,a.cur),0);
  const paid=settled.reduce((s,a)=>s+toAUD(a.cost,a.cur),0);
  const bud=toAUD(budget.amount,budget.cur);
  const estPct=bud?est/bud*100:0;
  const paidW=Math.min(100,bud?paid/bud*100:0);
  const pendW=Math.min(Math.max(0,100-paidW),bud?(est-paid)/bud*100:0);
  let al;
  if(est>=bud&&bud>0) al={bg:"var(--re2)",fg:"#c04a30",msg:`🔴 Over budget by ${fmtA(est-bud)} (${Math.round(estPct)}%)`};
  else if(estPct>=80) al={bg:"var(--am2)",fg:"#B8860B",msg:`⚠️ ${Math.round(estPct)}% committed — approaching your limit`};
  else if(estPct>=50) al={bg:"var(--am2)",fg:"#B8860B",msg:`⏳ Halfway — ${Math.round(estPct)}% of budget committed`};
  else al={bg:"var(--b2)",fg:"#0d9488",msg:`✓ On track — ${Math.round(estPct)}% of budget planned`};
  // by currency
  const byCur={};
  exp.forEach(a=>{const o=byCur[a.cur||"AUD"]=byCur[a.cur||"AUD"]||{est:0,paid:0};o.est+=a.cost;if(a.settled)o.paid+=a.cost;});
  // by area
  const areaAgg=areas.map(p=>{
    const pi=exp.filter(a=>a.planId===p.id);

    const pe=pi.filter(a=>!a.settled).reduce((s,a)=>s+toAUD(a.cost,a.cur),0);
    return {p,pd,pe,tot:pd+pe};

  const areaMax=areaAgg[0]?.tot||1;
  const upcoming=pending.filter(a=>a.ddate&&daysTo(a.ddate)<=60).sort((a,b)=>a.ddate.localeCompare(b.ddate));

  };

    :`<div class="card" style="border-color:var(--g)">

      </div>
    </div>`}
    <div class="card budg">

        <i style="width:${paidW}%;background:var(--b)"></i><i style="width:${pendW}%;background:var(--am)"></i>

    <div class="card">
      ${areaAgg.map(x=>`<div class="fin-area">
        <span class="agroup-ic" style="background:${x.p.color}22;width:30px;height:30px;font-size:15px">${x.p.icon}</span>

          <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span>${esc(x.p.title)}</span><span>${fmtA(x.tot)}</span></div>

/* ══════════ CSV / print ══════════ */
function csvDl(rows,name){
  if(!rows.length){ showT("Nothing to export","err"); return; }
  const keys=Object.keys(rows[0]);
  const csv=[keys.join(","),...rows.map(r=>keys.map(k=>`"${String(r[k]??"").replace(/"/g,'""')}"`).join(","))].join("\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url); showT("Exported ✓");
}
function exportTasksCSV(){
  csvDl(items.map(a=>({area:areaById(a.planId)?.title||"",title:a.title,assigned:(a.memberIds||[]).map(id=>memById(id)?.name).filter(Boolean).join(", "),
    priority:a.priority,status:a.status,due:a.ddate||"",cost:a.cost||"",cur:a.cur||""})),"realokate-tasks.csv");
}
function exportFinanceCSV(){
  csvDl(items.filter(a=>a.cost).map(a=>({area:areaById(a.planId)?.title||"",title:a.title,amount:a.cost,cur:a.cur,
    kind:a.income?"income":"expense",settled:a.settled?"yes":"no",settledDate:a.settledDate||"",due:a.ddate||""})),"realokate-finance.csv");
}
function exportDocsCSV(){
  csvDl(docs.map(x=>({name:x.name,needs:x.acts.map(a=>DOC_ACTIONS[a].l).join("; "),categories:x.cats.join("; "),expiry:x.exp||""})),"realokate-docs.csv");

  const rows=areas.map(p=>{

function genPlan(dr){
  const hasKids=dr.children.length>0, hasPets=dr.pets.length>0, dc=ctry(dr.destination);

    T("Research schools near target suburbs","p3",-4,"High","adults",{need:"kids"}),

    T("Arrange travel & health cover for the transition","p4",-1,"High","all"),
    T("Copy medical records & stock prescriptions","p4",-2,"Medium","all",{doc:{name:"Medical records",acts:["get"],cats:["Health"]}}),
    T("Enrol in the local health system","p4",1,"High","all"),
    T("Vet check, vaccinations & microchip","p5",-5,"High","pets",{need:"pets",k:"vet",doc:{name:"Vaccination card",per:"pets",acts:["get"],cats:["Health"]}}),
    T("Apply for the pet import permit","p5",-6,"High","pets",{need:"pets",after:"vet",k:"permit",pay:2000,doc:{name:"Pet import permit",acts:["get","pay"],cats:["Health"]}}),
    T("Book pet transport (IPATA agent)","p5",-3,"High","pets",{need:"pets",after:"permit"}),

    T("Book one-way flights","p6",-2,"High","adults",{after:"visa"}),
    T("Cancel utilities & subscriptions","p6",-1,"Medium","adults"),
    T("Declutter: sell / donate / store","p6",-3,"Low","all"),
    T("Pack an essentials suitcase per person","p6",0,"Medium","all"),
  ];
  if(dr.origin==="Israel") list.push(

    T("Order police clearance (תעודת יושר)","p1",-4,"High","adults",{doc:{name:"Police clearance — adults",acts:["get"],cats:["Identity"]}}),
    T("Sort Bituach Leumi status before leaving","p4",-2,"High","adults"),
  );
  if(dr.destination==="Australia"){
    const relbl={"Get a local tax number":"Apply for a Tax File Number (TFN)","Enrol in the local health system":"Enrol in Medicare / confirm OVHC"};
    list.forEach(x=>{ if(relbl[x.t]) x.t=relbl[x.t]; });
  }
  list=list.filter(x=>!(x.need==="kids"&&!hasKids)&&!(x.need==="pets"&&!hasPets));
  // members
  const cols=[...MEM_COLORS];
  const mem=[{id:"m1",name:dr.person1.trim()||"You",kind:"adult",color:cols[0]}];
  if(dr.person2&&dr.person2.trim()) mem.push({id:"m2",name:dr.person2.trim(),kind:"adult",color:cols[1]});
  dr.children.forEach((c,i)=>mem.push({id:"mc"+i,name:members.find(m=>m.kind==="child"&&m.age==c.age)?.name||("Kid "+(i+1)),kind:"child",age:+c.age||7,color:cols[(2+i)%cols.length]}));
  dr.pets.forEach((p,i)=>mem.push({id:"mp"+i,name:p.name||p.type,kind:"pet",species:p.type,color:cols[(2+dr.children.length+i)%cols.length]}));
  const adults=mem.filter(m=>m.kind==="adult").map(m=>m.id);
  const kids=mem.filter(m=>m.kind==="child").map(m=>m.id);
  const pets=mem.filter(m=>m.kind==="pet").map(m=>m.id);
  const whoIds=w=>w==="all"?mem.filter(m=>m.kind!=="pet").map(m=>m.id):w==="adults"?adults:w==="kids"?kids:w==="pets"?pets:adults;
  // dates: months relative to arrival, staggered forward if already past

    const it={id:"g"+i,planId:x.a,title:x.t,priority:x.p,status:"tbd",ddate:d(off),
      memberIds:whoIds(x.who),subs:[],blockedBy:[],notes:"",

    if(x.k) byKey[x.k]=it;

  let deps=0;

    if(x.doc.per==="humans") mem.filter(m=>m.kind!=="pet").forEach(m=>push(`${x.doc.name} — ${m.name}`,[m.id]));
    else if(x.doc.per==="kids") kids.forEach(id=>push(`${x.doc.name} — ${memById2(mem,id)}`,[id]));
    else if(x.doc.per==="pets") pets.forEach(id=>push(`${x.doc.name} — ${memById2(mem,id)}`,[id]));
    else push(x.doc.name,whoIds(x.who));
  });
  return {items:newItems,docs:newDocs,members:mem,deps,areas:[...new Set(newItems.map(i=>i.planId))].length};
}

    <div class="funnel-title">Who's making the move? 👨‍👩‍👧</div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <div style="flex:1"><div class="flabel">Your name *</div><input class="finput" value="${esc(dr.person1)}" oninput="ui.funnel.draft.person1=this.value"></div>
      <div style="flex:1"><div class="flabel">Partner's name</div><input class="finput" placeholder="Leave blank if solo" value="${esc(dr.person2)}" oninput="ui.funnel.draft.person2=this.value"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="flabel" style="margin:0">Children</div>
      <button class="btn xs" onclick="ui.funnel.draft.children.push({age:''});renderOverlays()">+ Add child</button>
    </div>
    ${dr.children.length?dr.children.map((c,i)=>`<div style="display:flex;gap:8px;margin-bottom:6px;align-items:center">
      <input class="finput" style="width:74px" type="number" min="0" max="18" placeholder="Age" value="${c.age}" oninput="ui.funnel.draft.children[${i}].age=this.value">
      <span style="font-size:12px;color:var(--t2)">years old</span>
      <button class="btn xs" onclick="ui.funnel.draft.children.splice(${i},1);renderOverlays()">✕</button>
    </div>`).join(""):`<div style="font-size:11px;color:var(--t3);margin-bottom:6px">No children added</div>`}
    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px">
      <div class="flabel" style="margin:0">Pets</div>
      <button class="btn xs" onclick="ui.funnel.draft.pets.push({type:'Dog',name:''});renderOverlays()">+ Add pet</button>
    </div>
    ${dr.pets.length?dr.pets.map((p,i)=>`<div style="display:flex;gap:8px;margin-bottom:6px;align-items:center">
      <select class="fselect" style="width:92px" onchange="ui.funnel.draft.pets[${i}].type=this.value">${["Dog","Cat","Bird","Other"].map(t=>`<option ${p.type===t?"selected":""}>${t}</option>`).join("")}</select>
      <input class="finput" style="flex:1" placeholder="Name (optional)" value="${esc(p.name||"")}" oninput="ui.funnel.draft.pets[${i}].name=this.value">
      <button class="btn xs" onclick="ui.funnel.draft.pets.splice(${i},1);renderOverlays()">✕</button>
    </div>`).join(""):`<div style="font-size:11px;color:var(--t3)">No pets added</div>`}`;
  } else if(f.step===4){
    body=`
    <div class="funnel-title">When are you moving? 📅</div>
    <div class="flabel">When do you plan to arrive? *</div>
    <input class="finput" type="date" value="${dr.arrivalDate}" onchange="ui.funnel.draft.arrivalDate=this.value">
    <div style="font-size:11px;color:var(--t2);margin:4px 0 16px">Your target date to land — drives the countdown.</div>
    <div class="flabel">What needs to happen before you can move? <span style="font-weight:400;text-transform:none">(optional)</span></div>
    <input class="finput" placeholder="e.g. Visa approval, Job offer, Property sold" value="${esc(dr.gateLabel)}" oninput="ui.funnel.draft.gateLabel=this.value">
    <div style="font-size:11px;color:var(--t2);margin-top:4px">Once you mark this done in the app, your countdown activates ⏱</div>`;
  } else if(f.step===5){
    const curOpts=v=>[...new Set(COUNTRIES.map(c=>c.c))].map(c=>`<option ${v===c?"selected":""}>${c}</option>`).join("");
    body=`
    <div class="funnel-title">Set up your finances 💰</div>
    <div style="font-size:12px;color:var(--t1);padding:10px 14px;background:var(--s2);border-radius:8px;margin-bottom:16px">We detected <b>${ctry(dr.origin).c}</b> for ${esc(dr.origin)} and <b>${ctry(dr.destination).c}</b> for ${esc(dr.destination)}. Pick from the list to change.</div>
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1"><div class="flabel">Origin currency</div><select class="fselect" onchange="ui.funnel.draft.curO=this.value">${curOpts(dr.curO)}</select></div>
      <div style="flex:1"><div class="flabel">Destination currency</div><select class="fselect" onchange="ui.funnel.draft.curD=this.value">${curOpts(dr.curD)}</select></div>
    </div>
    <div class="flabel">Total budget for the move <span style="text-transform:none;font-weight:400">· in ${dr.curD}</span></div>
    <input class="finput" type="number" value="${dr.budget}" oninput="ui.funnel.draft.budget=this.value">
    <div style="font-size:11px;color:var(--t2);margin-top:4px">Kate tracks every cost against this — with 50% and 80% alerts.</div>`;
  } else if(f.step==="route"){
    body=`
    <div class="funnel-title">⚡ We know this route well</div>
    <div style="font-size:13.5px;color:var(--t1);line-height:1.6;margin-bottom:14px">
      <b>${esc(dr.origin)} → ${esc(dr.destination)}</b> · ${esc(dr.visaType)} is one of our curated routes.
      A complete plan is ready — no waiting, tuned to your household, nothing you don't need.
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${(()=>{const p=genPlan(dr);return [[p.items.length,"tasks"],[p.areas,"areas"],[p.docs.length,"docs prepared"],[p.deps,"dependencies wired"]].map(([n,l])=>`<div class="stat-tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");})()}
    </div>
    <div style="font-size:11.5px;color:var(--t2)">You can always ask Kate to tailor it further once you're in.</div>`;
  }
  const nav = f.step==="route"
    ? `<div style="display:flex;flex-direction:column;gap:10px;width:100%">
        <button class="btn g" style="width:100%;padding:12px" onclick="startGen()">⚡ Use the ready-made plan →</button>
        <div style="display:flex;justify-content:space-between">
          <button class="btn sm" onclick="fBack()">← Back</button>
          <button class="btn sm" onclick="startGen()">🤖 Let Kate build custom</button>
        </div>
      </div>`
    : `${f.step===1?`<button class="btn sm" onclick="ui.funnel=null;renderOverlays()">Skip for now</button>`:`<button class="btn sm" onclick="fBack()">← Back</button>`}
      <button class="btn g" onclick="fNext()" ${fCanNext()?"":"disabled"}>${f.step===5?"Done — Meet Kate →":"Next →"}</button>`;
  return `
  <div class="funnel-overlay">
    <div class="funnel-step-label">${label}</div>
    <div class="funnel-pbar"><div class="funnel-pfill" style="width:${pct}%"></div></div>
    ${body}
    <div class="funnel-nav">${nav}</div>
  </div>`;
}
function fSetCountry(field,val){
  const dr=ui.funnel.draft;
  dr[field]=val;
  if(field==="origin") dr.curO=ctry(val).c;
  else dr.curD=ctry(val).c;
  renderOverlays();
}

/* ══════════ render ══════════ */
function renderOverlays(){
  let html="";
  if(ui.sheet){
    html = ui.sheet.type==="task"?sheetTask():ui.sheet.type==="edit"?sheetEdit():sheetDoc();
  }
  if(ui.moreOpen) html = sheetMore();
  if(ui.notifOpen) html += notifPanel();
  if(ui.searchOpen) html += searchOverlay();
  if(ui.funnel) html = funnelOverlay();
  $("#overlays").innerHTML = html;
  if(ui.searchOpen) renderSearchResults();
  if(ui.funnel&&ui.funnel.step==="gen"&&ui.funnel.genShown){
    const gl=$("#genList");
    if(gl) gl.innerHTML=ui.funnel.plan.items.slice(0,ui.funnel.genShown).map(it=>`<div class="gen-item" style="animation:none">${areaById(it.planId)?.icon||"✅"} ${esc(it.title)}</div>`).join("");
  }
}
function render(){
  const pages={home:pageHome,plan:pagePlan,kate:pageKate,finance:pageFinance,docs:pageDocs,settings:pageSettings};
  $("#phone").classList.toggle("dark",ui.dark);
  $("#main").innerHTML = (pages[ui.tab]||pageHome)();
  $("#chatIn").style.display = ui.tab==="kate"?"flex":"none";
  renderTabbar();
  renderOverlays();
  if(ui.tab==="kate") scrollChat();
}

/* ══════════ wire up ══════════ */
$("#kateSend").addEventListener("click",()=>{ const v=$("#kateInput").value.trim(); if(v){ $("#kateInput").value=""; if(ui.tab!=="kate"){ui.tab="kate";} askKate(v);} });
$("#kateInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const v=e.target.value.trim(); if(v){ e.target.value=""; askKate(v);} } });
window.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="k"){ e.preventDefault(); toggleSearch(); }
  if(e.key==="Escape"){ ui.searchOpen=false; ui.notifOpen=false; if(ui.sheet||ui.moreOpen){ ui.sheet=null; ui.moreOpen=false; } renderOverlays(); renderTabbar(); }
});
seed();
render();
</script>
</body>
</html>
