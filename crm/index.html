<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vane Labs CRM — Interactive Demo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
:root{
  --forest:#0A4F32;--forest-deep:#07331F;--gold:#BD8C3D;--gold-d:#887B05;
  --bg:#FAFAF7;--surface:#fff;--ink:#0E2419;--muted:#4A5752;--t3:#8A9691;
  --danger:#C0392B;--warning:#E67E22;--info:#2980B9;--purple:#8E44AD;--accent-t:#1f7a00;
  --rule:rgba(10,79,50,.14);
  --fd:'Rajdhani',sans-serif;--fb:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--forest);color:var(--bg)}
.demo-strip{background:#EAF3EE;border-bottom:1px solid var(--rule);padding:7px 20px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--forest);gap:12px}
.demo-strip a{color:var(--ink);text-decoration:none;font-weight:600}
.rolesel{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--forest);background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:2px 4px;cursor:pointer}
.shell{display:flex;flex:1;min-height:0}
aside{width:230px;background:var(--surface);border-right:1px solid var(--rule);padding:0;flex-shrink:0;display:flex;flex-direction:column;transition:width .2s;overflow:hidden}
aside.collapsed{width:52px}
.snav{flex:1;min-height:0;padding:8px 6px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:1px}
.sfoot{flex-shrink:0}
.logo-row{display:flex;align-items:center;gap:10px;padding:16px 14px 13px;border-bottom:1px solid var(--rule)}
aside.collapsed .logo-row{padding:16px 11px 13px}
.logo-tile{width:28px;height:28px;background:var(--forest);border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lk .wm{font-family:var(--fd);font-weight:700;font-size:15px;color:var(--gold);letter-spacing:.06em;line-height:1;white-space:nowrap}
.lk .sub{font-family:var(--fd);font-weight:600;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.ngroup{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);padding:0 10px 5px;margin-top:10px;white-space:nowrap}
aside.collapsed .ngroup{height:1px;background:rgba(10,79,50,.1);margin:10px 4px 6px;padding:0;overflow:hidden;color:transparent}
.nitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:2px;font-family:var(--fd);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:0;background:none;text-align:left;width:100%;transition:background .15s,color .15s;white-space:nowrap}
.nitem:hover{background:rgba(10,79,50,.07);color:var(--forest)}
.nitem.on{background:rgba(10,79,50,.12);color:var(--forest)}
.nitem svg{flex-shrink:0}
.nitem .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
aside.collapsed .nitem{justify-content:center;padding:9px 0}
aside.collapsed .nitem .lbl,aside.collapsed .npill{display:none}
.npill{font-family:var(--fd);font-weight:700;font-size:10px;border-radius:10px;padding:1px 6px}
.npill.soft{background:rgba(10,79,50,.1);color:var(--forest)}
.sfoot{border-top:1px solid var(--rule);padding:8px 6px}
.suser{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:4px}
.suser .av{width:26px;height:26px;background:var(--forest);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--fd);font-weight:700;font-size:12px;flex-shrink:0}
.suser .nm{font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suser .rl{display:flex;align-items:center;gap:5px;margin-top:1px}
.suser .rl span{font-size:10px;color:var(--muted);text-transform:uppercase;font-family:var(--fd);letter-spacing:.1em;font-weight:600}
aside.collapsed .suser{justify-content:center;padding:8px 0}
aside.collapsed .suser>div:not(.av){display:none}
main{flex:1;overflow-y:auto;padding:24px 28px 64px;min-width:0}
.eyebrow{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d)}
h1.pt{font-family:var(--fd);font-weight:600;font-size:26px;letter-spacing:-.01em;color:var(--forest);line-height:1.1;margin:3px 0 0}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
@media(min-width:1150px){.kpis.six{grid-template-columns:repeat(6,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:18px 20px}
.kpi .l{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kpi .v{font-family:var(--fd);font-weight:700;font-size:30px;line-height:1;color:var(--forest)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:5px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:2px;margin-bottom:16px}
.card .h{padding:11px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .h .t{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#f5f5f2;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--forest)}
td{padding:10px 14px;border-bottom:1px solid rgba(10,79,50,.08);vertical-align:middle}
tr:hover td{background:rgba(10,79,50,.025)}
th.num,td.num{text-align:right;font-family:var(--fd);font-weight:600}
.tbl-wrap{overflow-x:auto}
.badge{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:2px;white-space:nowrap}
.b-forest{background:rgba(10,79,50,.1);color:var(--forest)}
.b-gold{background:rgba(189,140,61,.14);color:var(--gold-d)}
.b-accent{background:rgba(60,204,8,.13);color:var(--accent-t)}
.b-muted{background:rgba(74,87,82,.1);color:var(--muted)}
.b-danger{background:rgba(192,57,43,.12);color:var(--danger)}
.b-warning{background:rgba(230,126,34,.14);color:var(--warning)}
.b-info{background:rgba(41,128,185,.12);color:var(--info)}
.b-purple{background:rgba(142,68,173,.12);color:var(--purple)}
.tag-chip{display:inline-flex;align-items:center;font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:rgba(10,79,50,.07);color:var(--forest);padding:2px 7px;border-radius:2px;white-space:nowrap}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:2px;cursor:pointer;border:none;line-height:1;white-space:nowrap;transition:background .15s,color .15s,transform .1s}
.btn-primary{background:var(--forest);color:#FAFAF7}
.btn-primary:hover{background:var(--forest-deep);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--forest);border:1px solid var(--forest)}
.btn-ghost:hover{background:var(--forest);color:#FAFAF7}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-icon{background:transparent;border:1px solid var(--rule);border-radius:2px;color:var(--muted);cursor:pointer;padding:5px 7px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;line-height:1;transition:background .15s,color .15s}
.btn-icon:hover{background:var(--forest);color:#fff;border-color:var(--forest)}
.mvb{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--rule);background:var(--bg);color:var(--muted);padding:2px 8px;border-radius:2px;cursor:pointer}
.mvb:hover{border-color:var(--forest);color:var(--forest)}
/* chips (filters) */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .cl{font-family:var(--fd);font-weight:600;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-right:2px}
.chip{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:2px;border:1px solid var(--rule);background:var(--surface);color:var(--muted);cursor:pointer}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kcol{background:#f5f5f2;border:1px solid var(--rule);border-radius:2px;min-width:215px;width:215px;flex-shrink:0;transition:box-shadow .12s,background .12s}
/* drop target glows in the stage's own colour (--sc, set per column) */
.kcol.over{background:rgba(10,79,50,.06);box-shadow:inset 0 0 0 2px var(--sc,var(--forest))}
.kcol .kh{padding:10px 12px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:6px}
.kcol .kh .sum{font-family:var(--fd);font-weight:600;font-size:11px;color:var(--muted);white-space:nowrap}
.kcards{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:70px}
.kcard{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:10px 11px;transition:border-color .12s,box-shadow .12s;cursor:pointer}
.kcard:hover{border-color:var(--forest);box-shadow:0 2px 8px rgba(10,79,50,.1)}
.kcard .n{font-weight:600;font-size:13px}
.kcard .p{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.kcard .v{font-family:var(--fd);font-weight:700;font-size:15px;color:var(--forest)}
.kcard .mv{display:flex;gap:6px;margin-top:8px;border-top:1px solid rgba(10,79,50,.08);padding-top:8px;flex-wrap:wrap}
.kcard[draggable=true]{cursor:grab}
.kcard.dragging{opacity:.4}
input.search,select.inp,input.inp,textarea.inp{border:1px solid var(--rule);border-radius:2px;padding:7px 12px;font-family:var(--fb);font-size:13px;background:var(--surface);outline:none;color:var(--ink)}
input.search{min-width:220px}
input.search:focus,.inp:focus{border-color:var(--forest)}
.avatar{width:24px;height:24px;border-radius:50%;background:rgba(189,140,61,.18);color:var(--gold-d);font-family:var(--fd);font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle}
svg.chart text{font-family:var(--fd);font-size:10.5px;fill:var(--muted)}
.note{font-size:11.5px;color:var(--t3);padding:9px 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* modal */
#modal,#quick{display:none;position:fixed;inset:0;background:rgba(7,51,31,.5);backdrop-filter:blur(4px);z-index:120;justify-content:center}
#modal{align-items:center;padding:24px}
#quick{align-items:flex-start;padding:12vh 16px 0}
.mbox{background:var(--surface);border:1px solid var(--rule);border-radius:4px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 14px 44px rgba(7,51,31,.25)}
.mhead{padding:16px 22px 13px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:10px}
.mhead .mt{font-family:var(--fd);font-weight:600;font-size:18px;letter-spacing:.02em;color:var(--forest);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbody{padding:18px 22px;overflow-y:auto}
.mfoot{padding:13px 22px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:10px}
.fg{margin-bottom:12px;flex:1;min-width:0}
.fg .label,.label{display:block;font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.fg .inp{width:100%}
.frow{display:flex;gap:12px}
.contact-box{background:#f9f9f7;border:1px solid rgba(10,79,50,.1);border-radius:2px;padding:12px 14px;margin-bottom:10px}
/* notifications */
.ncard{opacity:1}
.ncard.resolved{opacity:.62}
.diff{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:baseline;padding:2px 0}
.diff .f{font-weight:600;min-width:110px;color:var(--ink)}
.diff .old{text-decoration:line-through;opacity:.6}
.diff .new{color:var(--forest);font-weight:600}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .wd{padding:8px 4px;text-align:center;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule)}
.cal .day{padding:6px;min-height:82px;border-bottom:1px solid rgba(10,79,50,.06);border-right:1px solid rgba(10,79,50,.06);cursor:pointer;background:var(--surface)}
.cal .day.pad{background:#fafaf9;cursor:default}
.cal .day.today{background:rgba(10,79,50,.04)}
.cal .dn{font-family:var(--fd);font-weight:500;font-size:13px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:3px}
.cal .day.today .dn{background:var(--forest);color:#fff;font-weight:700}
.ev{font-size:10.5px;font-family:var(--fd);font-weight:600;letter-spacing:.04em;padding:2px 5px;border-radius:2px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
/* notes */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.notecard{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:15px 17px;position:relative;cursor:pointer}
.notecard:hover{border-color:var(--forest)}
.pin{position:absolute;top:10px;right:10px;color:var(--gold);font-size:13px}
/* settings chips */
.setchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(10,79,50,.08);border-radius:2px;font-size:12px;font-family:var(--fd);font-weight:600;color:var(--forest);text-transform:uppercase;letter-spacing:.05em}
.setchip button{background:none;border:none;cursor:pointer;color:inherit;font-size:11px;padding:0;line-height:1}
/* chart tooltip */
.chartwrap{position:relative}
.ctip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--rule);border-radius:2px;padding:8px 11px;font-size:12px;line-height:1.6;box-shadow:0 4px 14px rgba(7,51,31,.14);display:none;z-index:5;white-space:nowrap}
.ctip .tl{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
/* quick add */
.qbox{background:var(--surface);border:1px solid var(--rule);border-radius:8px;width:100%;max-width:520px;box-shadow:0 16px 50px rgba(7,51,31,.3);overflow:hidden}
.qhead{padding:11px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;font-family:var(--fd);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--forest)}
.qbody{padding:14px 16px}
.qprev{border:1px solid var(--rule);border-radius:2px;background:#f9f9f7;padding:12px 14px;margin-top:10px}
.fab{position:fixed;right:22px;bottom:22px;width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;background:var(--forest);color:var(--gold);font-size:24px;box-shadow:0 6px 20px rgba(7,51,31,.28);z-index:110;line-height:1}
/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--forest-deep);color:#fff;font-size:13px;padding:10px 18px;border-radius:2px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:80vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* role gating */
body[data-can-edit="false"] .ce{display:none!important}
.lockwrap{display:flex;align-items:center;justify-content:center;padding:90px 20px}
.lockwrap h3{font-family:var(--fd);font-weight:600;font-size:18px;color:var(--forest);margin:10px 0 6px}
@media(max-width:900px){aside{display:none}.two{grid-template-columns:1fr}}
</style>

  <span>◈ Interactive demo — all data is fictional sample data</span>

<div class="shell">
<aside id="side"></aside>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mboxc"></div></div>

<script>
/* ============================ helpers ============================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt$=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString();
const uid=()=>"id"+Math.random().toString(36).slice(2,9);
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dISO=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const mISO=(ago,day)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-ago);const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day||12,dim));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=iso=>iso?new Date(iso+"T00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2800);}

/* ============================ constants ============================ */
const STAGES=[
  ["prospect","Prospect","b-muted","#4A5752"],
  ["qualified","Qualified","b-forest","#2980B9"],
  ["proposal","Proposal","b-info","#887B05"],
  ["negotiation","Negotiation","b-gold","#E67E22"],
  ["closed-won","Closed Won","b-accent","#0A4F32"],
  ["closed-lost","Closed Lost","b-danger","#C0392B"]];
const stageOf=id=>STAGES.find(s=>s[0]===id);
const typeBadge=t=>({demand:"b-forest",supply:"b-info",product:"b-purple",partner:"b-gold",agency:"b-warning",network:"b-accent"})[t]||"b-muted";
const statusBadge=s=>({active:"b-accent",inactive:"b-muted",prospect:"b-info",paused:"b-warning",churned:"b-danger",draft:"b-muted",sent:"b-info",signed:"b-gold",paid:"b-accent",overdue:"b-danger",cancelled:"b-danger","closed-won":"b-accent","closed-lost":"b-danger",todo:"b-muted","in-progress":"b-info",done:"b-accent",pending:"b-info",approved:"b-accent",disregarded:"b-muted"})[s]||"b-muted";
const PRI_COLOR={urgent:"#C0392B",high:"#E67E22",medium:"#2980B9",low:"#4A5752"};
const PRI_ORDER={urgent:0,high:1,medium:2,low:3};
const NOTE_COLOR={idea:"#887B05",opportunity:"#0A4F32",research:"#2980B9",meeting:"#8E44AD",general:"#4A5752"};
const EV_COLOR={meeting:"#0A4F32",deadline:"#C0392B",call:"#2980B9","follow-up":"#BD8C3D",other:"#4A5752"};

function platformOf(e){

function scopeOf(e){
  if(e.scope)return e.scope;
  if(e.type==="cost"&&(e.tags.includes("xero")||e.tags.includes("wise")))return "expense";

}

/* Due dates: month end + the payee's net terms. Partner payment runs land on
   the 10th — first 10th on/after that date; setUTCDate(1) first avoids the
   month-end overflow (e.g. Jan 31 + 1 month ≠ Mar 3). Services keep the raw
   month-end + terms (0 = due at month end, typical for subscriptions). */
function dueOf(month,terms,partnerRun){
  const[y,mo]=month.split("-").map(Number);
  const d=new Date(Date.UTC(y,mo,0));
  d.setUTCDate(d.getUTCDate()+(terms||0));
  if(partnerRun){const past10=d.getUTCDate()>10;d.setUTCDate(1);if(past10)d.setUTCMonth(d.getUTCMonth()+1);d.setUTCDate(10);}
  return d.toISOString().slice(0,10);
}
/* Demo ECB-style FX table (USD-relative) + per-transaction-date conversion.
   Production pulls daily frankfurter.dev fixings; here the rate gets a small
   deterministic per-date wiggle so "converted at the transaction date" shows. */
const FX_USD={USD:1,EUR:0.92,AUD:1.53,GBP:0.79,ILS:3.64};
function fxConvert(amount,from,to,date){
  if(from===to||!FX_USD[from]||!FX_USD[to])return amount;
  let h=0;for(const ch of String(date||""))h=(h*31+ch.charCodeAt(0))%997;
  return amount*(FX_USD[to]/FX_USD[from])*(1+((h/997)-.5)*.02);
}

let dragId=null;
function dragOpp(ev,id){if(!canEdit()){ev.preventDefault();return;}dragId=id;ev.dataTransfer.setData("text/plain",id);ev.dataTransfer.effectAllowed="move";ev.currentTarget.classList.add("dragging");}
function dragEndOpp(ev){ev.currentTarget.classList.remove("dragging");dragId=null;document.querySelectorAll(".kcol.over").forEach(c=>c.classList.remove("over"));}
function dropOpp(ev,stage,el){ev.preventDefault();el.classList.remove("over");if(!canEdit()||!dragId)return;setStage(dragId,stage);dragId=null;}
function setStage(id,st){const o=O(id);if(o.stage===st)return render();o.stage=st;if(st==="closed-won")o.prob=100;if(st==="closed-lost")o.prob=0;render();toast(`${o.name} → ${stageOf(st)[1]}`);}
function movePipe(id,dir){const o=O(id);const i=STAGES.findIndex(s=>s[0]===o.stage);setStage(id,STAGES[Math.min(Math.max(i+dir,0),STAGES.length-1)][0]);}
function sortPipe(key){pipeSort=pipeSort.key===key?{key,dir:pipeSort.dir==="asc"?"desc":"asc"}:{key,dir:"asc"};render();}
function pagePipe(){
  const head=pageHead("Opportunities","Pipeline",`
    <span style="text-align:right;margin-right:6px"><span class="eyebrow">Weighted Pipeline</span><div style="font-family:var(--fd);font-weight:700;font-size:17px;color:var(--forest)">${fmt$(weighted())}</div></span>
    <span style="text-align:right;margin-right:6px"><span class="eyebrow">Closed Won</span><div style="font-family:var(--fd);font-weight:700;font-size:17px;color:var(--accent-t)">${fmt$(won())}</div></span>
    <span style="display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden">
      <button class="btn btn-sm" style="border:0;border-radius:0;${pipeView==="board"?"background:var(--forest);color:#fff":"background:transparent;color:var(--muted)"}" onclick="pipeView='board';render()">Board</button>
      <button class="btn btn-sm" style="border:0;border-radius:0;${pipeView==="list"?"background:var(--forest);color:#fff":"background:transparent;color:var(--muted)"}" onclick="pipeView='list';render()">List</button></span>
    <button class="btn btn-primary ce" onclick="newOpp()">+ Add Opportunity</button>`);
  if(pipeView==="list"){
    const list=[...opps].sort((a,b)=>{let av=a[pipeSort.key],bv=b[pipeSort.key];if(typeof av==="string")av=av.toLowerCase(),bv=String(bv).toLowerCase();const c=av<bv?-1:av>bv?1:0;return pipeSort.dir==="asc"?c:-c;});
    const arrow=k=>pipeSort.key===k?(pipeSort.dir==="asc"?" ↑":" ↓"):"";
    return head+`<div class="card"><div class="tbl-wrap"><table>
      <tr><th class="sortable" onclick="sortPipe('name')">Name${arrow("name")}</th><th>Partner</th><th>Type</th><th class="sortable" onclick="sortPipe('stage')">Stage${arrow("stage")}</th><th class="num sortable" onclick="sortPipe('value')">Value${arrow("value")}</th><th class="num sortable" onclick="sortPipe('prob')">Prob.${arrow("prob")}</th><th class="sortable" onclick="sortPipe('close')">Close Date${arrow("close")}</th><th>Tags</th><th></th></tr>
      ${list.map(o=>{const st=stageOf(o.stage);return `<tr>
        <td style="font-weight:600;cursor:pointer" onclick="openOpp('${o.id}')">${esc(o.name)}</td>
        <td style="color:var(--muted)">${esc(P(o.pid)?.name||"—")}</td>
        <td><span class="badge b-muted">${esc(o.type)}</span></td>
        <td><span class="badge ${st[2]}">${st[1]}</span></td>
        <td class="num" style="color:var(--forest)">${fmt$(o.value)}</td>
        <td class="num">${o.prob}%</td><td>${fmtDate(o.close)}</td>
        <td>${o.tags.map(t=>`<span class="tag-chip">${esc(t)}</span>`).join(" ")||"—"}</td>
        <td><button class="btn-icon ce" title="Edit" onclick="openOpp('${o.id}')">✎</button></td></tr>`;}).join("")}
    </table></div></div>`;
  }
  return head+`<div class="kb">${STAGES.map(([id,label,cls,color])=>{
    const list=opps.filter(o=>o.stage===id), sum=list.reduce((a,o)=>a+o.value,0);
    return `<div class="kcol" style="--sc:${color}" ondragover="if(canEdit()){event.preventDefault();event.dataTransfer.dropEffect='move';this.classList.add('over')}" ondragleave="if(!this.contains(event.relatedTarget))this.classList.remove('over')" ondrop="dropOpp(event,'${id}',this)">
      <div class="kh"><span class="badge ${cls}">${label}</span><span class="sum">${sum?fmt$(sum)+" · ":""}${list.length}</span></div>
      <div class="kcards">${list.map(o=>`<div class="kcard" draggable="${canEdit()}" ondragstart="dragOpp(event,'${o.id}')" ondragend="dragEndOpp(event)" onclick="openOpp('${o.id}')">
        <div class="n">${esc(o.name)}</div><div class="p">${esc(P(o.pid)?.name||"—")} · ${o.prob}%</div><div class="v">${fmt$(o.value)}</div>
        ${o.close?`<div style="font-size:11px;color:var(--muted);margin-top:4px">Close ${fmtDate(o.close)}</div>`:""}
        ${o.tags.length?`<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">${o.tags.slice(0,2).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join("")}</div>`:""}
        <div class="mv ce" onclick="event.stopPropagation()">
          ${id!=="prospect"?`<button class="mvb" onclick="movePipe('${o.id}',-1)">←</button>`:""}
          ${id!=="closed-lost"?`<button class="mvb" onclick="movePipe('${o.id}',1)">→ ${STAGES[STAGES.findIndex(s=>s[0]===id)+1][1].replace("Closed ","")}</button>`:""}
        </div></div>`).join("")||'<div style="font-size:11.5px;color:var(--t3);text-align:center;padding:12px">Empty</div>'}</div></div>`;
  }).join("")}</div>
  <div class="note" style="padding-left:0">Drag cards between columns or use the arrows — weighted pipeline recalculates live. Click a card to open the deal drawer.</div>`;
}
function newOpp(){DR={id:null,name:"",pid:"",stage:"prospect",value:0,prob:25,close:"",type:settings.opportunityTypes[0],tags:[],notes:""};modalOpp("Add Opportunity");}
function openOpp(id){DR=JSON.parse(JSON.stringify(O(id)));modalOpp("Edit — "+DR.name);}
function modalOpp(title){const dis=canEdit()?"":"disabled";
  openModal(title,`
    <div class="fg"><label class="label">Opportunity Name *</label><input class="inp" ${dis} value="${esc(DR.name)}" oninput="DR.name=this.value" placeholder="e.g. TradeDesk Q2 Expansion"></div>
    <div class="frow">
      <div class="fg"><label class="label">Partner</label><select class="inp" ${dis} onchange="DR.pid=this.value">${partnerOpts(DR.pid)}</select></div>
      <div class="fg"><label class="label">Type</label><select class="inp" ${dis} onchange="DR.type=this.value">${selOpts(settings.opportunityTypes,DR.type)}</select></div>
    </div>
    <div class="frow">
      <div class="fg"><label class="label">Stage</label><select class="inp" ${dis} onchange="DR.stage=this.value">${STAGES.map(s=>`<option value="${s[0]}"${s[0]===DR.stage?" selected":""}>${s[0]}</option>`).join("")}</select></div>
      <div class="fg"><label class="label">Value</label><input class="inp" ${dis} type="number" value="${DR.value}" oninput="DR.value=+this.value"></div>
      <div class="fg" style="max-width:110px"><label class="label">Probability %</label><input class="inp" ${dis} type="number" min="0" max="100" value="${DR.prob}" oninput="DR.prob=+this.value"></div>
    </div>
    <div class="frow">
      <div class="fg"><label class="label">Expected Close</label><input class="inp" ${dis} type="date" value="${DR.close||""}" oninput="DR.close=this.value"></div>
      <div class="fg"><label class="label">Tags (comma separated)</label><input class="inp" ${dis} value="${esc(DR.tags.join(", "))}" oninput="DR._tags=this.value"></div>
    </div>
    <div class="fg"><label class="label">Internal Notes</label><textarea class="inp" ${dis} rows="3" oninput="DR.notes=this.value">${esc(DR.notes)}</textarea></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary ce" onclick="saveOpp()">${DR.id?"Save Changes":"Add Opportunity"}</button>`);
}
function saveOpp(){
  if(!DR.name.trim())return toast("Name is required");
  if(DR._tags!==undefined)DR.tags=DR._tags.split(",").map(s=>s.trim()).filter(Boolean);
  if(DR.stage==="closed-won")DR.prob=100; if(DR.stage==="closed-lost")DR.prob=0;
  if(DR.id){Object.assign(O(DR.id),{name:DR.name,pid:DR.pid,stage:DR.stage,value:DR.value,prob:DR.prob,close:DR.close,type:DR.type,tags:DR.tags,notes:DR.notes});toast("Opportunity updated");}
  else{DR.id=uid();delete DR._tags;opps.push(DR);toast("Opportunity added");}
  closeModal();render();
}
/* ============================ partners ============================ */
function pFilterSet(k,v){pFilter[k]=pFilter[k]===v?"":v;render();}

  const list=partners.filter(p=>
    (!q||p.name.toLowerCase().includes(q)||p.contacts.some(c=>c.name.toLowerCase().includes(q))||p.tags.some(t=>t.includes(q)))&&

        ${p.access?.crm?'<span class="badge b-forest" style="margin-left:6px;font-size:9px;border:1px solid rgba(10,79,50,.25)">CRM</span>':""}
        ${p.access?.traquery?'<span class="badge b-info" style="margin-left:4px;font-size:9px;border:1px solid rgba(41,128,185,.3)">TQ</span>':""}
        ${p.website?`<div style="font-size:11.5px;color:var(--muted);margin-left:32px">${esc(p.website)}</div>`:""}</td>
      <td><span class="badge ${typeBadge(p.type)}">${esc(p.type)}</span></td><td><span class="badge b-muted">${esc(p.cat)}</span></td>
      <td>${pc?`<div style="font-size:12.5px"><div style="font-weight:600">${esc(pc.name)}</div><div style="color:var(--muted)">${esc(pc.email)}</div></div>`:"—"}</td>
      <td class="num">Net ${p.terms}</td><td class="num" style="color:var(--forest)">${rv?fmt$(rv):"—"}</td>

      <td><span class="badge ${statusBadge(p.status)}">${esc(p.status)}</span></td></tr>`;}).join("")||'<tr><td colspan="8" class="note" style="text-align:center">No partners found</td></tr>'}
  </table></div>

}

function savePartner(){
  if(!DR.name.trim())return toast("Company name is required");
  if(DR._tags!==undefined)DR.tags=DR._tags.split(",").map(s=>s.trim()).filter(Boolean);
  delete DR._tags;
  if(DR.id){const i=partners.findIndex(p=>p.id===DR.id);partners[i]=DR;toast("Partner updated");}
  else{DR.id=uid();partners.push(DR);toast("Partner added");}
  closeModal();render();
}

/* ============================ tasks ============================ */
const TASK_COLS=[["todo","To Do","#4A5752"],["in-progress","In Progress","#2980B9"],["done","Done","#1f7a00"]];
let dragTask=null;
function tDrag(ev,id){if(!canEdit()){ev.preventDefault();return;}dragTask=id;ev.dataTransfer.setData("text/plain",id);}
function tDrop(ev,st,el){ev.preventDefault();el.classList.remove("over");if(!canEdit()||!dragTask)return;setTaskStatus(dragTask,st);dragTask=null;}
function setTaskStatus(id,st){const t=tasks.find(x=>x.id===id);if(t.status===st)return render();t.status=st;render();toast(`"${t.title}" → ${TASK_COLS.find(c=>c[0]===st)[1]}`);}
function pageTasks(){
  const counts=Object.fromEntries(TASK_COLS.map(([s])=>[s,tasks.filter(t=>t.status===s).length]));
  return pageHead("Work","Tasks",
    TASK_COLS.map(([s,l,c])=>`<span style="text-align:right;margin-right:8px"><span class="eyebrow">${l}</span><div style="font-family:var(--fd);font-weight:700;font-size:17px;color:${c}">${counts[s]}</div></span>`).join("")+
    `<button class="btn btn-primary ce" onclick="newTask()">+ Add Task</button>`)+`
  <div class="kb">${TASK_COLS.map(([st,label,color])=>{
    const list=tasks.filter(t=>t.status===st).sort((a,b)=>PRI_ORDER[a.pri]-PRI_ORDER[b.pri]);
    return `<div class="kcol" style="min-width:270px;width:270px" ondragover="if(canEdit()){event.preventDefault();this.classList.add('over')}" ondragleave="this.classList.remove('over')" ondrop="tDrop(event,'${st}',this)">
      <div class="kh"><span style="font-family:var(--fd);font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:${color}">${label}</span><span class="badge ${statusBadge(st)}">${list.length}</span></div>
      <div class="kcards">${list.map(t=>{const od=t.status!=="done"&&t.due&&t.due<todayISO();
        return `<div class="kcard" draggable="${canEdit()}" ondragstart="tDrag(event,'${t.id}')" onclick="openTask('${t.id}')" style="${t.status==="done"?"opacity:.65":""}">
        <div class="n" style="${t.status==="done"?"text-decoration:line-through;color:var(--muted)":""}">${esc(t.title)}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap">
          <span style="font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:${PRI_COLOR[t.pri]}">${t.pri}</span>
          ${t.due?`<span style="font-size:11.5px;color:${od?"var(--danger)":"var(--muted)"}">${od?"⚠ ":""}Due ${fmtDate(t.due)}</span>`:""}
        </div>
        ${t.pid||t.oid?`<div style="font-size:11.5px;color:var(--muted);margin-top:4px">${t.pid?"↳ "+esc(P(t.pid).name):""}${t.oid?" · "+esc(O(t.oid).name):""}</div>`:""}
        <div class="mv ce" onclick="event.stopPropagation()">
          ${st!=="todo"?`<button class="mvb" onclick="setTaskStatus('${t.id}','${st==="done"?"in-progress":"todo"}')">←</button>`:""}
          ${st!=="done"?`<button class="mvb" onclick="setTaskStatus('${t.id}','${st==="todo"?"in-progress":"done"}')">→ ${st==="todo"?"start":"done"}</button>`:""}
        </div></div>`;}).join("")||'<div style="font-size:11.5px;color:var(--t3);text-align:center;padding:12px">Empty</div>'}</div></div>`;
  }).join("")}</div>
  <div class="note" style="padding-left:0">Drag tasks between columns or use the arrows. Overdue due-dates flag in warning red.</div>`;
}

/* ============================ revenue — P&L workbench ============================ */
const mLabel=m=>new Date(m+"-01T00:00").toLocaleDateString("en-US",{month:"short",year:"2-digit"});
const mLabelLong=m=>new Date(m+"-01T00:00").toLocaleDateString("en-US",{month:"long",year:"numeric"});

/* Most reliable figure wins on the P&L: synced platform numbers are an
   estimate until the month is settled. Once a partner-month's payment item is
   APPROVED, the approved amount is the truth; once PAID, what actually landed
   (possibly in another currency) is. The operational entries behind that
   partner-month are rescaled pro rata so the platform split and transaction
   dates (FX) survive and the total equals the authoritative figure. The
   Transactions tab keeps the raw ledger. */
function applySettled(entries){
  const auth=new Map();
  payments.forEach(p=>{
    if(!p.pid||p.status==="pending-approval")return;
    const paid=p.status==="paid"&&p.paidAmount>0;
    auth.set(`${p.pid}|${p.month}|${p.dir==="receivable"?"revenue":"cost"}`,
      {amount:paid?p.paidAmount:p.amount,currency:paid?(p.paidCurrency||p.currency):p.currency,tag:p.status==="paid"?"settled:paid":"settled:approved"});
  });
  if(!auth.size)return entries;
  const groups=new Map();
  entries.forEach(e=>{
    if(!e.pid||e.amount<=0||scopeOf(e)!=="operational")return;
    const k=`${e.pid}|${e.date.slice(0,7)}|${e.type}`;
    if(!auth.has(k))return;
    if(!groups.has(k))groups.set(k,[]);
    groups.get(k).push(e);
  });
  const replaced=new Map(),synth=[];
  for(const[k,t]of auth){
    const g=groups.get(k)||[],total=g.reduce((a,e)=>a+e.amount,0);
    if(total>0){
      const f=t.amount/total;
      g.forEach(e=>replaced.set(e.id,{...e,amount:Math.round(e.amount*f*100)/100,currency:t.currency,tags:[...e.tags,t.tag]}));
    }else{
      const[pid,month,type]=k.split("|");
      synth.push({id:"settled-"+k,type,pid,amount:t.amount,currency:t.currency,category:"other",scope:"operational",
        description:(t.tag==="settled:paid"?"Paid":"Approved")+" amount — "+mLabelLong(month),date:lastDayOf(month),tags:["settled",t.tag]});
    }
  }
  return entries.map(e=>replaced.get(e.id)||e).concat(synth);
}
const pnlEntries=()=>applySettled(revenueEntries);
const opEntries=()=>pnlEntries().filter(e=>scopeOf(e)==="operational");
const expEntries=()=>pnlEntries().filter(e=>scopeOf(e)==="expense");
/* Everything the graphs/KPIs show is converted into the one selected display
   currency at each TRANSACTION's date. */
const fxE=list=>list.map(e=>({...e,currency:fxCcy,amount:Math.round(fxConvert(e.amount,e.currency,fxCcy,e.date)*100)/100}));

/* Business series: operational trading only. */
function monthlyBusiness(op){
  const m={};
  op.forEach(e=>{const k=e.date.slice(0,7);if(!m[k])m[k]={month:k,revenue:0,cost:0,expenses:0};m[k][e.type==="revenue"?"revenue":"cost"]+=e.amount;});
  return Object.values(m).sort((a,b)=>a.month.localeCompare(b.month)).map(r=>({...r,profit:r.revenue-r.cost,label:mLabel(r.month)}));
}
/* Corp series: operational rev/cost + business expenses + corp net. */
function monthlyCorp(op,exp){
  const m={},b=k=>(m[k]||(m[k]={month:k,revenue:0,cost:0,expenses:0}));
  op.forEach(e=>{const r=b(e.date.slice(0,7));if(e.type==="revenue")r.revenue+=e.amount;else r.cost+=e.amount;});
  exp.forEach(e=>{const r=b(e.date.slice(0,7));if(e.type==="revenue")r.revenue+=e.amount;else r.expenses+=e.amount;});
  return Object.values(m).sort((a,b2)=>a.month.localeCompare(b2.month)).map(r=>({...r,profit:r.revenue-r.cost-r.expenses,label:mLabel(r.month)}));
}
/* P&L breakdown: month → partner|platform rows, newest month first. */
function buildBreakdown(groupBy){
  const byMonth=new Map();
  for(const e of opEntries()){
    const month=e.date.slice(0,7), platform=platformOf(e);
    const key=groupBy==="partner"?(e.pid||"—"):platform;
    const name=groupBy==="partner"?(P(e.pid)?.name||"Unassigned"):platform;
    if(!byMonth.has(month))byMonth.set(month,new Map());
    const rows=byMonth.get(month);
    if(!rows.has(key))rows.set(key,{key,name,pid:groupBy==="partner"?e.pid:null,platforms:[],revenue:0,cost:0});
    const row=rows.get(key);
    if(!row.platforms.includes(platform))row.platforms.push(platform);
    const amtUsd=fxConvert(e.amount,e.currency||"USD","USD",e.date); // table shows USD; settled figures keep their FX effect
    if(e.type==="revenue")row.revenue+=amtUsd;else row.cost+=amtUsd;
  }
  return [...byMonth.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([month,rows])=>{
    const list=[...rows.values()].sort((a,b)=>(b.revenue+b.cost)-(a.revenue+a.cost));
    return {month,rows:list,revenue:list.reduce((a,r)=>a+r.revenue,0),cost:list.reduce((a,r)=>a+r.cost,0)};
  });
}
/* Corp-view expense block: month → category rows. */
function buildExpenseBlocks(){
  const byMonth=new Map();
  for(const e of expEntries()){
    const month=e.date.slice(0,7), platform=platformOf(e);
    if(!byMonth.has(month))byMonth.set(month,new Map());
    const rows=byMonth.get(month);
    if(!rows.has(e.category))rows.set(e.category,{name:e.category,platforms:[],cost:0});
    const row=rows.get(e.category);
    if(!row.platforms.includes(platform))row.platforms.push(platform);
    row.cost+=fxConvert(e.amount,e.currency||"USD","USD",e.date);
  }
  const out=new Map();
  for(const [month,rows] of byMonth){
    const list=[...rows.values()].sort((a,b)=>b.cost-a.cost);
    out.set(month,{rows:list,total:list.reduce((a,r)=>a+r.cost,0)});
  }
  return out;
}

function submitMarkPaid(){
  const p=PAY(DR.pid);if(!p)return;

/* Nightly Wise auto-reconciliation (demo trigger): a pending payment is marked
   PAID when a completed Wise activity matches it — payee name or remembered
   payer alias in the title, same direction, amount within 0.5% same-currency
   or 3% cross-currency at the ECB rate of the transfer date. */
function wiseReconcileDemo(){
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  let matched=0;
  for(const p of payments){
    if(p.status!=="approved"&&p.status!=="invoiced")continue;
    const payeeId=p.pid||p.sid;
    const aliases=[payPayeeName(p),...((p.pid?P(p.pid)?.payerNames:null)||[])].map(norm).filter(n=>n.length>=3);
    if(!payeeId||!aliases.length)continue;
    const want=p.dir==="receivable";
    const hit=wiseActivities.find(a=>{
      if(a.used||(a.dir==="in")!==want)return false;
      const t=norm(a.title);
      if(!aliases.some(n=>t.includes(n)||n.includes(t)))return false;
      const expected=fxConvert(p.amount,p.currency,a.ccy,a.date);
      const tol=a.ccy===p.currency?Math.max(.05,expected*.005):expected*.03;
      return Math.abs(a.amount-expected)<=tol;
    });
    if(!hit)continue;
    hit.used=true;matched++;
    Object.assign(p,{status:"paid",paidAt:hit.date,paidAmount:hit.amount,paidCurrency:hit.ccy,paidVia:"wise",paidRef:hit.title,wiseId:hit.id});
    if(p.sid)reconcileServiceExpenseDemo(p);
  }
  render();
  toast(matched?`Wise reconciliation: ${matched} payment${matched>1?"s":""} matched to completed activity and marked paid — in production this runs nightly and emails a summary`
               :"Wise reconciliation: no pending payment matched a completed Wise activity");
}

/* Nightly rebook (demo trigger): items still PENDING APPROVAL re-book to the
   figures the sync says today (restated platform numbers). Approved/paid
   figures are the operator's decision and never move; the current month is
   never booked at all (a month-to-date figure is not a booked amount). */
function rebookDemo(){
  const cur=monthOf(0);let rebooked=0;
  for(const p of payments){
    if(p.status!=="pending-approval"||!p.pid||p.month>=cur)continue;
    const synced=revenueEntries.filter(e=>e.pid===p.pid&&e.date.slice(0,7)===p.month&&e.type===(p.dir==="receivable"?"revenue":"cost")&&scopeOf(e)==="operational")
      .reduce((a,e)=>a+e.amount,0);
    if(synced>0&&(synced!==p.amount||synced!==p.bookedAmount)){p.amount=synced;p.bookedAmount=synced;rebooked++;}
  }
  render();
  toast(rebooked?`Rebooked ${rebooked} pending-approval item${rebooked>1?"s":""} to the restated sync figures — approved and paid amounts never move, and the current month is never booked`
               :"Nothing to rebook — every pending item already matches the sync, and the current month is never booked");
}

          <span style="font-family:var(--fd);font-weight:600;font-size:12px;color:var(--muted);width:64px;text-align:right">${fmt$(d.value)}</span></div>`).join("")}</div>`;}).join("")}</div>`;

  const breakdown=buildBreakdown(revGroupBy), blocks=buildExpenseBlocks();
  const months=corp?[...new Set([...breakdown.map(s=>s.month),...blocks.keys()])].sort((a,b)=>b.localeCompare(a))
                   :breakdown.map(s=>s.month);
  const secOf=m=>breakdown.find(s=>s.month===m)||{month:m,rows:[],revenue:0,cost:0};

  return head+overdueBanner+`
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
    <span class="eyebrow" style="letter-spacing:.2em">${corp?"Corp P&amp;L":"Business P&amp;L"}</span>
    <select class="inp" style="width:auto;padding:4px 8px;font-size:12px;font-family:var(--fd);font-weight:700" title="Time frame for the figures below — one calendar month, or all time" onchange="kpiMonth=this.value;render()">
      ${kpiMonths.map(m=>`<option value="${m}"${frame===m?" selected":""}>${mLabelLong(m)}</option>`).join("")}
      <option value="all"${frame==="all"?" selected":""}>All time</option></select>
    ${frame===monthOf(0)?`<span style="font-size:11.5px;color:var(--gold-d);font-family:var(--fd);font-weight:700;text-transform:uppercase;letter-spacing:.06em">month to date</span>`:""}
    <span title="Each partner-month shows its most reliable figure: the amount actually paid, else the approved amount, else the synced platform number. The Transactions tab keeps the raw ledger."
      style="margin-left:auto;font-size:10.5px;color:var(--t3);font-family:var(--fd);font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:help">figures: paid › approved › synced</span>
  </div>
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
    ${kpis.map(([l,v,c])=>`<div class="kpi"><div class="l">${l}</div><div class="v" style="color:${c}">${v}</div></div>`).join("")}
  </div>
  <div class="card"><div class="h"><span class="t">Analytics</span>
    <span style="margin-left:auto;display:inline-flex;gap:4px;align-items:center">
      <select class="inp" style="width:76px;padding:4px 8px;font-size:12px;font-family:var(--fd);font-weight:700" title="Display currency — shared with the Dashboard; every amount converted at its transaction date (ECB daily rates)" onchange="setFxCcy(this.value)">
        ${FX_CURRENCIES.map(c=>`<option value="${c}"${fxCcy===c?" selected":""}>${c}</option>`).join("")}</select>
      <button class="btn btn-sm" style="${revTab==="monthly"?"background:var(--forest);color:#fff;border:1px solid var(--forest)":"background:transparent;color:var(--muted);border:1px solid rgba(10,79,50,.2)"}" onclick="revTab='monthly';render()">Monthly Trend</button>
      <button class="btn btn-sm" style="${revTab==="category"?"background:var(--forest);color:#fff;border:1px solid var(--forest)":"background:transparent;color:var(--muted);border:1px solid rgba(10,79,50,.2)"}" onclick="revTab='category';render()">By Category</button></span></div>
    ${chart}</div>

  <div class="card"><div class="h"><span class="t">Monthly Breakdown</span>
    <span style="margin-left:auto;display:inline-flex;gap:4px">
      ${["partner","platform"].map(g=>`<button class="btn btn-sm" style="${revGroupBy===g?"background:var(--forest);color:#fff;border:1px solid var(--forest)":"background:transparent;color:var(--muted);border:1px solid rgba(10,79,50,.2)"}" onclick="revGroupBy='${g}';render()">By ${g==="partner"?"Partner":"Platform"}</button>`).join("")}</span></div>
  <div class="tbl-wrap">
    ${months.map(m=>{
      const sec=secOf(m), blk=corp?blocks.get(m):null;
      const opNet=sec.revenue-sec.cost, corpNet=opNet-(blk?blk.total:0);
      const open=expandedMonths.has(m);
      return `<div style="border-bottom:1px solid rgba(10,79,50,.08)">
        <div onclick="toggleMonth('${m}')" title="${open?"Collapse":"Expand"} month" style="padding:11px 16px;background:rgba(10,79,50,.045);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;cursor:pointer;user-select:none">
          <span style="font-family:var(--fd);font-weight:700;font-size:14px;color:var(--forest);letter-spacing:.04em">${open?"▾":"▸"} ${mLabelLong(m)}</span>
          <span style="font-size:12px;color:var(--muted)">
            rev <b style="color:var(--forest)">${sec.revenue?fmt$(sec.revenue):"—"}</b> · cost <b style="color:var(--danger)">${sec.cost?fmt$(sec.cost):"—"}</b>
            ${corp?` · op net <b style="color:${opNet>=0?"var(--forest)":"var(--danger)"}">${fmt$(opNet)}</b> · expenses <b style="color:#E67E22">${blk?fmt$(blk.total):"—"}</b> · corp net <b style="color:${corpNet>=0?"var(--forest)":"var(--danger)"}">${fmt$(corpNet)}</b>`
                 :` · net <b style="color:${opNet>=0?"var(--forest)":"var(--danger)"}">${fmt$(opNet)}</b>`}
          </span></div>
        ${open?`<table>
          ${sec.rows.map(r=>`<tr>
            <td style="font-weight:500;width:26%">${esc(r.name)}${revGroupBy==="partner"&&r.platforms.length?`<span style="margin-left:8px">${r.platforms.map(pl=>`<span class="tag-chip" style="margin-right:3px;font-size:9.5px">${esc(pl)}</span>`).join("")}</span>`:""}</td>
            <td style="width:18%">${money(r.revenue,"var(--forest)","+")}</td>
            <td style="width:10%">${revGroupBy==="partner"?payStatusChip(r,m,"receivable"):""}</td>
            <td style="width:18%">${money(r.cost,"var(--danger)","–")}</td>
            <td style="width:10%">${revGroupBy==="partner"?payStatusChip(r,m,"payable"):""}</td>
            <td class="num" style="width:18%;padding-right:18px">${money(r.revenue-r.cost,(r.revenue-r.cost)>=0?"var(--forest)":"var(--danger)","")}</td></tr>`).join("")}
          ${blk?blk.rows.map(er=>`<tr style="background:rgba(230,126,34,.04)">
            <td style="width:26%;color:#8A6220"><span style="font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#E67E22;margin-right:8px">Expense</span>${esc(er.name)}
              <span style="margin-left:8px">${er.platforms.map(pl=>`<span class="tag-chip" style="margin-right:3px;font-size:9.5px">${esc(pl)}</span>`).join("")}</span></td>
            <td style="width:18%"><span style="color:#B9C2BE">—</span></td><td style="width:10%"></td>
            <td style="width:18%">${money(er.cost,"#E67E22","–")}</td><td style="width:10%"></td>
            <td class="num" style="width:18%;padding-right:18px">${money(er.cost,"#E67E22","–")}</td></tr>`).join(""):""}
          ${!sec.rows.length&&!(blk&&blk.rows.length)?`<tr><td colspan="6" style="color:var(--t3);font-size:12.5px">No activity</td></tr>`:""}
        </table>`:""}</div>`;}).join("")}
  </div>
  ${revGroupBy==="partner"?`<div class="note">Payments open automatically on the 2nd for the month that just closed — review, edit and approve them on the Payments tab. Settled months show the paid/approved figure here (pro-rata across the month's entries).</div>`:""}
  </div>`;
}

/* -------- Payments tab: colour-coded groups + per-column filters -------- */
function pfSet(k,v,id){payFilters[k]=v;render();if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(err){}}}}
function payColumns(){
  const sum1=p=>fxConvert(p.amount,p.currency,"USD",p.due||todayISO());
  void sum1;
  const statusVal=p=>p.status!=="paid"&&isOverdue(p)?"overdue":p.status;
  return [
    {k:"payee",label:"Payee",text:p=>payPayeeName(p)+" "+(p.platforms||[]).join(" ")},
    {k:"month",label:"Month",opts:[...new Set(payments.map(p=>p.month))].sort((a,b)=>b.localeCompare(a)).map(m=>[m,mLabelLong(m)]),val:p=>p.month},
    {k:"type",label:"Type",opts:PAY_KINDS.map(k=>[k,PAY_KIND_META[k].label]),val:p=>payKindOf(p)},
    {k:"approved",label:"Approved",text:p=>`${p.amount} ${fmtC(p.amount,p.currency)} ${p.currency}`},
    {k:"booked",label:"Booked",text:p=>p.bookedAmount!=null?`${p.bookedAmount} ${fmtC(p.bookedAmount,p.currency)}`:""},
    {k:"delta",label:"Δ",text:p=>{if(p.bookedAmount==null||!p.bookedAmount)return "";const d=Math.round((p.amount-p.bookedAmount)*100)/100;return `${d} ${((d/p.bookedAmount)*100).toFixed(1)}%`;}},
    {k:"due",label:"Due",text:p=>(p.due||"")+" "+(p.due?fmtDate(p.due):"")},
    {k:"status",label:"Status",opts:[["pending-approval","Pending approval"],["approved","Amount approved"],["invoiced","Pending payment"],["overdue","Overdue"],["paid","Paid"]],val:statusVal,
      text:p=>`${p.status} ${p.paidVia||""} ${p.paidRef||""} ${p.xeroNum||""} ${isOverdue(p)?"overdue":""}`},
    {k:"file",label:"Invoice / Approval",text:p=>p.file||""},
  ];
}
function revPayments(){
  const od=overduePayments();
  const usd=p=>fxConvert(p.amount,p.currency,"USD",p.due||todayISO());
  const rec=payments.filter(p=>p.status!=="paid"&&p.dir==="receivable").reduce((a,p)=>a+usd(p),0);
  const pay=payments.filter(p=>p.status!=="paid"&&p.dir==="payable").reduce((a,p)=>a+usd(p),0);
  const nPend=payments.filter(p=>p.status==="pending-approval").length;
  const nAwait=payments.filter(p=>p.status==="approved").length;
  const cols=payColumns();
  const active=Object.entries(payFilters).filter(([,v])=>v&&v.trim());
  const sorted=[...payments].sort((a,b)=>(PAY_STATUS_ORDER[a.status]??9)-(PAY_STATUS_ORDER[b.status]??9)||String(a.due).localeCompare(String(b.due)));
  const filtered=active.length?sorted.filter(p=>active.every(([k,v])=>{
    const c=cols.find(x=>x.k===k);if(!c)return true;
    if(c.opts&&c.val)return c.val(p)===v;
    return (c.text?c.text(p):"").toLowerCase().includes(v.trim().toLowerCase());
  })):sorted;
  const dis=canEdit()?"":"disabled";
  const kindChip=k=>{
    const meta=k==="all"?null:PAY_KIND_META[k];
    const items=k==="all"?payments:payments.filter(p=>payKindOf(p)===k);
    const open=items.filter(p=>p.status!=="paid").reduce((a,p)=>a+usd(p),0);
    const on=payKind===k, color=meta?meta.color:"#0E2419";
    return `<button type="button" title="${meta?esc(meta.hint):"Every payment item"}" onclick="payKind='${k}';render()"
      style="display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:2px;cursor:pointer;border:1px solid ${on?color:"rgba(10,79,50,.18)"};background:${on?color:"transparent"};color:${on?"#fff":color};font-family:var(--fd);font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase">
      ${meta?meta.icon+" ":""}${meta?meta.label:"All"} <span style="opacity:.8;font-weight:600">${items.length}</span>${k!=="all"&&open?`<span style="font-weight:600;letter-spacing:0;text-transform:none;opacity:.8">· ${fmt$(open)} open</span>`:""}</button>`;
  };
  const statusCell=p=>{
    const km=PAY_KIND_META[payKindOf(p)];
    if(p.status==="paid"){
      const cross=p.paidCurrency&&p.paidCurrency!==p.currency;
      return `<span style="display:inline-flex;flex-direction:column;gap:2px">
        <button type="button" title="Paid ${p.paidAt?fmtDate(p.paidAt):""} — click to reopen" ${canEdit()?`onclick="payReopen('${p.id}')"`:""} style="display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;cursor:${canEdit()?"pointer":"default"};font-family:var(--fd);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:#1f7a00;padding:0">✓ Paid ${p.paidAt?fmtDate(p.paidAt):""}</button>
        ${p.paidRef||p.paidVia||cross?`<span style="font-size:11.5px;color:var(--muted);white-space:nowrap" ${cross?`title="Implied rate 1 ${p.currency} = ${(p.paidAmount/p.amount).toFixed(4)} ${p.paidCurrency} — cents kept on settlement figures"`:""}>${cross?`<b style="font-family:var(--fd);font-size:12.5px;color:${km.color}">${money2(p.paidAmount,p.paidCurrency)}</b> `:""}${p.paidVia?`via ${({wise:"Wise",bank:"Bank transfer",cash:"Cash",other:"Other"})[p.paidVia]||p.paidVia}`:""}${p.paidRef?` · ${esc(p.paidRef)}`:""}</span>`:""}
        ${p.wiseId?`<span class="badge b-accent" style="align-self:flex-start" title="Matched automatically to a completed Wise activity by the nightly reconciliation — payee name or remembered payer alias, cross-currency compared at the ECB rate of the transfer date">⇄ reconciled via Wise</span>`:""}</span>`;
    }
    if(p.status==="pending-approval")
      return `<button type="button" class="btn btn-sm btn-primary ce" title="Approve this amount (edit the Approved field first if needed)" onclick="payApprove('${p.id}')">✓ Approve</button>`;
    if(p.status==="approved")
      return `<span style="display:inline-flex;flex-direction:column;gap:2px">
        <span title="${p.approvedAt?`Approved ${fmtDate(p.approvedAt)} — attach the invoice (paperclip →) or let the Xero sync file it to move this to pending payment`:"Approved"}" style="display:inline-flex;align-items:center;gap:5px;font-family:var(--fd);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#2980B9;white-space:nowrap">▤ Amount approved</span>
        <span style="font-size:11px;color:var(--muted);white-space:nowrap">awaiting invoice · attach or sync from Xero</span></span>`;
    return `<span style="display:inline-flex;align-items:center;gap:8px">
      <span title="${p.invoicedAt?`Invoiced ${fmtDate(p.invoicedAt)}`:"Invoiced"}${p.xeroNum?` — Xero ${p.xeroNum}`:""}" style="display:inline-flex;flex-direction:column;font-family:var(--fd);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#887B05;white-space:nowrap">Pending payment${p.xeroNum?`<span style="font-family:var(--fb);font-weight:500;font-size:10.5px;text-transform:none;letter-spacing:0;color:var(--muted)">Xero ${esc(p.xeroNum)}</span>`:""}</span>
      <button type="button" class="btn btn-sm btn-ghost ce" title="Record the received amount, currency, and payer" onclick="openMarkPaid('${p.id}')">Mark Paid</button></span>`;
  };
  const row=p=>{
    const kind=payKindOf(p), km=PAY_KIND_META[kind], o=isOverdue(p);
    const typeTitle=kind==="service"
      ?"Service — we pay. Month is the SERVICE month: a payment made in month M covers service used in M-1."
      :`${km.hint}. Demand and supply stay separate items per partner per month — never netted automatically.`;
    const delta=(()=>{if(p.bookedAmount==null||!p.bookedAmount)return `<span style="color:#B9C2BE">—</span>`;
      const d=Math.round((p.amount-p.bookedAmount)*100)/100;
      if(!d)return `<span style="color:var(--t3);font-size:12px">0%</span>`;
      const up=d>0,pct=(d/p.bookedAmount)*100;
      return `<span title="Approved ${fmtC(p.amount,p.currency)} vs booked ${fmtC(p.bookedAmount,p.currency)} (the synced figure at approval time)" style="font-family:var(--fd);font-weight:700;font-size:12.5px;color:${up?"#1f7a00":"var(--danger)"}">${up?"+":""}${fmtC(d,p.currency)} (${up?"+":""}${pct.toFixed(1)}%)</span>`;})();
    return `<tr style="${o?"background:rgba(192,57,43,.05)":""}">
      <td style="font-weight:500;border-left:4px solid ${km.color}">${esc(payPayeeName(p))}${(p.platforms||[]).map(pl=>`<span class="tag-chip" style="margin-left:5px;font-size:9.5px">${esc(pl)}</span>`).join("")}
        <button type="button" class="ce" title="${p.recurring?"Repeats monthly — a fresh copy opens with each new month. Click to stop.":"Make this a repeating monthly payment"}" onclick="payToggleRecurring('${p.id}')" style="margin-left:6px;border:0;background:transparent;cursor:pointer;padding:0;vertical-align:middle;color:${p.recurring?"var(--forest)":"#B9C2BE"}">⟳</button></td>
      <td style="color:var(--muted);font-size:12.5px"${kind==="service"?` title="Service-month convention: paid in month M = used in M-1 — this item's month is the service month"`:""}>${mLabelLong(p.month)}${kind==="service"?` <span style="color:var(--t3);cursor:help">ⓘ</span>`:""}</td>
      <td><span title="${esc(typeTitle)}" style="display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:2px;background:${km.tint};border:1px solid ${km.color}40;font-family:var(--fd);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:${km.color};white-space:nowrap">${km.icon} ${kind==="service"?"Service":km.label}</span></td>
      <td>${p.status==="paid"||!canEdit()
        ?`<span style="font-family:var(--fd);font-weight:700;font-size:14px;color:${km.color}">${fmtC(p.amount,p.currency)}</span>`
        :`<input class="inp" type="number" step="0.01" value="${p.amount}" title="Approved amount — edit and click away to save" onchange="payAmount('${p.id}',this.value)" style="width:110px;padding:4px 8px;font-size:13.5px;font-family:var(--fd);font-weight:700;color:${km.color}">`}</td>
      <td style="color:var(--muted);font-size:12.5px" title="The synced P&amp;L figure at approval time — the pre-edit baseline">${p.bookedAmount!=null?fmtC(p.bookedAmount,p.currency):"—"}</td>
      <td>${delta}</td>
      <td>${p.status==="paid"||!canEdit()
        ?`<span style="color:var(--muted);font-size:12.5px">${p.due?fmtDate(p.due):"—"}</span>`
        :`<input class="inp" type="date" value="${p.due||""}" title="Partner runs land on the 10th — first 10th on/after month-end + net terms (editable)" onchange="payDue('${p.id}',this.value)" style="width:140px;padding:4px 8px;font-size:12px;${o?"border-color:var(--danger);color:var(--danger);font-weight:600":""}">`}
        ${o?`<span style="margin-left:6px;font-family:var(--fd);font-weight:700;font-size:10px;color:var(--danger);text-transform:uppercase;letter-spacing:.08em">Overdue</span>`:""}</td>
      <td>${statusCell(p)}</td>
      <td>${p.file?`<span class="tag-chip" title="Attached — downloads from Drive in production">📎 ${esc(p.file)}</span>`
        :`<button class="btn-icon ce" title="Attach the invoice or approval — moves an approved item to pending payment. Google Drive when connected, otherwise a 5 MB fallback" onclick="payAttach('${p.id}')">📎</button>`}</td>
      <td><button class="btn-icon ce" title="Delete payment — the revenue entries behind it stay untouched" onclick="payDelete('${p.id}')">🗑</button></td></tr>`;
  };
  const groups=PAY_KINDS.filter(k=>payKind==="all"||payKind===k).map(kind=>{
    const group=filtered.filter(p=>payKindOf(p)===kind);
    if(!group.length)return "";
    const km=PAY_KIND_META[kind];
    const open=group.filter(p=>p.status!=="paid").reduce((a,p)=>a+usd(p),0);
    const pend=group.filter(p=>p.status==="pending-approval").length;
    return `<tr><td colspan="10" style="background:${km.tint};border-left:4px solid ${km.color};border-top:1px solid ${km.color}33;padding:9px 14px">
      <span style="display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:${km.color}">${km.icon} ${km.label}</span>
      <span style="margin-left:10px;font-size:12px;color:var(--muted)">${km.hint} · ${group.length} item${group.length===1?"":"s"}${pend?` · ${pend} pending approval`:""}${open?` · <b style="font-family:var(--fd);font-size:13.5px;color:${km.color}">${fmt$(open)}</b> open`:""}</span></td></tr>`
      +group.map(row).join("");
  }).join("");
  return `
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
    <div class="kpi"><div class="l">Pending Approval</div><div class="v" style="color:#E67E22">${nPend}</div></div>
    <div class="kpi"><div class="l">Awaiting Invoice</div><div class="v" style="color:#2980B9">${nAwait}</div></div>
    <div class="kpi"><div class="l">Outstanding Receivable</div><div class="v" style="color:var(--forest)">${rec?fmt$(rec):"—"}</div></div>
    <div class="kpi"><div class="l">Outstanding Payable</div><div class="v" style="color:var(--danger)">${pay?fmt$(pay):"—"}</div></div>
    <div class="kpi"><div class="l">Overdue</div><div class="v" style="color:${od.length?"var(--danger)":"var(--muted)"}">${od.length}</div></div>
  </div>
  <div class="card"><div class="h"><span class="t">Payments</span>
    <span style="margin-left:auto;display:inline-flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-sm btn-ghost ce" title="Runs nightly in production: pending payments are matched to completed Wise activity (payee name or remembered payer alias; cross-currency at the ECB rate of the transfer date) and marked paid" onclick="wiseReconcileDemo()">⇄ Reconcile Wise</button>
      <button class="btn btn-sm btn-ghost ce" title="Runs nightly in production: items still pending approval re-book to the restated sync figures — approved/paid amounts never move, and the current month is never booked" onclick="rebookDemo()">⟳ Nightly rebook</button>
      <button class="btn btn-sm btn-ghost ce" onclick="newPaymentModal()">+ New Payment</button></span></div>
  <div style="padding:10px 16px;border-bottom:1px solid rgba(10,79,50,.1);display:flex;gap:8px;flex-wrap:wrap">
    ${["all",...PAY_KINDS].map(kindChip).join("")}
  </div>
  <div class="tbl-wrap"><table>

function newPaymentModal(){
  DR={payee:"",dir:"payable",amount:"",currency:"USD",month:M1,due:"",recurring:false,err:""};

function renderNewPayment(){
  const[kind,payeeId]=DR.payee.split(":");
  const autoDue=()=>{
    if(!payeeId||!/^\d{4}-\d{2}$/.test(DR.month))return "";
    const terms=kind==="partner"?(P(payeeId)?.terms??30):(SV(payeeId)?.terms??0);
    return dueOf(DR.month,terms,kind==="partner");
  };
  const parsed=Number(DR.amount);
  const valid=!!payeeId&&Number.isFinite(parsed)&&parsed>0&&/^\d{4}-\d{2}$/.test(DR.month);
  openModal("New Payment",`
    <div class="frow">
      <div class="fg"><label class="label">Payee *</label>
        <select class="inp" onchange="DR.payee=this.value;DR.err='';renderNewPayment()">
          <option value="">Select partner or service…</option>
          <optgroup label="Partners">${[...partners].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="partner:${x.id}"${DR.payee==="partner:"+x.id?" selected":""}>${esc(x.name)}</option>`).join("")}</optgroup>
          <optgroup label="Services">${[...services].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="service:${x.id}"${DR.payee==="service:"+x.id?" selected":""}>${esc(x.name)}</option>`).join("")}</optgroup>
        </select></div>
      <div class="fg" style="max-width:170px"><label class="label">Direction</label>
        <select class="inp" onchange="DR.dir=this.value">${[["payable","Payable (we pay)"],["receivable","Receivable"]].map(([k,l])=>`<option value="${k}"${DR.dir===k?" selected":""}>${l}</option>`).join("")}</select></div>
    </div>
    <div class="frow">
      <div class="fg"><label class="label">Amount *</label><input class="inp" type="number" step="0.01" value="${esc(DR.amount)}" oninput="DR.amount=this.value"></div>
      <div class="fg" style="max-width:100px"><label class="label">Currency</label><select class="inp" onchange="DR.currency=this.value">${selOpts(settings.currencies,DR.currency)}</select></div>
      <div class="fg" style="max-width:130px"><label class="label">Month *</label><input class="inp" type="month" value="${DR.month}" onchange="DR.month=this.value;renderNewPayment()"></div>
      <div class="fg" style="max-width:160px"><label class="label">Due Date</label><input class="inp" type="date" value="${DR.due||autoDue()}" title="Defaults to month end + the payee's net terms (partner runs roll to the 10th)" onchange="DR.due=this.value"></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:4px">
      <input type="checkbox" ${DR.recurring?"checked":""} onchange="DR.recurring=this.checked" style="accent-color:#0A4F32">Repeats monthly — open a copy of this payment automatically each month</label>
    ${DR.err?`<div style="padding:8px 12px;margin-top:8px;background:#FDF3F2;border:1px solid rgba(192,57,43,.25);border-radius:2px;font-size:12.5px;color:var(--danger)">${esc(DR.err)}</div>`:""}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" ${valid?"":"disabled"} onclick="submitNewPayment()">Create Payment</button>`);
}
function submitNewPayment(){
  const[kind,payeeId]=DR.payee.split(":");
  const parsed=Number(DR.amount);
  if(!(payeeId&&Number.isFinite(parsed)&&parsed>0&&/^\d{4}-\d{2}$/.test(DR.month)))return;
  const id=payId(DR.dir,payeeId,DR.month);
  if(payments.some(x=>x.id===id)){DR.err="A payment for this payee, month and direction already exists.";renderNewPayment();return;}
  const terms=kind==="partner"?(P(payeeId)?.terms??30):(SV(payeeId)?.terms??0);
  payments.push({id,...(kind==="partner"?{pid:payeeId}:{sid:payeeId}),month:DR.month,dir:DR.dir,
    amount:Math.round(parsed*100)/100,bookedAmount:Math.round(parsed*100)/100,currency:DR.currency,
    status:"pending-approval",due:DR.due||dueOf(DR.month,terms,kind==="partner"),recurring:DR.recurring,platforms:kind==="partner"?["Manual"]:undefined});
  closeModal();render();toast("Payment created — pending approval");
}

function auFiltered(){

    if(auBand&&p.band!==auBand)return false;

    if(auSize&&p.size!==auSize)return false;

    if(q&&![p.company,p.domain,p.chain,p.hq,...p.media,...p.contacts.map(c=>c.name)].some(v=>String(v).toLowerCase().includes(q)))return false;

/* Invoice filing: approved (AUTHORISED/PAID) sales invoices become CRM
   documents of type 'invoice' with the PDF, on the matching partner (name or
   remembered payer alias = Xero contact). Idempotent on the Xero invoice id;
   unmatched contacts are tagged needs-partner. Filing an invoice also moves a
   matching approved payment item to invoiced (= pending payment). */
let xeroWebhookLastEvent=dISO(-1);
function xeroSyncInvoices(){
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const results=[];
  for(const inv of xero.invoices){
    if(inv.kind!=="invoice"||!["AUTHORISED","PAID"].includes(inv.status)){continue;}
    const existing=docs.find(d=>d.xeroId===inv.id)||docs.find(d=>d.num===inv.num);
    if(existing){
      if(!existing.xeroId){existing.xeroId=inv.id;existing.file=inv.num+".pdf";if(!existing.tags.includes("xero"))existing.tags.push("xero");results.push(`${inv.num} — linked to the existing document (PDF refreshed)`);}
      else results.push(`${inv.num} — skipped (already filed)`);
      continue;}
    const partner=partners.find(x=>norm(x.name)===norm(inv.contact)||(x.payerNames||[]).some(n=>norm(n)===norm(inv.contact)));
    docs.unshift({id:uid(),num:inv.num,type:"invoice",pid:partner?.id||null,amount:inv.total,issue:inv.date,due:inv.due,terms:30,
      status:inv.status==="PAID"?"paid":"sent",tags:partner?["xero"]:["xero","needs-partner"],xeroId:inv.id,file:inv.num+".pdf"});
    if(partner){
      const pay=payments.find(p=>p.pid===partner.id&&p.dir==="receivable"&&p.status==="approved"&&p.month===inv.date.slice(0,7));
      if(pay){pay.status="invoiced";pay.invoicedAt=todayISO();pay.xeroNum=inv.num;}
    }
    results.push(`${inv.num} — created${partner?"":" · no partner matched (needs-partner)"}`);
  }
  xeroWebhookLastEvent=todayISO();
  render();toast(results.length?`Invoice filing: ${results.join("; ")}`:"Invoice filing: no approved sales invoices to file");
}
function xeroImport(id){
  const inv=xero.invoices.find(i=>i.id===id);
  const p=partners.find(x=>x.name===inv.contact);
  revenueEntries.push({id:uid(),date:inv.date,type:inv.kind==="invoice"?"revenue":"cost",amount:inv.total,currency:"USD",category:"other",
    description:`Xero ${inv.kind} ${inv.num} — ${inv.contact}`,pid:p?.id||null,tags:["xero"]});
  xero.imported[id]=true;render();toast(`Imported ${inv.num} as a ${inv.kind==="invoice"?"revenue":"cost"} entry — see the Revenue page`);
}

/* ============================ quick add ============================ */
let qState="input",qParsed=null,qText="";
function openQuick(){if(!canEdit())return toast("Viewer role is read-only");qState="input";qText="";qParsed=null;$("#quick").style.display="flex";renderQuick();setTimeout(()=>{const t=$("#qtext");if(t)t.focus();},30);}
function closeQuick(){$("#quick").style.display="none";}
function renderQuick(){
  let body="";
  if(qState==="input"){
    body=`<textarea class="inp" id="qtext" rows="3" style="width:100%;resize:none" placeholder='Type anything…&#10;e.g. "call Nexgen Fri re: IO renewal, high priority"' onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitQuick()}">${esc(qText)}</textarea>
    <div style="font-size:11.5px;color:var(--t3);margin:8px 2px 0">Detects task, partner, opportunity, or note automatically. ↵ to parse.</div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-primary" onclick="submitQuick()">Add →</button></div>`;
  }else if(qState==="parsing"){
    body=`<div style="padding:18px 4px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px">
      <span style="color:var(--gold);animation:qpulse 1s infinite">✦</span> Claude is parsing…</div>
    <style>@keyframes qpulse{0%,100%{opacity:.4}50%{opacity:1}}</style>`;
  }else{
    const p=qParsed;
    const rows=[["Detected type",`<span class="badge b-forest">${p.kind}</span>`],
      ["Title",esc(p.kind==="partner"?p.name:p.title)],
      ...(p.kind==="task"?[["Priority",`<span style="font-family:var(--fd);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:${PRI_COLOR[p.priority]}">${p.priority}</span>`],["Due date",p.due?fmtDate(p.due):"—"],["Partner match",p.partner?esc(p.partner.name):"no match"]]:[]),
      ...(p.kind==="opportunity"?[["Value",fmt$(p.value)],["Partner match",p.partner?esc(p.partner.name):"no match — will create unlinked"],["Expected close",p.close?fmtDate(p.close):"—"],["Stage","prospect"]]:[]),
      ...(p.kind==="partner"?[["Status","prospect"],["Type",settings.partnerTypes[0]]]:[]),
      ...(p.kind==="note"?[["Content",esc(p.content)]]:[])];
    body=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">"${esc(qText)}"</div>
    <div class="qprev">${rows.map(([k,v])=>`<div style="display:flex;gap:10px;padding:3px 0;font-size:13px"><span class="label" style="margin:0;min-width:110px;padding-top:2px">${k}</span><span style="flex:1">${v}</span></div>`).join("")}</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn btn-ghost" onclick="qState='input';renderQuick();setTimeout(()=>{const t=document.querySelector('#qtext');if(t)t.focus()},30)">← Edit</button>
      <button class="btn btn-ghost" onclick="closeQuick()">Cancel</button>
      <button class="btn btn-primary" onclick="createQuick()">Create ${qParsed.kind}</button></div>`;
  }
  $("#qboxc").innerHTML=`<div class="qhead"><span>✦ Quick Add</span><button class="btn-icon" onclick="closeQuick()">✕</button></div><div class="qbody">${body}</div>`;
}
function submitQuick(){
  const t=$("#qtext");qText=(t?t.value:qText).trim();
  if(!qText)return;
  qState="parsing";renderQuick();
  setTimeout(()=>{qParsed=parseQuick(qText);qState="preview";renderQuick();},600);
}
function parseQuick(t){
  const lower=t.toLowerCase();
  const partner=partners.find(p=>lower.includes(p.name.split(" ")[0].toLowerCase()))||null;
  const pm=lower.match(/\b(urgent|high|medium|low)\b/);
  const money=t.match(/\$\s?([\d,]+(?:\.\d+)?)\s*(k)?/i);
  let due=null;
  if(/\btoday\b/.test(lower))due=dISO(0);
  else if(/\btomorrow\b/.test(lower))due=dISO(1);
  else{const dm=lower.match(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/);
    if(dm){const map={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};const diff=((map[dm[1]]-new Date().getDay())%7+7)%7||7;due=dISO(diff);}}
  if(/^(new|add)\s+partner\s+/i.test(t)){
    return {kind:"partner",name:t.replace(/^(new|add)\s+partner\s+/i,"").replace(/[,.].*$/,"").trim()||"Unnamed partner"};}
  if(money){
    return {kind:"opportunity",title:t.replace(/\$\s?[\d,]+(?:\.\d+)?\s*k?/i,"").replace(/\s{2,}/g," ").replace(/[,\s]+$/,"").trim()||t,
      value:parseFloat(money[1].replace(/,/g,""))*(money[2]?1000:1),partner,close:due||dISO(30)};}
  if(due||/^(call|email|send|follow|chase|ping|book|prep|review|schedule)/i.test(lower)){
    return {kind:"task",title:t.replace(/,?\s*\b(urgent|high|medium|low)\b(\s*priority)?/i,"").trim(),priority:pm?pm[1]:"medium",due,partner};}
  return {kind:"note",title:t.length>48?t.slice(0,48)+"…":t,content:t};
}
function createQuick(){
  const p=qParsed;
  if(p.kind==="task"){tasks.unshift({id:uid(),title:p.title,status:"todo",pri:p.priority,due:p.due,pid:p.partner?.id||null,oid:null,desc:"Created via QuickAdd",tags:[]});page="tasks";}
  else if(p.kind==="partner"){partners.push({id:uid(),name:p.name,type:settings.partnerTypes[0],cat:settings.partnerCategories[0],status:"prospect",terms:30,website:"",tags:[],access:{},notes:"Created via QuickAdd",contacts:[]});page="partners";}
  else if(p.kind==="opportunity"){opps.push({id:uid(),name:p.title,pid:p.partner?.id||"",stage:"prospect",value:p.value,prob:25,close:p.close,type:settings.opportunityTypes[0],tags:[],notes:"Created via QuickAdd"});page="pipe";}
  else{notes.unshift({id:uid(),title:p.title,content:p.content,type:"general",pinned:false,tags:[],updated:todayISO()});page="notes";}
  closeQuick();render();toast(`Added ${p.kind}: ${p.kind==="partner"?p.name:p.title}`);
}
