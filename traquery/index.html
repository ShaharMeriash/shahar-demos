function refererHost(referer){
  const v = (referer||"").trim(); if (!v) return null;

  const host = refererHost(input);

const fmtDay  = d => { const m=d.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:d; };
const dstrOf  = dt => `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
const PRESETS = [["today","Today"],["yesterday","Yesterday"],["7d","Last 7d"],["30d","Last 30d"],["mtd","This month"],["lastmonth","Last month"]];
function rangeFor(p){
  const t=new Date(), y=t.getFullYear(), m=t.getMonth(), d=t.getDate(), mk=(yy,mm,dd)=>new Date(yy,mm,dd);
  switch(p){
    case "yesterday": { const x=dstrOf(mk(y,m,d-1)); return {from:x,to:x}; }
    case "7d":        return {from:dstrOf(mk(y,m,d-6)),  to:dstrOf(mk(y,m,d))};
    case "30d":       return {from:dstrOf(mk(y,m,d-29)), to:dstrOf(mk(y,m,d))};
    case "mtd":       return {from:dstrOf(mk(y,m,1)),    to:dstrOf(mk(y,m,d))};
    case "lastmonth": return {from:dstrOf(mk(y,m-1,1)),  to:dstrOf(mk(y,m,0))};
    default:          { const x=dstrOf(mk(y,m,d)); return {from:x,to:x}; }
  }
}
function previousRange(from,to){
  const f=new Date(from+"T00:00:00"), t=new Date(to+"T00:00:00");
  const days=Math.round((t-f)/864e5)+1;
  const pt=new Date(f.getTime()-864e5), pf=new Date(pt.getTime()-(days-1)*864e5);
  return {from:dstrOf(pf), to:dstrOf(pt)};
}
function spanDays(r){ return Math.round((new Date(r.to+"T00:00:00")-new Date(r.from+"T00:00:00"))/864e5)+1; }

// ═══════════════ fact generation: hour × product × geo ═══════════════
const DAYS = 30;
let FACTS = [], CLICKS = [], EVENTS = [], REJECTS = [];
const HOURW = [...Array(24)].map((_,h)=> 0.35 + 0.65*Math.exp(-Math.pow(((h+24-19)%24>12?24-((h+24-19)%24):(h+24-19)%24),2)/40));
const HOURSUM = HOURW.reduce((a,b)=>a+b,0);
function geoRev(off,g){ const r=(off.revenues||[]).find(x=>x.country===g); return r?r.revenue:(off.default_revenue||50); }
function geoPay(pr,g){ const p=(pr.payouts||[]).find(x=>x.country===g); return p?p.payout:defPayout(geoRev(offerById(pr.offer_id),g)); }
function genFacts(){
  FACTS = [];
  const now = new Date();
  for (let back=0; back<DAYS; back++){
    const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-back);
    const day=dstrOf(dt), wknd=[0,6].includes(dt.getDay())?1.25:1;
    for (const pr of DB.products){
      const off=offerById(pr.offer_id); if(!off) continue;
      const offW = {11:1.7,12:1.1,21:0.55,22:1.3,23:0.6}[off.id]||1;
      const isRS = off.payout_model==="revshare";
      for (const g of GEOS){
        const geoW = g==="US"?1.6:g==="UK"?1.15:1;
        const daily = (18+rnd()*70) * offW * geoW * wknd;
        const cr = {11:0.024,12:0.018,21:0.009,22:0.028,23:0.02}[off.id]||0.02;
        for (let h=0; h<24; h++){
          const clicks = Math.round(daily*HOURW[h]/HOURSUM*(0.7+rnd()*0.6));
          if (!clicks) continue;
          const exp_ = clicks*cr*(0.7+rnd()*0.6);
          const conv = Math.floor(exp_) + (rnd() < exp_%1 ? 1 : 0);
          // Revshare: the advertiser values each conversion individually and
          // sends the amount; payout = revenue × share, rounded to the cent.
          const revenue = conv * (isRS ? 45*(0.6+rnd()*0.9) : geoRev(off,g)*(0.92+rnd()*0.16));
          const payout  = isRS ? Math.round(revenue*(pr.revshare_pct||0))/100 : conv * geoPay(pr,g);
          FACTS.push({day, hour:h, prod:pr.id, off:off.id, pub:pr.publisher_id, geo:g, clicks, conv, revenue, payout});
        }
      }
    }
  }
}

function fM(v,kind){
  if (kind==="money") return "$"+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  if (kind==="pct")   return v.toFixed(1)+"%";

let hAdvF="", hPubF="";   // hierarchy filter bar — scopes every dashboard number
function factsIn(r){
  const o2a=new Map();
  for(const a of DB.advertisers) for(const o of a.offers) o2a.set(o.id,a.id);
  return FACTS.filter(f=> f.day>=r.from && f.day<=r.to

function totalsOf(rows){
  const t = {clicks:0,conversions:0,revenue:0,payout:0};
  for (const f of rows){ t.clicks+=f.clicks; t.conversions+=f.conv; t.revenue+=f.revenue; t.payout+=f.payout; }
  return derive(t);
}
function derive(t){
  t.margin = t.revenue-t.payout;
  t.cr  = t.clicks ? t.conversions/t.clicks*100 : 0;
  t.epc = t.clicks ? t.revenue/t.clicks : 0;
  return t;

function dimLabelOf(f,d){
  switch(d){
    case "offer":      return offerById(f.off)?.name ?? ("offer #"+f.off);
    case "hour":       return pad2(f.hour)+":00";
    case "publisher":  return pubById(f.pub)?.name ?? ("pub #"+f.pub);
    case "advertiser": return maskAdv(advOfOffer(f.off)?.name ?? "—");
    case "country":    return f.geo;
    case "event":      return offerById(f.off)?.event_name ?? "—";
    case "day":        return f.day;
  }
}
// ">100", "<5", "=10", ">=2.5" — bare number means equals (2-dp so money behaves)
function matchesNumeric(v,expr){
  const m = expr.trim().match(/^(>=|<=|>|<|=)?\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return true;
  const n = parseFloat(m[2]);
  switch(m[1]||"="){
    case ">": return v>n; case "<": return v<n; case ">=": return v>=n; case "<=": return v<=n;
    default:  return Math.round(v*100)===Math.round(n*100);
  }
}
function csvDownload(name, head, rows){
  const cell = v => { const s = v==null?"":String(v); const safe = /^[=+\-@]/.test(s)?"'"+s:s; return '"'+safe.replace(/"/g,'""')+'"'; };
  const lines = [head.map(cell).join(",")];
  for (const r of rows) lines.push(r.map(cell).join(","));
  const blob = new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

    : matchesNumeric(r[c],ex)));
  rows.sort((a,b)=>{
    const av=sortKey==="label"?a.labels.join(" "):a[sortKey], bv=sortKey==="label"?b.labels.join(" "):b[sortKey];
    const c=typeof av==="string"?av.localeCompare(bv):av-bv;
    return sortAsc?c:-c;
  });
  const truncated=rows.length>1000; if(truncated) rows=rows.slice(0,1000);
  const tot=derive(rows.reduce((a,r)=>({clicks:a.clicks+r.clicks,conversions:a.conversions+r.conversions,revenue:a.revenue+r.revenue,payout:a.payout+r.payout}),{clicks:0,conversions:0,revenue:0,payout:0}));
  return {mets,rows,tot,truncated,anyF};
}
function computeChart(){
  const ok=spanDays(range)<=7, g=ok?grain:"day";
  const rows=factsIn(range);
  const keyF = g==="hour" ? f=>f.day+" "+pad2(f.hour)+":00" : f=>f.day;
  const sName = f => split==="none" ? "current" : dimLabelOf(f,split);
  const map=new Map();
  for(const f of rows){
    const k=keyF(f); let e=map.get(k); if(!e){ e=new Map(); map.set(k,e); }
    const s=sName(f); let t=e.get(s); if(!t){ t={clicks:0,conversions:0,revenue:0,payout:0}; e.set(s,t); }
    t.clicks+=f.clicks; t.conversions+=f.conv; t.revenue+=f.revenue; t.payout+=f.payout;
  }
  const keys=[...map.keys()].sort();
  const splitNames = split==="none" ? ["current"] : [...new Set(rows.map(sName))].sort().slice(0,8);
  const data=keys.map(k=>({key:k, vals:splitNames.map(s=>{ const t=map.get(k).get(s); return t?derive({...t})[metric]:0; })}));
  let prevVals=null;
  if(compare && split==="none"){
    const pr=previousRange(range.from,range.to), pmap=new Map();
    for(const f of factsIn(pr)){
      const k=keyF(f); let t=pmap.get(k); if(!t){ t={clicks:0,conversions:0,revenue:0,payout:0}; pmap.set(k,t); }
      t.clicks+=f.clicks; t.conversions+=f.conv; t.revenue+=f.revenue; t.payout+=f.payout;
    }
    const pkeys=[...pmap.keys()].sort();
    prevVals=keys.map((_,i)=>{ const t=pmap.get(pkeys[i]); return t?derive({...t})[metric]:0; });
  }
  return {g,ok,keys,splitNames,data,prevVals};
}
function fmtAxis(v,kind){
  if(kind==="pct") return v.toFixed(0)+"%";
  const num = v>=1000 ? (v/1000).toFixed(v<10000?1:0)+"k" : String(Math.round(v));
  return kind==="money" ? "$"+num : num;
}
function xLabel(key,g){
  if(g==="hour") return range.from===range.to ? key.slice(11,16) : key.slice(8,10)+"/"+key.slice(5,7)+" "+key.slice(11,16);
  return key.slice(8,10)+"/"+key.slice(5,7);
}
function chartSvg(ch){
  const kind=METRICS.find(m=>m[0]===metric)[2];
  if(!ch.data.length) return '<div style="height:200px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px">No data in this range</div>';
  const W=980,H=240,PL=48,PR=10,PT=8,PB=26;
  const totals=ch.data.map(d=>d.vals.reduce((a,b)=>a+b,0));
  const max=Math.max(...totals,...(ch.prevVals||[0]),1e-9)*1.08;
  const n=ch.data.length;
  const x=i=>PL+(W-PL-PR)*(i+0.5)/n, y=v=>H-PB-(H-PT-PB)*v/max;
  const bw=Math.min(38,(W-PL-PR)/n*0.6);
  let bars="";
  ch.data.forEach((d,i)=>{ let acc=0;
    d.vals.forEach((v,si)=>{ if(v<=0) return;
      const y1=y(acc+v), y0=y(acc);
      bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(.5,y0-y1).toFixed(1)}" fill="${ch.splitNames.length>1?COLORS[si%8]:"#4FB584"}"/>`;
      acc+=v; });
  });
  const prev = ch.prevVals ? `<path d="${ch.prevVals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("")}" fill="none" stroke="#C9A34E" stroke-width="2" stroke-dasharray="6 4"/>` : "";
  const grid=[0,.25,.5,.75,1].map(pp=>`<line x1="${PL}" x2="${W-PR}" y1="${y(max*pp).toFixed(1)}" y2="${y(max*pp).toFixed(1)}" stroke="#27402F"/><text x="${PL-6}" y="${(y(max*pp)+4).toFixed(1)}" text-anchor="end">${fmtAxis(max*pp,kind)}</text>`).join("");
  const step=Math.ceil(n/10);
  const labels=ch.data.map((d,i)=> i%step ? "" : `<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${xLabel(d.key,ch.g)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="min-width:640px;width:100%">${grid}${bars}${prev}${labels}</svg>`;
}

function evVal(ev,k){
  switch(k){
    case "t": return ev.t;

    case "offer": return ev.offName;

    case "source": return ev.pubName;

function eventsShown(){
  let rows=EVENTS.filter(e=>{ const d=evDayOf(e); return d>=evRange.from && d<=evRange.to; });
  const f=evFilter.trim().toLowerCase();
  if(f) rows=rows.filter(e=>(e.event||"").toLowerCase().includes(f));
  const active=Object.entries(evColFilters).filter(([,v])=>v&&v.trim());
  if(active.length) rows=rows.filter(e=>active.every(([k,v])=>{
    const raw=evVal(e,k); if(raw==null) return false;
    const s=k==="t"?fmtDTs(raw):String(raw);
    return s.toLowerCase().includes(v.trim().toLowerCase());
  }));
  if(evSortK){
    rows=[...rows].sort((a,b)=>{
      const av=evVal(a,evSortK), bv=evVal(b,evSortK);
      if(av==null&&bv==null) return 0; if(av==null) return 1; if(bv==null) return -1;
      const c=typeof av==="number"&&typeof bv==="number"?av-bv:String(av).localeCompare(String(bv));
      return evSortAsc?c:-c;
    });
  }
  return rows;
}

  toast(`✓ Re-fired — delivered on attempt ${ev.out_attempts}, rebuilt from the publisher's current postback URL`);
  render();
}
function pbTrace(ev){
  const p=P();
  if(p.type!=="internal") return "";
  const cap = u => u ? `<span style="font-family:var(--mono);font-size:11px;color:var(--t2);word-break:break-all">${esc(u)}</span>`
    : `<span style="color:var(--t3)">not captured — this event predates the raw-postback log</span>`;
  const st = ev.out_sent ? `<span class="pos">delivered</span>`
    : ev.out_attempts ? `<span class="neg">failed after ${ev.out_attempts} attempt(s)</span>`
    : ev.is_test ? `<span style="color:var(--t3)">not sent — test conversion</span>`
    : `<span style="color:var(--t3)">not sent</span>`;
  return `
  <div style="margin-top:10px">
    <b>Raw postbacks${tipMark("Postback trace","Both legs of the conversion, stored verbatim at the moment they happened — deliberately never reconstructed from the publisher's current postback template, which gets corrected over time and would show today's URL for yesterday's call.")}</b>
    <div style="background:var(--card);border-radius:2px;padding:6px 10px;margin-top:4px">
      <div style="font-size:11px;color:var(--t3)">← inbound · from the advertiser <span style="color:var(--t3)">(key masked)</span></div>
      ${cap(ev.raw_in)}
    </div>
    ${ev.raw_in2?`<div style="background:var(--card);border-radius:2px;padding:6px 10px;margin-top:4px">
      <div style="font-size:11px;color:#E0B968">← inbound · duplicate — dropped, logged verbatim</div>
      ${cap(ev.raw_in2)}
    </div>`:""}
    <div style="background:var(--card);border-radius:2px;padding:6px 10px;margin-top:4px">
      <div style="font-size:11px;color:var(--t3)">→ outbound · to the publisher · ${st}</div>
      ${cap(ev.raw_out)}
      ${ev.out_resp?`<div style="font-size:11px;font-family:var(--mono);color:var(--t3)">answered: ${esc(ev.out_resp)}</div>`:""}
    </div>
    ${p.admin&&!viewAs&&ev.click_id?`<div style="margin-top:6px">
      ${refireArm===ev.id?`
        <div style="font-size:11px;color:#E0B968;margin-bottom:4px">Sends the publisher another conversion, rebuilt from their current postback URL. It does not replace the one they already have — expect either a duplicate or a rejection, and tell them either way.</div>
        <button class="abtn confirm" onclick="event.stopPropagation();refire('${ev.id}')">Send it</button>
        <button class="abtn" onclick="event.stopPropagation();refireArm=null;render()">Cancel</button>`
      :`<button class="abtn" ${tipAttr("Re-fire publisher postback","Admin-only. Some conversions reach the partner in the wrong shape — an empty sum, a stale template. This sends the conversion again through the normal delivery path, rebuilt from the publisher's CURRENT template, and records it like any other send.")} onclick="event.stopPropagation();refireArm='${ev.id}';render()">Re-fire this postback</button>`}
    </div>`:""}
  </div>`;
}
function markTest(id){
  const ev=EVENTS.find(e=>e.id===id); if(!ev) return;
  ev.is_test=!ev.is_test;
  toast(ev.is_test?"✓ Marked as TEST — excluded from dashboard and P&L figures":"✓ Counted again in dashboard and P&L figures");
  render();
}
function fireTest(){
  const pr=DB.products.find(p=>p.id===testProd)||DB.products[0]; if(!pr){ toast("No products — add one in Hierarchy"); return; }
  const off=offerById(pr.offer_id), pub=pubById(pr.publisher_id), adv=advOfOffer(pr.offer_id);
  const id="c"+hex(15), g="US";
  const isRS=off.payout_model==="revshare";
  const rev=isRS?45:geoRev(off,g), pay=isRS?Math.round(rev*(pr.revshare_pct||0))/100:geoPay(pr,g);
  EVENTS.unshift({ id:"e"+hex(12), t:Date.now(), event:off.event_name||"conv", offName:off.name, advName:adv.name, pubName:pub.name,
    geo:g, click_id:id, gclid:null, sub_id:"test-"+hex(4), sub3:"test-site", sub4:null, sub5:null, sub6:null, sub7:null,
    revenue:rev, payout:pay, referrer:null, google:false, is_test:true,
    raw_in:`https://api.traquery.tech/postback?click_id=${id}&key=•••&event=${off.event_name||"conv"}`, raw_in2:null,
    raw_out:null, out_resp:null, out_sent:false, out_attempts:0 });
  TESTLOG.unshift({ ts:Date.now(), label:`${off.name} @ ${pub.name}`, clickId:id, ok:true, detail:"200 ok — stored (TEST)", ms:Math.round(60+Math.random()*180) });
  toast("⚡ Test conversion fired — flagged TEST, excluded from dashboard & P&L figures");
  render();
}
function evCell(ev,k){
  switch(k){
    case "t": return `<span style="font-family:var(--mono);font-size:11px;color:var(--t2);white-space:nowrap" title="${new Date(ev.t).toISOString()}">${fmtDT(ev.t)}</span>`;
    case "event": return `<span class="badge ok">${esc(ev.event)}</span>${ev.is_test?' <span class="badge amber" title="Excluded from dashboard and P&L figures">TEST</span>':""}`;
    case "offer": return `<span title="${esc(maskAdv(ev.advName))}">${esc(ev.offName)}</span>`;
    case "country": return `<span style="font-family:var(--mono);font-size:11px">${ev.geo}</span>`;
    case "source": return `<span style="color:var(--forest-l)">${esc(ev.pubName)}</span>`;
    case "click_id": return ev.click_id?`<span class="urlchip" title="${esc(ev.click_id)} — click to copy" onclick="event.stopPropagation();copyText('${ev.click_id}')">${ev.click_id.slice(0,14)}…</span>`:"—";
    case "gclid": return ev.gclid?`<span class="urlchip" title="click to copy" onclick="event.stopPropagation();copyText('${ev.gclid}')">${ev.gclid.slice(0,14)}…</span>`:"—";
    case "revenue": return ev.revenue!=null?`<span class="num" style="font-family:var(--mono);font-size:11.5px">$${ev.revenue.toFixed(2)}</span>`:"—";
    case "payout": return ev.payout!=null?`<span class="gold" style="font-family:var(--mono);font-size:11.5px">$${ev.payout.toFixed(2)}</span>`:"—";
    case "referrer": { if(!ev.referrer) return "—"; let h=ev.referrer; try{ h=new URL(ev.referrer).host||h; }catch(e){} return `<span title="${esc(ev.referrer)}">${esc(h)}</span>`; }

    default: { const v=ev[k]; return v?`<span style="font-family:var(--mono);font-size:11px">${esc(v)}</span>`:"—"; }
  }
}

// ═══════════════ clicks ═══════════════
function setCkPreset(p){ ckPreset=p; if(p!=="custom") ckRange=rangeFor(p); render(); }
// Typing a date IS choosing a custom range: leaving the preset lit while the
// dates disagree with it is the kind of small lie that costs an hour later.
function setCkFrom(v){ if(v){ ckPreset="custom"; ckRange={...ckRange,from:v}; render(); } }
function setCkTo(v){   if(v){ ckPreset="custom"; ckRange={...ckRange,to:v};   render(); } }
function clicksShown(){
  const r=ckRange;
  let rows=CLICKS.filter(c=>{ const d=dstrOf(new Date(c.t)); return d>=r.from&&d<=r.to; });
  if(ckConvOnly) rows=rows.filter(c=>c.conv);
  // "Screened only" overrides the bot exclusion — you asked to see them.
  if(!ckBots && ckIvt!=="1") rows=rows.filter(c=>!c.bot);
  if(ckIvt==="1") rows=rows.filter(c=>c.ivt_reason);
  else if(ckIvt==="0") rows=rows.filter(c=>!c.ivt_reason);
  if(ckIncent==="1") rows=rows.filter(c=>incentDomainOf(c));
  else if(ckIncent==="0") rows=rows.filter(c=>!incentDomainOf(c));
  const s=ckSearch.trim().toLowerCase();
  if(s) rows=rows.filter(c=>[c.id,c.geo,c.ip,c.sub_id,c.gclid,c.offName,c.pubName,c.redirect_url,c.request_url,c.event].some(v=>(v??"").toString().toLowerCase().includes(s)));
  return rows;
}
function ivtBadge(c){
  if(!c.ivt_reason) return `<span style="color:var(--t3);font-size:10px">—</span>`;
  const copy=IVT_COPY[c.ivt_reason]||{label:c.ivt_reason,why:""};
  const blocked=c.ivt_severity==="block";
  return `<span class="badge ${blocked?"no":"amber"}" ${tipAttr("IVT screen — "+copy.label, copy.why+" "+(blocked?IVT_BLOCK_NOTE:IVT_FLAG_NOTE))}>${blocked?"⛔":"⚑"} ${copy.label}</span>`;
}
function incentBadge(c){
  const d=incentDomainOf(c);
  if(!d) return `<span style="color:var(--t3);font-size:10px">—</span>`;
  return `<span class="badge purple" ${tipAttr("Incent pool — "+d, "Referrer matched "+d+" in the incent pool. "+INCENT_NOTE)}>⛃ incent</span>`;
}

function parseGeoAmounts(text){
  const out=[]; const re=/([A-Za-z]{2})\s*[:\s]\s*\$?(\d+(?:\.\d+)?)/g; let m;
  while((m=re.exec(text))!==null) out.push({country:m[1].toUpperCase(), amount:parseFloat(m[2])});
  return out;
}
function advPostbackUrl(a){ return `https://api.traquery.tech/postback?click_id={click_id}&key=${a.postback_key}&event={event}&payout={payout}`; }
function clickUrlFor(pr){
  const pub=pubById(pr.publisher_id);
  const keys=pub&&pub.param_map?Object.keys(pub.param_map):[];
  const qs=(keys.length?keys:["sub_id"]).map(k=>`${k}={${k}}`).join("&");
  return `https://${pub?pub.click_host:"pathlane.net"}/click?product=${pr.id}&${qs}`;
}

  DB.advertisers.push({id,name,postback_key:"nk_"+hex(8),param_map:{},offers:[]});

}
function renameAdvertiser(id){

}
function delAdvertiser(id){

function addOffer(advId){

  addOfferFor=null; editOffer=id; toast("✓ Offer created — set its paid event and revenue"); render();
}
function saveOffer(id){
  const o=offerById(id); if(!o) return;
  const g=id2=>document.getElementById(id2);
  o.name=(g("eo-name").value||o.name).trim()||o.name;
  o.event_name=g("eo-event").value||null;
  o.payout_model=g("eo-model").value==="revshare"?"revshare":"geo";
  const rev=g("eo-rev").value; o.default_revenue=rev!==""?parseFloat(rev):null;
  o.offer_url=g("eo-url").value.trim()||null;

function saveShare(prId){
  const pr=DB.products.find(p=>p.id===prId); if(!pr) return;

  pr.revshare_pct=n;

  render();

function addProduct(){
  if(!npOffer||!npPub){ toast("Pick an offer and a publisher first"); return; }
  const off=+npOffer, pub=+npPub;
  if(DB.products.some(p=>p.offer_id===off&&p.publisher_id===pub)){ toast("That offer already runs on this publisher"); return; }
  const id=Math.max(40,...DB.products.map(p=>p.id))+1;
  const o=offerById(off);
  if(o.payout_model==="revshare"){
    // No rate card to seed from — start on the standard 80% split so the two
    // pricing models default to the same economics.
    DB.products.push({id,offer_id:off,publisher_id:pub,payouts:[],revshare_pct:80});
    npOffer=""; npPub="";
    toast(`✓ Product #${id} created — revshare, publisher share starts on the standard 80% split`); render(); return;
  }
  DB.products.push({id,offer_id:off,publisher_id:pub,payouts:(o.revenues||[]).map(r=>({country:r.country,payout:defPayout(r.revenue)}))});
  npOffer=""; npPub="";
  toast(`✓ Product #${id} created — payouts defaulted to 20% margin, rounded down`); render();
}
function savePayouts(prId){
  const pr=DB.products.find(p=>p.id===prId); if(!pr) return;
  const o=offerById(pr.offer_id);
  const countries=[...new Set([...(o?.revenues||[]).map(r=>r.country),...pr.payouts.map(p=>p.country)])];
  const out=[];
  for(const c of countries){
    const el=document.getElementById(`po-${prId}-${c}`); if(!el) continue;
    const n=parseFloat(el.value);
    if(el.value!==""&&Number.isFinite(n)) out.push({country:c,payout:n});
  }
  pr.payouts=out; toast("✓ Payouts saved"); render();
}

        <span class="urlchip" ${tipAttr("Click-domain pool","Click links are minted on a burnable browser-facing domain pool, kept separate from the S2S/API domain. Burning a domain auto-promotes the oldest matching standby, and every newly copied link uses it immediately — links already placed must be re-placed on the publisher's side.")} onclick="copyText('${p.click_host}')">${p.click_host}</span>
        <input id="pu-${p.id}" class="inp mono" style="flex:1;min-width:220px" value="${esc(p.postback_url||"")}" placeholder="s2s URL — {click_id} {sub_id} {payout} {event} {country}">
        <button class="abtn" onclick="savePub(${p.id})">Save</button>

        <div style="font-size:11px;color:var(--t3);margin-top:6px">click URL → …/click?product=&lt;ID&gt;&amp;${Object.entries(p.param_map||{}).map(([k,v])=>`${k}=${v}`).join("&")||"sub_id={sub_id}"}</div>

  const prodRows=DB.products.map(pr=>{
    const o=offerById(pr.offer_id), pb=pubById(pr.publisher_id);
    const open=!!prodOpen[pr.id];
    const url=clickUrlFor(pr);
    const revBy=new Map((o?.revenues||[]).map(r=>[r.country,r.revenue]));
    const countries=[...new Set([...(o?.revenues||[]).map(r=>r.country),...pr.payouts.map(p=>p.country)])].sort();
    const payBy=new Map(pr.payouts.map(p=>[p.country,p.payout]));
    return `<div class="hrow">
      <div class="hr-head">
        <span class="pid" title="Product ID — use in the click link">#${pr.id}</span>
        <span><span style="color:#E0B968">${esc(o?o.name:"offer #"+pr.offer_id)}</span><span style="color:var(--t3)"> @ </span><span style="color:#B48AD6">${esc(pb?pb.name:"pub #"+pr.publisher_id)}</span></span>
        ${o&&o.payout_model==="revshare"
          ? `<span class="badge purple" ${tipAttr("Publisher share",`Payout on this product is revenue × ${pr.revshare_pct!=null?pr.revshare_pct:"—"}%, rounded to the nearest cent — a stated share is a term of the deal and the publisher is owed the arithmetic. New revshare products start on the standard 80% split.`)}>share ${pr.revshare_pct!=null?pr.revshare_pct+"%":"—"}</span>`
          : `<span class="badge ok" style="font-family:var(--mono)">payout ×${pr.payouts.length}</span>`}
        <span style="flex:1"></span>
        <span class="urlchip" title="${esc(url)} — click to copy" onclick="copyText('${url.replace(/'/g,"")}','✓ Click URL copied — this is what the publisher places')">click URL</span>
        <button class="abtn" onclick="prodOpen[${pr.id}]=!prodOpen[${pr.id}];render()">${open?"Hide payouts":o&&o.payout_model==="revshare"?"Share":"Payouts"}</button>
        <button class="abtn danger" onclick="delProduct(${pr.id})">Delete</button>
      </div>
      ${open?(o&&o.payout_model==="revshare"?`<div class="hr-body">
        <div style="display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap">
          <span><span class="gh" style="display:block;margin-bottom:3px;font-family:var(--fd);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--t3)">Publisher share</span>
            <span style="display:inline-flex;align-items:center;gap:4px">
              <input id="rs-${pr.id}" class="inp mono" type="number" step="0.01" min="0" max="100" style="width:90px;color:var(--forest)" value="${pr.revshare_pct!=null?pr.revshare_pct:""}" placeholder="80">
              <span style="font-size:12px;color:var(--t3)">%</span>
            </span></span>
          <button class="abtn confirm" onclick="saveShare(${pr.id})">Save share</button>

        <div style="font-size:11px;color:var(--t3);margin-top:6px">${pr.revshare_pct!=null

      </div>`:`<div class="hr-body">
        <div class="geo-grid">
          <span class="gh">Geo</span><span class="gh">Revenue (advertiser)</span><span class="gh">Payout (publisher)</span>
          ${countries.map(c=>`
            <span style="font-family:var(--mono);font-size:12px">${c}</span>
            <span style="font-family:var(--mono);font-size:12px;color:var(--t3)">${revBy.has(c)?"$"+revBy.get(c):"—"}</span>
            <input id="po-${pr.id}-${c}" class="inp mono" type="number" step="0.01" style="width:96px;color:var(--forest)" value="${payBy.has(c)?payBy.get(c):""}" placeholder="—">`).join("")}
        </div>
        ${countries.length?"":`<span style="font-size:11px;color:var(--t3)">No geo rows — add revenue countries on the offer first.</span>`}
        <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="abtn confirm" onclick="savePayouts(${pr.id})">Save payouts</button></div>
      </div>`):""}
    </div>`;
  }).join("");

  const allOffers=DB.advertisers.flatMap(a=>a.offers.map(o=>({...o,advName:a.name})));
  const evRows=DB.event_names.map(ev=>`
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input id="en-name-${ev.id}" class="inp" style="width:200px" value="${esc(ev.name)}">
      <input id="en-param-${ev.id}" class="inp mono" style="width:110px;color:var(--forest)" value="${esc(ev.param)}">
      <button class="abtn" onclick="copyText('${ev.param}','✓ param copied')" title="copy param">copy</button>
      <button class="abtn" onclick="saveEvName(${ev.id})">Save</button>
      <button class="abtn danger" onclick="delEvName(${ev.id})">Delete</button>

  return `
  <div class="sect"><div class="sh"><span class="st">Advertisers</span><span class="ss">demand — each has one global postback URL and its offers</span></div>
    <div class="sb">

// ═══════════════ admin drawer ═══════════════
const MONEY_HINT={ advertiser:"sees revenue only — the demand side of the network",
  publisher:"sees payout only — the supply side of the network",
  internal:"sees revenue and payout — both ends of the network" };
function updUser(uid,patch){
  const u=USERS.find(x=>x.uid===uid); if(!u) return;
  Object.assign(u,patch);
  if(patch.type){ // type sets the money defaults, still toggleable after
    u.see_rev = patch.type!=="publisher";
    u.see_pay = patch.type!=="advertiser";
  }
  render();
}
function addIncent(){
  const d=document.getElementById("inc-domain"), n=document.getElementById("inc-note");
  const dom=normaliseDomain((d&&d.value)||"");
  if(!dom){ toast("Enter a domain — a full URL works too"); return; }
  if(INCENT_POOL.some(e=>e.domain===dom)){ toast("Already pooled"); return; }
  INCENT_POOL.push({domain:dom, note:((n&&n.value)||"").trim()});
  toast("✓ "+dom+" pooled — every click that ever came from it now flags, past and future");
  render();
}
function rmIncent(dom){ INCENT_POOL=INCENT_POOL.filter(e=>e.domain!==dom); toast("✓ Removed from the pool"); render(); }
function delUser(uid){
  const u=USERS.find(x=>x.uid===uid); if(!u) return;
  if(!confirm(`Delete ${u.email}?\n\nThis removes the account and its grants. It does not ban the address — signing in again re-creates it as pending with no permissions.`)) return;
  USERS=USERS.filter(x=>x.uid!==uid);
  if(viewAs===uid) viewAs=null;
  render();
}
function viewAsUser(uid){
  viewAs=uid; adminOpen=false; openClick=null; expandedEv=null;
  hAdvF=""; hPubF="";   // the filter bar re-scopes to what this account may see
  sanitizeScope();
  toast("Viewing as "+(USERS.find(u=>u.uid===uid)||{}).email+" — the whole app is now scoped to that account");
  render();
}
function exitViewAs(){ viewAs=null; hAdvF=""; hPubF=""; sanitizeScope(); render(); }
function saveInvite(){
  const email=inv.email.trim();
  if(!email.includes("@")){ toast("Enter a valid email first"); return; }
  INVITES.push({email, type:inv.type, can_edit:inv.can_edit, can_test:inv.can_test, see_rev:inv.see_rev, see_pay:inv.see_pay, sent:false});
  composerOpen=false; inv={email:"",type:"internal",can_edit:false,can_test:false,see_rev:true,see_pay:true};
  toast("✓ Draft saved — Send it from the list when you are happy with it");
  render();
}
function sendInvite(email){
  const i=INVITES.find(x=>x.email===email); if(!i) return;
  i.sent=true; toast("✓ Invite email sent — in production the address gets a sign-in link"); render();
}
function rmInvite(email){ INVITES=INVITES.filter(x=>x.email!==email); render(); }
function setInvType(t){
  inv.type=t; inv.see_rev=t!=="publisher"; inv.see_pay=t!=="advertiser"; render();
}
function chip(active,label,handler,title){
  return `<span class="chip ${active?"on":""}" ${title?`title="${esc(title)}"`:""} onclick="${handler}">${label}</span>`;
}
function drawerHtml(){
  if(!adminOpen) return "";
  const userRows=USERS.map(u=>{
    const open=openUid===u.uid, isAdm=u.role==="admin", granted=u.access==="granted";
    return `<div class="hrow">
      <div class="hr-head" style="cursor:pointer" onclick="openUid=openUid==='${u.uid}'?null:'${u.uid}';render()">
        <span style="color:var(--t3);font-size:11px;width:12px">${open?"▼":"▶"}</span>
        <span style="flex:1;min-width:160px;overflow:hidden;text-overflow:ellipsis">${esc(u.email)}</span>
        <span class="badge ${granted?"ok":u.access==="pending"?"amber":"no"}">${u.access}</span>
        ${isAdm?`<span class="badge ok">admin</span>`:""}
        ${!isAdm&&granted?`<span style="font-size:10.5px;color:var(--t3);font-family:var(--mono)">${u.type} · ${u.can_edit?"edit":"view only"}${u.can_test?" · test":""} · ${[u.see_rev&&"rev",u.see_pay&&"pay"].filter(Boolean).join("+")||"no money"}</span>`:""}
        <span style="display:flex;gap:4px" onclick="event.stopPropagation()">
          ${!isAdm&&granted?`<button class="abtn confirm" onclick="viewAsUser('${u.uid}')">View as</button>`:""}
          <button class="abtn" onclick="openUid=openUid==='${u.uid}'?null:'${u.uid}';render()">${open?"Close":"Edit"}</button>
          ${granted?`<button class="abtn danger" onclick="updUser('${u.uid}',{access:'pending'})">Revoke</button>`
                   :`<button class="abtn confirm" onclick="updUser('${u.uid}',{access:'granted'})">Grant</button>`}
          ${!isAdm?`<button class="abtn danger" onclick="delUser('${u.uid}')">Delete</button>`:""}
        </span>
      </div>
      ${open?`<div class="hr-body" style="display:flex;flex-direction:column;gap:9px">
        <div class="controls" style="margin:0"><span class="slab">Access</span>
          ${["granted","pending","denied"].map(a=>chip(u.access===a,a,`updUser('${u.uid}',{access:'${a}'})`,
            a==="granted"?"can sign in":a==="pending"?"sees the awaiting-approval screen":"blocked — signing in again will not restore it")).join("")}
        </div>
        <div class="controls" style="margin:0"><span class="slab">Role</span>
          ${["member","admin"].map(r=>chip(u.role===r,r,`updUser('${u.uid}',{role:'${r}'})`)).join("")}
          <span style="font-size:11px;color:var(--t3)">admin can manage users and always sees everything</span>
        </div>
        ${!isAdm?`
        <div class="controls" style="margin:0"><span class="slab">Type</span>
          ${["advertiser","publisher","internal"].map(t=>chip(u.type===t,t,`updUser('${u.uid}',{type:'${t}'})`,MONEY_HINT[t])).join("")}
          <span style="font-size:11px;color:var(--t3)">${MONEY_HINT[u.type]}</span>
        </div>
        <div class="controls" style="margin:0"><span class="slab">Can</span>
          ${chip(u.can_edit,(u.can_edit?"✓ ":"")+"Edit",`updUser('${u.uid}',{can_edit:${!u.can_edit}})`,"full access including the Hierarchy tab — create and change advertisers, publishers, offers, products")}
          ${chip(u.can_test,(u.can_test?"✓ ":"")+"Test conversions",`updUser('${u.uid}',{can_test:${!u.can_test}})`,"fire test conversions — exposes advertiser postback keys")}
        </div>
        <div class="controls" style="margin:0"><span class="slab">Sees</span>
          ${chip(u.see_rev,(u.see_rev?"✓ ":"")+"Revenue",`updUser('${u.uid}',{see_rev:${!u.see_rev}})`,"what the advertiser pays — hidden from the KPIs, chart, tables and CSV when off")}
          ${chip(u.see_pay,(u.see_pay?"✓ ":"")+"Payout",`updUser('${u.uid}',{see_pay:${!u.see_pay}})`,"what the publisher earns — hidden everywhere when off")}
          <span style="font-size:11px;color:var(--t3)">redacted server-side in production — not just hidden</span>
        </div>`:""}
      </div>`:""}
    </div>`;
  }).join("");

  const inviteRows=INVITES.length?`
    <div style="padding-top:6px">
      <div style="font-size:11px;color:var(--t3);margin-bottom:4px">Pending invites</div>
      ${INVITES.map(i=>`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 6px">
        <span style="flex:1;min-width:150px;font-family:var(--mono);font-size:11.5px;color:var(--t2)">${esc(i.email)}</span>
        <span style="font-size:10.5px;color:var(--t3)">${i.type}${i.can_edit?" · edit":" · view only"}${i.can_test?" · test":""} · ${[i.see_rev&&"rev",i.see_pay&&"pay"].filter(Boolean).join("+")||"no money"}</span>
        <span class="badge ${i.sent?"ok":"amber"}">${i.sent?"sent":"draft"}</span>
        <button class="abtn ${i.sent?"":"confirm"}" onclick="sendInvite('${i.email}')">${i.sent?"Resend":"Send"}</button>
        <button class="abtn" onclick="rmInvite('${i.email}')">Remove</button>
      </div>`).join("")}
    </div>`:"";

  const composer=`
    <div style="border:1px solid rgba(79,181,132,.3);border-radius:2px;margin-top:10px;overflow:hidden">
      <button style="width:100%;text-align:left;background:rgba(79,181,132,.08);border:0;border-bottom:${composerOpen?"1px solid rgba(79,181,132,.2)":"0"};padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center"
        onclick="composerOpen=!composerOpen;render()">
        <span class="slab" style="color:var(--forest)">${composerOpen?"Create account":"+ Create account"}</span>
        <span style="font-size:10px;color:var(--t3)">${composerOpen?"click to cancel":"compose → save → send"}</span>
      </button>
      ${composerOpen?`<div style="padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:rgba(11,23,16,.5)">
        <div class="controls" style="margin:0"><span class="slab">Type</span>
          ${["advertiser","publisher","internal"].map(t=>chip(inv.type===t,t,`setInvType('${t}')`,MONEY_HINT[t])).join("")}
          <span style="font-size:11px;color:var(--t3)">${MONEY_HINT[inv.type]}</span>
        </div>
        <div class="controls" style="margin:0"><span class="slab">Can</span>
          ${chip(inv.can_edit,(inv.can_edit?"✓ ":"")+"Edit",`inv.can_edit=${!inv.can_edit};render()`)}
          ${chip(inv.can_test,(inv.can_test?"✓ ":"")+"Test conversions",`inv.can_test=${!inv.can_test};render()`)}
        </div>
        <div class="controls" style="margin:0"><span class="slab">Sees</span>
          ${chip(inv.see_rev,(inv.see_rev?"✓ ":"")+"Revenue",`inv.see_rev=${!inv.see_rev};render()`)}
          ${chip(inv.see_pay,(inv.see_pay?"✓ ":"")+"Payout",`inv.see_pay=${!inv.see_pay};render()`)}
        </div>
        <div class="controls" style="margin:0">
          <input id="f-invemail" class="inp" style="flex:1;min-width:220px" type="email" placeholder="user@example.com" value="${esc(inv.email)}" oninput="inv.email=this.value" onkeydown="if(event.key==='Enter')saveInvite()">
          <button class="abtn confirm" onclick="saveInvite()">Save draft</button>
        </div>
        <div style="font-size:11px;color:var(--t3)">Save draft stores it, emailing no one — Send on the list row is the only action that emails. In production a Preview button opens the exact future view in a new tab before anything is saved.</div>
      </div>`:""}
    </div>`;

  return `<div class="drawer">
    <div class="ov" onclick="adminOpen=false;render()"></div>
    <div class="panel">
      <div class="phead">
        <div><span style="font-weight:600">Administration</span><span style="font-size:11.5px;color:var(--t3);margin-left:10px">users, permissions &amp; alerting</span></div>
        <button class="abtn" onclick="adminOpen=false;render()">Close ✕</button>
      </div>
      <div class="pbody">
        <div class="sect" style="margin:0"><div class="sh"><span class="st">Users &amp; permissions</span><span class="ss">nothing is granted by default — every capability is explicit</span></div>
          <div class="sb">${userRows}${inviteRows}${composer}</div>
        </div>
        <div class="sect" style="margin:0"><div class="sh"><span class="st">Incent pool${tipMark("Incent pool",INCENT_NOTE+" Matching runs per query, so adding a domain flags every click that ever came from it — a compliance list that only worked going forward would be useless the day you discover a source.")}</span><span class="ss">referrer domains known to send incentivised traffic</span></div>
          <div class="sb">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">

            ${INCENT_POOL.length===0?`<span style="font-size:11px;color:var(--t3)">Nothing pooled yet.</span>`
              :INCENT_POOL.map(e=>{
                const n=CLICKS.filter(c=>{const h=refererHost(c.referer);return h&&(h===e.domain||h.endsWith("."+e.domain));}).length;
                return `<div style="display:flex;gap:10px;align-items:center;background:rgba(26,47,35,.5);border:1px solid rgba(39,64,47,.6);border-radius:2px;padding:6px 10px">
                  <span style="font-family:var(--mono);font-size:12px;color:#B48AD6">${esc(e.domain)}</span>
                  ${e.note?`<span style="font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis">${esc(e.note)}</span>`:""}

                  <button class="abtn danger" onclick="rmIncent('${e.domain}')">Remove</button>
                </div>`;}).join("")}
            <span style="font-size:11px;color:var(--t3)">Nothing is blocked — the value is finding out before the advertiser does. Subdomains match automatically: go.flexrewards.net is the same operation.</span>
          </div>
        </div>
        <div class="note" style="padding:0">Tip: hit <b style="display:inline;color:var(--t2)">View as</b> on anna@northwindmedia.com (publisher) — revenue vanishes everywhere and advertiser names mask; the rep@northstar row shows the advertiser side. In production this drawer also drives click-domain pools, fallback URLs and alerting.</div>
      </div>
    </div>
  </div>`;
}

// ═══════════════ shell: header, banner, tabs ═══════════════
function setTz(v){ tz=v; render(); toast("Times now shown in "+v); }
function doRefresh(){ genAll(); render(); toast("✓ Data refreshed"); }
function headerHtml(){
  const p=P(), u=USERS.find(x=>x.uid==="u1");
  return `
  <span class="dot"></span><span class="wordmark">Traquery</span><span class="slabel">Performance Tracking</span>
  <div class="right">
    <select class="inp" title="all displayed times shift to this timezone" onchange="setTz(this.value)">${TZS.map(([v])=>`<option value="${v}" ${tz===v?"selected":""}>${v}</option>`).join("")}</select>
    <span id="clock" style="color:var(--t3);font-family:var(--mono);font-size:11px"></span>
    <span class="chip" onclick="doRefresh()">Refresh</span>
    ${p.admin&&!viewAs?`<span class="chip on" onclick="adminOpen=true;render()">Admin</span>`:""}
    <span style="color:var(--t3);font-size:12px;cursor:pointer" title="analytics consent" onclick="toast('Analytics consent — production lets you switch tracking cookies on or off here')">cookies: on</span>
    <span class="avatar">D</span><span class="hide-sm">${u.email}</span>
    <span class="chip" onclick="toast('Demo — production signs out of the Firebase Google session')">Sign out</span>
  </div>`;
}
function bannerHtml(){
  if(!viewAs) return "";
  const u=USERS.find(x=>x.uid===viewAs);
  return `<div class="viewas">
    <span>Viewing as <strong>${esc(u?u.email:viewAs)}</strong> — everything below is exactly what this account sees.</span>
    <button onclick="exitViewAs()">Exit view</button>
  </div>`;
}
function tabsHtml(){
  const canH=P().canEdit||P().admin;
  const tabs=[["dashboard","Dashboard"],["events","Events"],["clicks","Clicks"],...(canH?[["hierarchy","Hierarchy"]]:[])];
  return tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
}

// ═══════════════ render machinery ═══════════════
function render(){
  sanitizeScope();
  const ae=document.activeElement;
  const fid=ae&&ae.id, isText=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA");
  let sel=null; if(fid&&isText){ try{ sel=[ae.selectionStart,ae.selectionEnd]; }catch(e){} }
  $("#hdr").innerHTML=headerHtml();
  $("#banner").innerHTML=bannerHtml();
  $("#tabs").innerHTML=tabsHtml();
  $("#main").innerHTML=({dashboard:pageDashboard,events:pageEvents,clicks:pageClicks,hierarchy:pageHierarchy})[tab]();
  $("#drawer").innerHTML=drawerHtml();
  tickClock();
  if(fid){ const el=document.getElementById(fid);
    if(el){ el.focus(); if(sel&&el.setSelectionRange){ try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } } }
}
function tickClock(){
  const el=$("#clock");
  if(el) el.textContent="updated "+new Date().toLocaleTimeString("en-GB",{timeZone:tz});
}
setInterval(tickClock,1000);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(adminOpen){ adminOpen=false; render(); }
    else if(colSelOpen){ colSelOpen=false; render(); }
  }
});
document.addEventListener("mousedown",e=>{
  if(colSelOpen && !e.target.closest(".colsel") && !e.target.closest(".colselbtn")){ colSelOpen=false; render(); }
});
// boot: the default saved view loads automatically
(function(){
  const def=VIEWS.find(v=>v.is_default===1);
  if(def){ selView=def.id; applyConfig(def.config); schedEmails=def.email_to?def.email_to.split(","):["demo@vane-labs.com"]; schedHour=def.send_hour??9; }
  render();
})();
</script>
</body>
</html>
