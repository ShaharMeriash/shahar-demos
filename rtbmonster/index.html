<title>RTB Monster — Interactive Demo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
:root{
  --forest:#0A4F32;--forest-deep:#07331F;--gold:#BD8C3D;--gold-d:#887B05;
  --bg:#FAFAF7;--surface:#fff;--ink:#0E2419;--muted:#4A5752;
  --danger:#C0392B;--warning:#E67E22;--info:#2980B9;
  --rule:rgba(10,79,50,.14);
  --fd:'Rajdhani',sans-serif;--fb:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
.demo-strip{background:#EAF3EE;border-bottom:1px solid var(--rule);padding:7px 28px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--forest)}
.demo-strip a{color:var(--ink);text-decoration:none;font-weight:600}
header{display:flex;align-items:center;gap:12px;padding:13px 28px;border-bottom:1px solid var(--rule);background:var(--surface)}
header img{width:42px;height:42px}
.lockup .wm{font-family:var(--fd);font-weight:700;font-size:17px;color:var(--gold);letter-spacing:.04em}
.lockup .sub{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
header .pgt{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end;font-family:var(--fd);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--forest)}
.hnav{color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap}
.hnav:hover{color:var(--forest)}
.hnav.cur{color:var(--forest);font-size:14px;font-weight:700;cursor:default}
.fresh{display:inline-flex;align-items:center;gap:5px;font-family:var(--fb);font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}
.fdot{width:8px;height:8px;border-radius:50%;background:#2e8b57;animation:hb 2s infinite}
@keyframes hb{0%,100%{opacity:1}50%{opacity:.3}}
.tzchip{font-family:var(--fb);font-size:12px;letter-spacing:0;text-transform:none;font-weight:400;border:1px solid var(--rule);border-radius:2px;padding:5px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tzchip:hover{border-color:var(--forest);color:var(--forest)}
header select{font-size:12px;padding:5px 8px;border:1px solid rgba(10,79,50,.2);border-radius:2px;font-family:var(--fb);background:#fff;color:var(--ink)}
main{max-width:none;margin:0;padding:18px 28px 60px}
/* pulse bands */
.pulse{background:linear-gradient(135deg,var(--forest-deep),var(--forest));border-radius:2px;color:#EDF5F0;padding:14px 18px;margin-bottom:12px}
.pulse .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pulse .lbl{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#F2C879;display:flex;align-items:center;gap:8px}
.pdot{width:8px;height:8px;border-radius:50%;background:#F2C879;animation:hb 1.6s infinite}
.pulse .hint2{font-size:11px;color:rgba(250,250,247,.55);margin-left:auto}
.pstat .k{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,250,247,.65)}
.pstat .v{font-family:var(--fd);font-weight:700;font-size:22px;line-height:1.15}
.pstat .v small{font-size:12px;font-weight:600;margin-left:4px}
.pace-up{color:#7FD6A4}.pace-down{color:#F0A48E}
.pctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 6px}
.psep{width:1px;height:16px;background:rgba(250,250,247,.25);margin:0 4px;align-self:center}
.pchk b{font-family:var(--fd);font-weight:700;letter-spacing:.02em}
.prefresh{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:600;font-size:12px;letter-spacing:.06em;color:rgba(250,250,247,.75);background:rgba(250,250,247,.06);border:1px solid rgba(250,250,247,.22);border-radius:12px;padding:3px 10px;cursor:pointer}
.prefresh:hover{border-color:var(--gold);color:#FAFAF7}
.prefresh .st{font-size:10px;color:rgba(250,250,247,.5)}
.pchart{position:relative;margin-top:4px}
.pguide{position:absolute;top:0;width:1px;background:rgba(250,250,247,.55);pointer-events:none;display:none}
.ptip{position:absolute;z-index:5;background:#07331F;border:1px solid rgba(250,250,247,.25);border-radius:3px;padding:8px 10px;font-size:11.5px;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(0,0,0,.4);min-width:180px;color:#EDF5F0}
.ptip .tth{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.08em;color:#F2C879;margin-bottom:5px;display:flex;justify-content:space-between;gap:14px}
.ptip .tth span:last-child{color:rgba(250,250,247,.5);font-weight:600}
.ptip table{border-collapse:collapse;width:100%;font-size:11.5px}
.ptip td{padding:1.5px 0;border:0;white-space:nowrap;background:none}
.ptip tr:hover td{background:none}
.ptip td.m{padding-right:12px}
.ptip td.n{text-align:right;font-family:var(--fd);font-weight:700;padding-left:10px}
.ptip td.n.yv{color:rgba(250,250,247,.55);font-weight:600}
.dot2{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pchk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;border:1px solid rgba(250,250,247,.22);border-radius:12px;background:rgba(250,250,247,.06);cursor:pointer;font-family:var(--fd);font-weight:600;letter-spacing:.03em}
.pchk:hover{border-color:rgba(250,250,247,.5)}
.pchk .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.pchk.off{opacity:.5}
.pmovers{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pmover{font-size:11.5px;padding:3px 9px;border:1px solid rgba(250,250,247,.22);border-radius:2px;background:rgba(250,250,247,.07);white-space:nowrap;cursor:pointer}
.pmover:hover{background:rgba(189,140,61,.22);border-color:var(--gold)}
.pmover b{font-family:var(--fd);letter-spacing:.02em}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:14px 16px}
.kpi.hl{border-color:var(--forest);background:rgba(10,79,50,.03)}
.kpi .l{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kpi .v{font-family:var(--fd);font-weight:700;font-size:27px;line-height:1;color:var(--forest)}
.kpi .d{font-size:11px;margin-top:5px}
.up{color:#1f7a00}.down{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:2px;margin-bottom:16px}
.card .h{padding:11px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .h .t{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d)}
.card .h .sub{font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0}
.card .b{padding:12px 16px}
.chip{font-size:12px;padding:3px 10px;border-radius:2px;border:1px solid var(--rule);background:var(--bg);color:var(--muted);cursor:pointer;font-family:var(--fd);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.chip.on{background:rgba(10,79,50,.1);border-color:rgba(10,79,50,.35);color:var(--forest)}
.chip .num{display:inline-block;background:var(--forest);color:#fff;border-radius:50%;width:14px;height:14px;font-size:9.5px;line-height:14px;text-align:center;margin-right:5px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:6px 13px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--forest);color:#FAFAF7}
select,input[type=text],input[type=number],input[type=email]{padding:6px 10px;border:1px solid rgba(10,79,50,.2);border-radius:2px;font-family:var(--fb);font-size:12.5px;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 2px rgba(10,79,50,.08)}
textarea{width:100%;min-height:110px;padding:8px 10px;border:1px solid rgba(10,79,50,.2);border-radius:2px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#fff;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f5f5f2;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.num,td.num{text-align:right;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:11.5px}
td{padding:8px 12px;border-bottom:1px solid rgba(10,79,50,.08);white-space:nowrap}
td.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
tr:hover td{background:rgba(10,79,50,.025)}
tr.total td{font-weight:600;background:rgba(189,140,61,.07);border-top:1px solid var(--rule)}
tr.winner td{background:rgba(10,79,50,.06)}
.pos{color:#1f7a00;font-weight:600}.neg{color:var(--danger);font-weight:600}
.tbl-wrap{overflow-x:auto}
.dv{cursor:pointer;border-bottom:1px dashed transparent}
.dv:hover{color:var(--forest);border-bottom-color:var(--forest)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:13px;background:rgba(10,79,50,.10);border:1px solid var(--forest);color:var(--forest)}
.fchip b{font-weight:600}
.fchip .x{cursor:pointer;font-weight:700;opacity:.7}
.fchip .x:hover{opacity:1}
.fchip.th{background:rgba(189,140,61,.12);border-color:var(--gold);color:#7a5a22}
.sev{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:2px;white-space:nowrap}
.sev.critical{background:rgba(192,57,43,.12);color:var(--danger)}
.sev.warning{background:rgba(230,126,34,.14);color:var(--warning)}
.sev.info{background:rgba(41,128,185,.12);color:var(--info)}
.sev.off{background:rgba(74,87,82,.12);color:var(--muted)}
.cta{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid rgba(10,79,50,.08)}
.cta:last-child{border-bottom:0}
.cta.suppressed{opacity:.5}
.cta .body{flex:1}
.cta .lbl{font-weight:600;font-size:13.5px}
.cta .rec{font-size:12.5px;color:var(--muted);margin-top:2px}
.cta .impact{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--forest);white-space:nowrap}
.btn{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--forest);background:var(--forest);color:#fff;padding:6px 13px;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--forest-deep)}
.btn.ghost{background:none;color:var(--forest)}
.btn.ghost:hover{background:rgba(10,79,50,.07)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.status{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.status.ok{background:rgba(60,204,8,.14);color:#1f7a00}
.status.stale{background:rgba(230,126,34,.14);color:var(--warning)}
.status.missing{background:rgba(192,57,43,.12);color:var(--danger)}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(74,87,82,.12);color:var(--muted)}
.badge.win{background:rgba(10,79,50,.12);color:var(--forest)}
.badge.warn{background:rgba(230,126,34,.14);color:var(--warning)}
.note{font-size:11.5px;color:var(--muted);padding:9px 16px}
.note2{border-left:3px solid var(--gold);background:rgba(189,140,61,.07);padding:9px 12px;font-size:12.5px;margin:10px 16px}
.verdict{font-size:13px;padding:8px 12px;border-radius:2px;background:rgba(10,79,50,.06);border:1px solid var(--rule)}
.stats{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;padding:10px 16px 2px}
.stat .k{font-family:var(--fd);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--fd);font-weight:700;font-size:20px;color:var(--forest)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl-f{display:flex;flex-direction:column;gap:4px;font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.ok{background:rgba(10,79,50,.10);color:var(--forest)}
.pill.bad{background:rgba(192,57,43,.10);color:var(--danger)}
.pill.warn{background:rgba(230,126,34,.12);color:var(--warning)}
.prog{height:8px;background:rgba(10,79,50,.1);border-radius:2px;overflow:hidden;flex:1;min-width:160px}
.prog i{display:block;height:100%;background:var(--forest);width:0;transition:width .12s linear}
.alias{display:inline-block;font-size:11px;padding:2px 8px;margin:1px 2px 1px 0;border-radius:10px;background:rgba(10,79,50,.08);color:var(--forest)}
.alias b{font-weight:600;color:var(--muted)}
.ename{font-weight:600}
.eid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.check .ok{color:#1f7a00;font-weight:700}
#toast{position:fixed;bottom:20px;right:20px;background:var(--forest-deep);color:#FAFAF7;padding:10px 16px;border-radius:2px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:420px}
/* trust/fraud hover explainers: ⓘ marker or dotted underline → dark popover */
.imark{cursor:help;color:var(--muted);font-size:11px;margin-left:4px;font-family:var(--fb);font-weight:400}
.imark:hover{color:var(--forest)}
.udot{border-bottom:1px dotted rgba(74,87,82,.65);cursor:help}
.udot:hover{border-bottom-color:var(--forest)}
#pop{position:fixed;display:none;z-index:100;width:300px;background:#07331F;color:#EDF5F0;border:1px solid rgba(250,250,247,.25);border-radius:2px;padding:10px 12px;font-size:11.5px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.4);pointer-events:none;font-family:var(--fb);text-transform:none;letter-spacing:0;font-weight:400;text-align:left;white-space:normal}
#pop .pt{display:block;font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#F2C879;margin-bottom:4px}
/* demand radar */
.rgrid{display:grid;grid-template-columns:1.75fr 1fr;gap:16px;align-items:start}
@media(max-width:1040px){.rgrid{grid-template-columns:1fr}}
.rgrid>div{min-width:0}
/* radar tables carry the real page's tighter metrics, not the cockpit's monospace grid */
.rtbl th{padding:6px 8px;letter-spacing:.07em}
.rtbl td{padding:8px}
.rtbl td.num{font-family:var(--fb);font-size:12.5px}
tr.rrow{cursor:pointer}
tr.rsel td{background:rgba(189,140,61,.10)}
tr.rsel td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tr.runpriced td{color:var(--muted)}
.rslice{font-weight:600}
.rmix{font-size:11px;color:var(--muted);margin-top:2px;font-weight:400;white-space:normal}
.rmoney{font-family:var(--fd);font-weight:700;font-size:15px;color:var(--forest)}
.rmoney.dim{color:var(--muted);font-size:13px}
.tier{display:inline-block;font-family:var(--fd);font-weight:700;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.tier.proven{background:rgba(10,79,50,.12);color:var(--forest)}
.tier.thin{background:rgba(230,126,34,.14);color:var(--warning)}
.tier.unpriced{background:rgba(74,87,82,.12);color:var(--muted)}
.rkv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dotted var(--rule);font-size:12.5px}
.rkv:last-child{border-bottom:none}
.rkv .n{font-family:var(--fd);font-weight:700}
.rlbl{font-family:var(--fd);font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.rlbl.first{margin-top:0}
.rcomp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.rcomp:last-of-type{border-bottom:none}
.rcomp .who b{font-weight:600}
.rcomp .who span{color:var(--muted);font-size:11px}
.rcomp .num{font-family:var(--fd);font-weight:700;white-space:nowrap;text-align:right;font-size:12.5px}
.rcomp .num span{color:var(--muted);font-weight:600}
.verdict.good{background:rgba(10,79,50,.08);border-color:rgba(10,79,50,.3)}
.verdict.bad{background:rgba(192,57,43,.07);border-color:rgba(192,57,43,.3)}
.verdict b{font-family:var(--fd);font-weight:700}
.rmatch{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule)}
.rmatch:last-child{border-bottom:none}
.rmatch .body{flex:1;min-width:0}
.rmatch .t{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.rmatch .r{color:var(--muted);font-size:11.5px;margin-top:2px}
.rmatch .n{font-family:var(--fd);font-weight:700;color:var(--forest);white-space:nowrap}
.rmatch.supp{opacity:.5}
.flag{font-family:var(--fd);font-weight:700;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:rgba(189,140,61,.16);color:#7a5a22}
.flag.grey{background:rgba(74,87,82,.12);color:var(--muted)}
.rbar{height:5px;background:rgba(10,79,50,.1);border-radius:2px;overflow:hidden;margin-top:5px}
.rbar i{display:block;height:100%;background:var(--gold)}
.evlink{font-size:11px;color:var(--forest);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rhint{font-size:11.5px;color:var(--muted)}
svg text{font-family:var(--fd);font-size:10px}

<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WZD8PMGS"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="demo-strip"><span>◈ Interactive demo — all data is generated sample data</span><a href="../">← Portfolio</a></div>
<header>
  <img src="logo.png" alt="Vane Labs">
  <div class="lockup"><div class="wm">VANE LABS</div><div class="sub">RTB Monster</div></div>
  <div class="pgt" id="hdr"></div>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="pop"></div>
<script>
"use strict";
/* ============ helpers ============ */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry(1337);
const fmt$=n=>n==null?"–":"$"+Math.round(n).toLocaleString();
const usd2=n=>n==null?"–":"$"+Number(n).toFixed(2);
const pct=n=>n==null?"–":(n*100).toFixed(2)+"%";

/* ============ derived metric math ============ */
function derive(s){
  // canonical §4.3 fill rate: requests when the platform reports them, else opportunities
  s.fill_rate=s.requests>0?s.fills/s.requests:(s.opportunities>0?s.fills/s.opportunities:null);
  s.ecpm_sell=s.impressions>0?s.revenue/s.impressions*1000:null;
  s.ecpm_buy=s.impressions>0?s.cost/s.impressions*1000:null;
  s.margin=s.revenue-s.cost;
  s.margin_pct=s.revenue>0?s.margin/s.revenue:null;
  s.bid_rate=s.requests>0?s.bids/s.requests:null;
  s.win_rate=s.requests>0?s.wins/s.requests:null;
  s.cost_cpm=s.impressions>0?s.cost/s.impressions*1000:null;
  // |imps_buy − imps_sell| / imps_sell — the earliest miscounting/billing-fraud signal
  s.discrepancy_abs=(s.impressions>0&&s.impressions_buy>0)?Math.abs(s.impressions_buy-s.impressions)/s.impressions:null;
  return s;
}
function agg(rows,keys){
  const map=new Map();
  for(const r of rows){
    const kv=keys.map(k=>r[k]),key=kv.join("¦");
    let g=map.get(key);
    if(!g){g={_k:kv};for(const m of MEASURES)g[m]=0;map.set(key,g);}
    for(const m of MEASURES)g[m]+=r[m];
  }
  return [...map.values()].map(derive);
}

  let h=days*7+media.length*131+(partner?partner.length*17:5);
  const r=mulberry(4200+h);
  const mk=(w,i)=>media==="web"
    ? (i%2? w+"-daily.com" : w+"news.net")
    : media==="ctv" ? "tv."+w+"stream.app" : "com."+w+"games."+WORDS[(i*7+3)%WORDS.length];
  const items=[];
  for(let i=0;i<34;i++){
    const opps=Math.round(6e4+r()*5e6);
    const fr=0.004+r()*0.085;
    const fills=Math.round(opps*fr);
    const wins=Math.round(fills*1.03), bids=Math.round(opps*(0.1+r()*0.3));
    const revenue=fills*(4+r()*15)/1000;
    items.push({inv:mk(WORDS[i%WORDS.length],i),opps,fills,fill:fr,bids,wins,revenue,zero:false});
  }
  for(let i=0;i<9;i++){ // high-volume zero-fill waste
    const opps=Math.round(4e6+r()*2.4e7);
    items.push({inv:mk(WORDS[(i*3+11)%WORDS.length]+"x",i+40),opps,fills:0,fill:0,bids:Math.round(opps*0.02),wins:0,revenue:0,zero:true});
  }
  return items;
}

function multiSpark(series,uptoIdx,n,ticks){
  const W=960,H=140,padT=10,padB=18,padL=8,padR=8;
  const iW=W-padL-padR,iH=H-padT-padB,last=Math.max(1,n-1);
  const x=i=>padL+iW*i/last;
  let grid="";
  for(const [i,lab] of ticks){
    const anchor=i===0?"start":i===n-1?"end":"middle";
    grid+=`<line x1="${x(i)}" y1="${padT}" x2="${x(i)}" y2="${padT+iH}" stroke="rgba(250,250,247,.1)"/>`+
      `<text x="${x(i)}" y="${H-5}" fill="rgba(250,250,247,.45)" text-anchor="${anchor}">${lab}</text>`;
  }
  let parts="";
  for(const s of series){
    const vals=[...s.cur.slice(0,uptoIdx+1).filter(v=>v!=null),...s.pri.filter(v=>v!=null)];
    const max=Math.max(...vals,1e-9)*1.06;
    const y=v=>padT+iH-iH*v/max;
    const path=(arr,upto)=>{let d="",pen=false;for(let i=0;i<=upto;i++){const v=arr[i];if(v==null){pen=false;continue;}d+=(pen?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1);pen=true;}return d;};
    parts+=`<path d="${path(s.pri,n-1)}" fill="none" stroke="${s.color}" stroke-opacity=".45" stroke-width="1.8" stroke-dasharray="6 5"/>`;
    parts+=`<path d="${path(s.cur,uptoIdx)}" fill="none" stroke="${s.color}" stroke-opacity=".22" stroke-width="7" stroke-linecap="round"/>`;
    parts+=`<path d="${path(s.cur,uptoIdx)}" fill="none" stroke="${s.color}" stroke-width="2.8"/>`;
    for(let i=0;i<=uptoIdx;i++){if(s.cur[i]==null)continue;const now=i===uptoIdx;parts+=`<circle cx="${x(i).toFixed(1)}" cy="${y(s.cur[i]).toFixed(1)}" r="${now?4:2}" fill="${s.color}"${now?' stroke="#07331F" stroke-width="1.5"':""}/>`;}
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto" preserveAspectRatio="none">${grid}${parts}</svg>`;
}

function bindBandHover(id){

  const W=960,padL=8,padR=8,iW=W-padL-padR,last=Math.max(1,data.n-1);
  svg.onmousemove=ev=>{
    const box=svg.getBoundingClientRect();
    const i=Math.max(0,Math.min(last,Math.round(((ev.clientX-box.left)/box.width*W-padL)/iW*last)));
    const gx=(padL+i/last*iW)/W*box.width+svg.offsetLeft;
    guide.style.display="block";guide.style.left=gx+"px";guide.style.top=svg.offsetTop+"px";guide.style.height=box.height+"px";
    const rows=data.metrics.map(k=>{
      const def=CHART_METRICS[k];

      const tv=i<=data.upto?metricOf(data.t,i,k):null;
      return `<tr><td class="m"><span class="dot2" style="background:${def.color}"></span>${def.label}</td><td class="n">${c(tv)}</td><td class="n yv">${c(metricOf(data.y,i,k))}</td></tr>`;
    }).join("");
    tip.innerHTML=`<div class="tth"><span>${data.pointLabel(i)}</span><span>${data.colLabel(i)}</span></div><table>${rows}</table>`;
    tip.style.display="block";
    const tw=tip.offsetWidth||190;

    tip.style.left=(flip?gx-tw-12:gx+12)+"px";tip.style.top=(svg.offsetTop+6)+"px";

function breakdownRows(){
  const grain=S.grain==="hour"?"hour":S.grain==="day"?"date":null;
  let facts=(grain==="hour"?HFACTS:FACTS.filter(r=>r.idx>=NDAYS-7));
  for(const f of S.filt)facts=facts.filter(r=>r[f.dim]===f.val);
  const keys=grain?[grain,...S.dims]:[...S.dims];
  let rows=agg(facts,keys);
  const totals=derive(facts.reduce((a,r)=>{for(const m of MEASURES)a[m]=(a[m]||0)+r[m];return a;},{}));
  if(S.th){
    const t=S.th;
    rows=rows.filter(r=>{const v=r[t.m];if(v==null)return false;
      return t.op===">"?v>t.v:t.op==="<"?v<t.v:Math.abs(v-t.v)<Math.max(Math.abs(t.v)*0.005,1e-9);});
  }
  // Drop chain keys whose column left the view; default to money, biggest first.
  const kidx={};keys.forEach((kk,i)=>kidx["d_"+kk]=i);
  const colKeys=MODE_COLS[S.mode].map(c=>c[0]);
  S.sortc=S.sortc.filter(s=>s.k.startsWith("d_")?(s.k in kidx):colKeys.includes(s.k));
  if(!S.sortc.length)S.sortc=[{k:colKeys.includes("revenue")?"revenue":colKeys.includes("cost")?"cost":colKeys[0],dir:-1}];
  // Dims compare as strings on the RAW value (ISO dates, canonical names), so
  // display formatting never skews order; metrics compare numerically.
  const cmpBy=s=>s.k.startsWith("d_")
    ? (a,b)=>String(a._k[kidx[s.k]]??"").localeCompare(String(b._k[kidx[s.k]]??""),undefined,{numeric:true})*s.dir
    : (a,b)=>((a[s.k]??-1e18)-(b[s.k]??-1e18))*s.dir;
  const cmps=S.sortc.map(cmpBy);
  rows.sort((a,b)=>{for(const c of cmps){const r=c(a,b);if(r)return r;}return 0;});
  return {rows,totals,keys,grain};
}

  }).join("");

      <input id="th-val" type="number" step="any" style="width:90px" placeholder="value" value="${S.th?S.th.v:""}">
      <button class="btn ghost" onclick="applyTh()">Apply</button>
      <span class="sub" style="margin-left:auto">Click any value to filter · view state lives in the URL</span>
    </div>
    ${chips?`<div class="fchips">${chips}</div>`:""}

/* report generator */
function rSetMode(m){R.mode=m;R.metrics=[...R_DEFAULTS[m]];R.est=null;render();}
function rToggleDim(d){const i=R.dims.indexOf(d);if(i>=0){if(R.dims.length>1)R.dims.splice(i,1);}else R.dims.push(d);R.est=null;render();}
function rToggleMetric(m){const i=R.metrics.indexOf(m);if(i>=0){if(R.metrics.length>1)R.metrics.splice(i,1);}else R.metrics.push(m);R.est=null;render();}
function rRows(){
  const keys=R.dims.map(d=>d==="date"?"date":d);
  const facts=FACTS.filter(r=>r.idx>=NDAYS-7);
  return {rows:agg(facts,keys),keys};
}
function rEstimate(){
  const {rows}=rRows();

  R.est={rows:rows.length,bytes};
  render();
}
function rDeliver(){
  if(!R.est)return;

  const lines=rows.map(r=>[...r._k.map(v=>`"${v}"`),...cols.map(([k])=>r[k]==null?"":(typeof r[k]==="number"?r[k].toFixed(4):r[k]))].join(","));
  const name=`rtbm_${R.mode}_${dISO(6)}_${dISO(0)}.csv`;
  dl(name,[head,...lines].join("\n"),"text/csv");

}

/* connection comparison */
function setConn(k){connSel=k;render();}
function comparisonCard(){
  const conn=CONNS.find(c=>c.key===connSel)||CONNS[0];
  const facts=FACTS.filter(r=>r.idx>=NDAYS-7&&r.lane===conn.lane&&r.media===conn.media);
  const rows=agg(facts,["platform"]);
  rows.forEach(r=>{r.hasBuy=LANES.find(l=>l.lane===conn.lane&&l.media===conn.media&&l.platform===r._k[0]).hasBuy;});
  const two=rows.filter(r=>r.hasBuy&&r.margin_pct!=null);
  const best=two.length?Math.max(...two.map(r=>r.margin_pct)):null;
  rows.sort((a,b)=>(b.margin_pct??-1)-(a.margin_pct??-1));
  const cols=[["requests","Requests",fmtM],["fill_rate","Fill rate",pct],["win_rate","Win rate",pct],["ecpm_buy","eCPM buy",usd2],["ecpm_sell","eCPM sell",usd2],["revenue","Revenue",fmt$],["margin_pct","Margin %",pct]];
  const body=rows.map(r=>{
    const winner=two.length>1&&r.hasBuy&&r.margin_pct===best;
    const badge=r.hasBuy?(winner?' <span class="badge win">best margin</span>':""):' <span class="badge">one-sided</span>';
    return `<tr class="${winner?"winner":""}"><td>${esc(r._k[0])}${badge}</td>`+
      cols.map(([k,,f])=>`<td class="num">${r.hasBuy||["requests","fill_rate","ecpm_sell","revenue"].includes(k)?f(r[k]):"–"}</td>`).join("")+"</tr>";
  }).join("");
  return `<div class="card">
    <div class="h"><span class="t">Connection comparison</span><span class="sub">— same connection, which platform wins?</span></div>
    <div class="b row"><select onchange="setConn(this.value)" style="max-width:460px">
      ${CONNS.map(c=>`<option value="${c.key}" ${c.key===connSel?"selected":""}>${c.lane} · ${c.media} — ${c.platforms.length} platform${c.platforms.length>1?"s":""} (${fmt$(c.revenue)})</option>`).join("")}
    </select></div>
    <div class="tbl-wrap"><table><tr><th>Platform</th>${cols.map(c=>`<th class="num">${c[1]}</th>`).join("")}</tr>${body}</table></div>
    <div class="note">One-sided = only sell-side reports delivered for that platform — buy metrics unavailable, margin ungraded.</div>
  </div>`;
}

function startUpload(){
  const adapter=$("#up-adapter").value;
  const file=$("#up-file").files[0];
  if(!adapter){toast("Pick an adapter first");return;}
  if(!file){toast("Pick a file first");return;}
  UP={active:true,pct:0,phase:"upload",adapter,mb:(file.size/1048576).toFixed(1)};
  render();
  const tick=setInterval(()=>{
    if(UP.phase==="upload"){
      UP.pct=Math.min(100,UP.pct+6+rnd()*13);
      if(UP.pct>=100){UP.phase="ingest";UP.pct=100;}
    }else if(UP.phase==="ingest"){
      UP.ingestT=(UP.ingestT||0)+1;
      if(UP.ingestT>=9){
        clearInterval(tick);
        const rows=Math.round(8000+rnd()*34000),q=Math.round(rnd()*7),rev=rnd()<0.5?1:0;
        RUNS.unshift({when:"Just now",src:adapter.replace("group:","")+(adapter.startsWith("group:")?" (both sides)":""),mode:"manual upload",rows,q,rev});
        if(rev)REVIEW.push({platform:adapter.startsWith("group:")?"platform_two":adapter.split("_").slice(0,2).join("_"),raw:"NewPartner_"+Math.round(rnd()*900+100),kind:rnd()<0.5?"demand":"supply"});
        UP={active:false,done:`Done: ${rows.toLocaleString()} rows loaded, ${q} quarantined, ${rev} name${rev===1?"":"s"} to review.`};
        toast("Ingest complete — run appended to the board");
        render();return;
      }
    }
    const bar=document.getElementById("up-bar"),lab=document.getElementById("up-label");
    if(bar)bar.style.width=UP.pct+"%";
    if(lab)lab.textContent=UP.phase==="upload"?`Uploading ${UP.mb} MB — ${Math.floor(UP.pct)}% (stay on the page)`:`Upload complete — ingesting ${UP.mb} MB through ${UP.adapter}…`;
  },110);
}

function wlBuild(){

  const bl=items.filter(x=>x.zero&&x.opps>=W.minReq).sort((a,b)=>b.opps-a.opps);
  const revAll=items.reduce((a,x)=>a+x.revenue,0),oppsAll=items.reduce((a,x)=>a+x.opps,0);

/* ============ MAPPER ============ */
function mSet(k,v){M[k]=k==="take"?Number(v):v;if(k==="side")render();}
function mParse(){
  M.sample=$("#m-sample").value;
  const lines=M.sample.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){toast("Paste a sample report first");return;}
  const first=lines[0];
  const counts={";":(first.match(/;/g)||[]).length,",":(first.match(/,/g)||[]).length,"\t":(first.match(/\t/g)||[]).length};
  M.delim=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  M.headers=lines[0].split(M.delim).map(s=>s.trim().replace(/^"|"$/g,""));
  M.rows=lines.slice(1).map(l=>l.split(M.delim).map(s=>s.trim()));
  M.mapping={};M.keys={};
  for(const h of M.headers){
    const g=guessField(h);
    if(g)M.mapping[h]=g;
    M.keys[h]=["event_date","supply_tag","demand_name_raw","geo_country"].includes(g);
  }
  M.parsed=true;M.result=null;
  toast(`Parsed ${M.rows.length} rows — delimiter "${M.delim===String.fromCharCode(9)?"tab":M.delim}"`);
  render();
}
function mMap(h,f){M.mapping[h]=f;if(!f)delete M.mapping[h];M.result=null;}
function mKey(h,on){M.keys[h]=on;M.result=null;}
function mValidate(){
  const fields=Object.values(M.mapping);
  if(!fields.includes("event_date")){toast("Map a date column to event_date");return;}
  if(!fields.includes(M.side==="sell"?"revenue_raw":"cost_raw")){toast(`Map a money column to ${M.side==="sell"?"revenue_raw":"cost_raw"}`);return;}
  const col=f=>M.headers.findIndex(h=>M.mapping[h]===f);
  const fx=FX[M.currency.toUpperCase()]??1;
  const takeMul=M.fee==="gross"?1-M.take:1;
  const keyCols=M.headers.map((h,i)=>M.keys[h]?i:-1).filter(i=>i>=0);
  const seen=new Set();let dupes=0,negatives=0;
  const facts=M.rows.map(r=>{
    const g=f=>{const i=col(f);return i>=0?r[i]:null;};
    const money=Number(g(M.side==="sell"?"revenue_raw":"cost_raw"))||0;
    const nk=keyCols.map(i=>r[i]).join("|");
    if(seen.has(nk))dupes++;seen.add(nk);
    const req=Number(g("requests"))||0,imp=Number(g("impressions"))||0,fil=Number(g("fills"))||0;
    if(money<0||req<0||imp<0)negatives++;
    const demandRaw=g("demand_name_raw")||"—";
    return {date:g("event_date"),tag:g("supply_tag")||g("app_bundle")||"—",demand:demandRaw,
      geo:g("geo_country")||"—",requests:req,fills:fil,impressions:imp,
      usd:money*fx*takeMul,nk};
  });
  const aliasKnown=new Set(["Demand C","Demand D","Demand E","Demand G"]);
  const unresolved=[...new Set(facts.map(f=>f.demand))].filter(d=>d!=="—"&&!aliasKnown.has(d));
  M.result={facts,dupes,negatives,unresolved,fx,takeMul,
    checks:[
      [`header row parsed — delimiter "${M.delim}" · ${M.headers.length} columns`,true],
      [`event_date mapped &amp; parseable (${facts[0]?.date??"—"})`,facts.every(f=>/^\d{4}-\d{2}-\d{2}$/.test(f.date||""))],
      [`money column mapped (${M.side==="sell"?"revenue_raw":"cost_raw"})`,true],
      [`currency resolved — ${M.currency.toUpperCase()} → USD @ ${fx}`,true],
      [`fee model applied — ${M.fee==="gross"?`gross − ${(M.take*100).toFixed(0)}% take → net`:"reported net, no adjustment"}`,true],
      [`timezone normalized — ${M.tz} → UTC`,true],
      [`partner names resolved — ${[...new Set(facts.map(f=>f.demand))].length-unresolved.length}/${[...new Set(facts.map(f=>f.demand))].length} aliases matched`,unresolved.length===0],
      [`no negative measures`,negatives===0],
      [`dedup key unique across sample (${keyCols.length} key columns)`,dupes===0],
    ]};
  render();
}

   same signature. A slice with no comparable lane is never counted as money. */
const rusd=n=>"$"+Number(n).toLocaleString("en-US",n<100?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0});
const rpct=f=>f==null?"—":(f*100)<0.1?(f*100).toFixed(3)+"%":(f*100).toFixed(2)+"%";
function pctl(a,q){
  const s=[...a].sort((x,y)=>x-y);
  if(!s.length)return 0;
  const i=(s.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);
  return lo===hi?s[lo]:s[lo]+(i-lo)*(s[hi]-s[lo]);
}

  {media:"In-app",ad:"video",integ:"S2S",geo:"BR",vet:"unvetted",unfilled:6.05e6,
   mix:[["Supply B",.82],["Supply A",.18]],comps:[],
   matches:[{d:"Demand E",supp:true}]},
  {media:"CTV",ad:"video",integ:"VAST tag",geo:"CA",vet:"vetted",unfilled:2.90e6,
   mix:[["Supply A",.91],["Supply B",.09]],comps:[],matches:[]},
];
/* demand clearing well on a signature we barely feed — the supply shopping list */
const RSTARVED=[
  {d:"Demand D",sl:0,fill:8.20,ecpm:21.40,imps:6.4e5,app:86},
  {d:"Demand E",sl:1,fill:8.90,ecpm:12.80,imps:4.8e5,app:74},
  {d:"Demand C",sl:2,fill:7.42,ecpm:15.40,imps:5.4e5,app:68},
  {d:"Demand G",sl:5,fill:6.40,ecpm:11.00,imps:1.75e5,app:51},
  {d:"Demand G",sl:3,fill:6.20,ecpm:4.10,imps:1.8e5,app:37},
];
let RD={days:28,minOpps:1e6,sel:0,offer:null};
const rLabel=s=>`${s.media} ${s.ad} · ${s.integ} · ${s.geo} · ${s.vet}`;
/* sub-1% holders are noise in a three-name summary — drop them */
const rMix=s=>s.mix.filter(([,sh])=>sh>=0.01).map(([n,sh])=>`${n} ${(sh*100).toFixed(0)}%`).join(" · ");
/* A longer window is more evidence, not more inventory: comps can only be observed
   for as many days as the window holds, and the daily gap drifts a little with it. */
function rCompute(i){
  const s=RSL[i],days=RD.days;
  const comps=s.comps.map(([sup,dem,plat,d,rev,fill,ecpm])=>({sup,dem,plat,days:Math.min(d,days),
    rev:rev*Math.min(d,days)/d,fill,ecpm}));
  const evDays=comps.length?Math.max(...comps.map(c=>c.days)):0;
  const medFill=comps.length?pctl(comps.map(c=>c.fill),.5):null;
  const p25=comps.length?pctl(comps.map(c=>c.ecpm),.25):null;
  const unfilled=s.unfilled*(1+(days-28)/28*0.06);
  return {...s,id:i,comps,evDays,med_fill:medFill,p25_ecpm:p25,unfilled_day:unfilled,
    recoverable:comps.length?unfilled*medFill*p25/1000:0,
    tier:!comps.length?"unpriced":(comps.length>=2&&evDays>=14?"proven":"thin"),
    dist:comps.length?{fill:[.25,.5,.75].map(q=>pctl(comps.map(c=>c.fill),q)),
                       ecpm:[.25,.5,.75].map(q=>pctl(comps.map(c=>c.ecpm),q))}:null};
}
const rVisible=()=>RSL.map((_,i)=>rCompute(i))
  .filter(g=>g.unfilled_day*RD.days>=RD.minOpps)
  .sort((a,b)=>b.recoverable-a.recoverable||b.unfilled_day-a.unfilled_day);
const rSel=()=>rCompute(RD.sel);
const rDefOffer=g=>g.p25_ecpm==null?0:Math.round(g.p25_ecpm*0.9*100)/100;
const rOfferVal=g=>RD.offer==null?rDefOffer(g):RD.offer;
function rSetDays(v){RD.days=Number(v);RD.offer=null;sync();}
function rSetFloor(v){RD.minOpps=Number(v);sync();}
function rPick(i){RD.sel=i;RD.offer=null;sync();}
function rQuote(v){RD.offer=parseFloat(v||"0");const el=$("#r-verdict");if(el)el.outerHTML=rVerdictHTML();}
/* The cockpit filters on lane-level dims — geo and vetting are fact-level and
   don't exist as lane filters, so the handoff carries the media type. */
function rOpenAnalysis(){
  const g=rSel();
  S.tab="cockpit";S.mode="supply";S.dims=["lane"];S.grain="auto";S.th=null;
  S.filt=[{dim:"media",val:{CTV:"CTV","In-app":"In-app",Web:"Web video"}[g.media]}];
  sync();window.scrollTo(0,0);
  toast(`Analysis filtered to ${g.media} — geo and vetting are fact-level dims the lane view can't filter yet`);
}
function rVerdictHTML(){
  const g=rSel();
  if(!g.comps.length)return `<div class="verdict" id="r-verdict">Unpriced slice — no clearing evidence, so any quote here is a bet, not a valuation.</div>`;
  const offer=rOfferVal(g),at=cpm=>g.unfilled_day*g.med_fill*cpm/1000;
  const mine=at(g.p25_ecpm),theirs=at(offer);
  if(offer>=g.p25_ecpm)return `<div class="verdict good" id="r-verdict"><b>Take it.</b> ${rusd(offer)} is at or above your p25 clearing price (${rusd(g.p25_ecpm)}). At ${rpct(g.med_fill)} comparable fill this lane returns <b>${rusd(theirs)}/day</b>.</div>`;
  return `<div class="verdict bad" id="r-verdict"><b>Counter.</b> ${rusd(offer)} sits below your p25 clearing price (${rusd(g.p25_ecpm)}) — ${rusd(theirs)}/day vs ${rusd(mine)}/day, leaving <b>${rusd(mine-theirs)}/day</b> on the table. Open at ${rusd(g.p25_ecpm*1.15)}.</div>`;
}
function pageRadar(){
  const rows=rVisible(),g=rSel();
  const T=(t,k)=>rows.filter(r=>r.tier===t).reduce((a,r)=>a+r[k],0);
  const N=t=>rows.filter(r=>r.tier===t).length;
  const gapRows=rows.length?rows.map(r=>`
    <tr class="rrow ${r.id===RD.sel?"rsel":""} ${r.tier==="unpriced"?"runpriced":""}" onclick="rPick(${r.id})">
      <td><div class="rslice">${rLabel(r)}</div><div class="rmix">${rMix(r)}</div></td>
      <td class="num">${fmtM(r.unfilled_day)}</td>
      <td class="num">${r.comps.length?rpct(r.med_fill):"—"}</td>
      <td class="num">${r.comps.length?rusd(r.p25_ecpm):"—"}</td>
      <td class="num">${r.comps.length?`<span class="rmoney${r.tier==="thin"?" dim":""}">${rusd(r.recoverable)}</span>`:`<span class="rhint">no evidence</span>`}</td>
      <td><span class="tier ${r.tier}">${r.tier}</span><div class="rmix">${r.comps.length?`${r.comps.length} lane${r.comps.length>1?"s":""} · ${r.evDays}d`:"no comparable lane"}</div></td>
    </tr>`).join("")
    :`<tr><td colspan="6" class="rhint">No slices above the opportunity floor in this window.</td></tr>`;
  const starved=RSTARVED.map(s=>{const sl=RSL[s.sl];return `
    <tr class="rrow ${s.sl===RD.sel?"rsel":""}" onclick="rPick(${s.sl})">
      <td><div class="rslice">${s.d}</div><div class="rmix">${rLabel(sl)}</div></td>
      <td class="num">${s.fill.toFixed(2)}%</td>
      <td class="num">${rusd(s.ecpm)}</td>
      <td class="num">${fmtM(s.imps)}</td>
      <td class="num"><span class="rmoney" style="font-size:14px">${s.app}</span><div class="rbar"><i style="width:${s.app}%"></i></div></td>
    </tr>`;}).join("");
  const comps=g.comps.length?g.comps.map(c=>`
    <div class="rcomp">
      <div class="who"><b>${c.sup} × ${c.dem}</b><br><span>${c.plat} · ${c.days}d · ${rusd(c.rev)}</span></div>
      <div class="num">${rpct(c.fill)}<br><span>${rusd(c.ecpm)}</span></div>
    </div>`).join("")
    :`<div class="rhint">No lane in the book has ever cleared this signature. Nothing to price against — the slice is listed as evidence-free and excluded from the headline total.</div>`;
  const live=g.matches.filter(m=>!m.supp),supp=g.matches.filter(m=>m.supp);
  const matchHTML=[
    ...live.map(m=>`
      <div class="rmatch">
        <div class="body">
          <div class="t">${m.d}${m.tp?`<span class="flag">Transplant</span>`:""}${m.seen<14?`<span class="flag grey">Thin</span>`:""}</div>
          <div class="r">${m.tp
            ? `Clears this slice via ${m.tp.join(", ")} — no lane with ${m.miss.join(", ")}.`
            : `Already paired with every gap supplier — a volume conversation, not a wiring job.`}</div>
          <div class="r" style="margin-top:3px">${fmtM(m.imps)} imps/day · ${m.plats.join(", ")} · ${m.seen}d</div>
        </div>
        <div class="n">${rusd(m.ecpm)}</div>
      </div>`),
    ...supp.map(m=>`
      <div class="rmatch supp">
        <div class="body">
          <div class="t">${m.d}<span class="flag grey">Suppressed</span></div>
          <div class="r">Offered this slice, never cleared the evidence floor.</div>
        </div>
        <div class="n">—</div>
      </div>`),
  ].join("");
  return `<div class="pulse">
    <div class="top">
      <span class="lbl"><span class="pdot"></span>Unsold book</span>
      <div style="margin-left:24px" class="pstat"><div class="k">Recoverable / day · proven</div><div class="v">${rusd(T("proven","recoverable"))}<small>${N("proven")} slices</small></div></div>
      <div style="margin-left:24px" class="pstat"><div class="k">Thin evidence</div><div class="v">${rusd(T("thin","recoverable"))}<small>${N("thin")} slices</small></div></div>
      <div style="margin-left:24px" class="pstat"><div class="k">Unpriced</div><div class="v">${fmtM(T("unpriced","unfilled_day"))}<small>opps / day · ${N("unpriced")} slices</small></div></div>
      <div class="hint2" style="max-width:250px;text-align:right">Priced at p25 clearing eCPM × comparable median fill. Unpriced slices are never counted as opportunity.</div>
    </div>
  </div>
  <div class="rgrid">
    <div>
      <div class="card">
        <div class="h"><span class="t">Gap ledger — what I can't sell</span>
          <span class="sub">— unfilled opportunity priced from lanes that already clear the same signature</span>
          <span class="row" style="margin-left:auto">
            <select onchange="rSetDays(this.value)">${[7,14,28,60,90].map(d=>`<option value="${d}" ${RD.days===d?"selected":""}>${d} days</option>`).join("")}</select>
            <select onchange="rSetFloor(this.value)">${[[1e5,"≥100k opps"],[1e6,"≥1M opps"],[1e7,"≥10M opps"],[1e8,"≥100M opps"]].map(([v,l])=>`<option value="${v}" ${RD.minOpps===v?"selected":""}>${l}</option>`).join("")}</select>
          </span></div>
        <div class="tbl-wrap"><table class="rtbl">
          <tr><th>Slice · supply mix</th><th class="num">Unfilled / day</th><th class="num">Comp. fill</th><th class="num">eCPM p25</th><th class="num">Recoverable / day</th><th>Evidence</th></tr>
          ${gapRows}
        </table></div>
        <div class="note">Click a row to price it. A slice with no comparable lane stays unpriced — it is inventory, not money, until something clears it.</div>
      </div>
      <div class="card">
        <div class="h"><span class="t">Starved demand — the mirror</span><span class="sub">— buyers clearing well on a signature we barely feed</span></div>
        <div class="tbl-wrap"><table class="rtbl">
          <tr><th>Demand · signature</th><th class="num">Fill</th><th class="num">eCPM</th><th class="num">Imps / day</th><th class="num">Appetite</th></tr>
          ${starved}
        </table></div>
        <div class="note">This is a supply shopping list — the demand is already proven, the inventory isn't there to feed it.</div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="h"><span class="t">Price book</span></div>
        <div class="b">
          <div class="rhint" style="margin-bottom:2px">${rLabel(g)}</div>
          <div class="rlbl">Comparable clearing lanes</div>
          ${comps}
          <div class="rlbl">Distribution</div>
          <div class="rkv"><span>Fill rate — p25 / p50 / p75</span><span class="n">${g.dist?g.dist.fill.map(rpct).join(" / "):"—"}</span></div>
          <div class="rkv"><span>eCPM sell — p25 / p50 / p75</span><span class="n">${g.dist?g.dist.ecpm.map(rusd).join(" / "):"—"}</span></div>
          <div class="rlbl">Quote check</div>
          <div class="row"><span class="rhint">Partner offers</span>
            <input type="number" value="${rOfferVal(g).toFixed(2)}" step="0.05" min="0" style="width:90px" oninput="rQuote(this.value)">
            <span class="rhint">CPM</span></div>
          ${rVerdictHTML()}
          <div style="margin-top:10px"><span class="evlink" onclick="rOpenAnalysis()">Open this slice in Analysis →</span></div>
        </div>
      </div>
      <div class="card">
        <div class="h"><span class="t">Match list — who do I call</span></div>
        <div class="b">${matchHTML||`<div class="rhint">No demand in the book touches this signature. A prospecting slice — worth an outbound conversation, not a wiring job.</div>`}</div>
      </div>
    </div>
  </div>
  <div class="note" style="padding:0 4px">Every number traces to lanes that actually ran. Slices inherit coverage from their contributing lanes; unresolved entities fragment comparables — keep the alias review queue clean.</div>`;
}

/* ============ shell ============ */
function setTab(t){S.tab=t;sync();window.scrollTo(0,0);}
function headerRight(){
  const NAV=[["radar","Radar"],["partners","Partners"],["whitelist","Whitelists"],["ops","Ops board →"],["mapper","Mapper"],["cockpit","Operations cockpit"]];
  const mins=((Date.now()/60000|0)%38)+5; // fake data age
  const now=new Date();
  const hm=String(now.getUTCHours()).padStart(2,"0")+":"+String(now.getUTCMinutes()).padStart(2,"0");
  return `<span class="fresh"><span class="fdot"></span>data ${mins}m ago</span>`
    +NAV.map(([k,l])=>`<span class="hnav ${S.tab===k?'cur':''}" onclick="setTab('${k}')">${l}</span>`).join("")
    +`<span class="tzchip" onclick="toast('Timezone picker — searchable by city or offset in production; the demo pins UTC')">UTC+00:00 · UTC · ${hm}</span>`
    +`<select onchange="setKwin(this.value)">${[[7,"Last 7 days"],[14,"Last 14 days"],[30,"Last 30 days"]].map(([v,l])=>`<option value="${v}" ${S.kwin===v?"selected":""}>${l}</option>`).join("")}</select>`;
}
function render(){
  $("#hdr").innerHTML=headerRight();
  $("#main").innerHTML=({cockpit:pageCockpit,ops:pageOps,whitelist:pageWhitelist,partners:pagePartners,mapper:pageMapper,radar:pageRadar})[S.tab]();
  if(S.tab==="cockpit"){bindBandHover("pulse");bindBandHover("daily");}
}
loadHash();
pushHash();
render();
</script>
</body>
</html>
